    h += '<div class="card"><div class="ch">' +
      '<h2>🏷 '+esc(b.tenBan)+' <span class="chip">'+b.soDon+' đơn</span></h2>' +
      '<div class="nho mo">Cộng <b>'+tien(b.tong)+'</b>' +
      ( b.url ? ' · <a href="'+esc(b.url)+'" target="_blank" rel="noopener">mở trang mảng ↗</a>' : '' ) +
      '</div></div><div class="cb">';

    if (!rows.length){
      h += '<p class="mo">Không có đơn nào khớp bộ lọc.</p>';
    } else {
      /* Dải đếm theo bước — nhìn một cái là thấy đang ùn ở khâu nào. */
      var dem = {};
      rows.forEach(function(r){ dem[r.trangThai] = (dem[r.trangThai]||0) + 1; });
      h += '<div style="margin-bottom:8px">' +
        buoc.map(function(bc){
          var n = dem[bc.tt] || 0, m = mauBuoc(bc.tt);
          return '<span class="dem-chip"'+( n ? ' style="background:'+m.nen+';border-color:'+m.vien+';color:'+m.chu+'"' : '' )+'>' +
                 esc(bc.ten)+': <b>'+n+'</b></span>';
        }).join('') + '</div>';

      /* Mỗi BƯỚC một bảng, theo đúng thứ tự quy trình. */
      buoc.forEach(function(bc){
        var ds = rows.filter(function(r){ return r.trangThai === bc.tt; });
        if (!ds.length) return;
        /* 🔴 Ai nộp trước lên trước — trừ hai bước cuối (đã xong) thì mới nhất trước. */
        var xong = ( bc.tt === 'Đã quyết toán' || bc.tt === 'Đã xuất MISA' );
        ds = ds.slice().sort(function(a,c){
          var x = String(a.ngayTao||''), y = String(c.ngayTao||'');
          return xong ? ( x > y ? -1 : ( x < y ? 1 : 0 ) ) : ( x < y ? -1 : ( x > y ? 1 : 0 ) );
        });
        var tg = 0;
        ds.forEach(function(r){ if (r.tien !== null) tg += Number(r.tien); });

        var m = mauBuoc(bc.tt);
        h += '<div class="buoc" style="border-left-color:'+m.chu+';background:'+m.nenNhat+'">' +
             '<div class="buoc-dau">' +
               '<span class="buoc-ten" style="color:'+m.chu+'">'+m.bieu+' '+esc(bc.ten) +
                 '<span class="buoc-so" style="background:'+m.nen+';color:'+m.chu+'">'+ds.length+' đơn</span></span>' +
               '<span class="nho" style="color:'+m.chu+';font-weight:700">Cộng '+tien(tg)+'</span>' +
             '</div>' +
             '<div class="cuon" style="border-color:'+m.vien+'"><table>' +
             '<thead><tr style="background:'+m.nen+'">' +
               '<th style="background:'+m.nen+';color:'+m.chu+'">Mã đơn</th>' +
               '<th style="background:'+m.nen+';color:'+m.chu+'">Người nhập</th>' +
               '<th style="background:'+m.nen+';color:'+m.chu+'">Kỳ</th>' +
               '<th style="background:'+m.nen+';color:'+m.chu+'">Lúc nhập</th>' +
               '<th class="r" style="background:'+m.nen+';color:'+m.chu+'">Số tiền</th></tr></thead><tbody>' +
             ds.map(function(r, k){
               /* Số thứ tự trong hàng chờ: "ai nộp trước lên trước" chỉ có nghĩa khi nhìn thấy
                  được thứ tự. Bảng đã xong thì đánh số vô nghĩa nên bỏ. */
               var stt = xong ? '' : '<span class="mo nho" style="margin-right:6px">'+(k+1)+'.</span>';
               return '<tr><td>'+stt+'<b>'+esc(r.maDon)+'</b></td><td>'+esc(r.nguoiLap)+'</td>' +
                      '<td class="nho">'+esc(r.ky)+'</td>' +
                      '<td class="nho mo">'+esc(ngay(r.ngayTao))+'</td>' +
                      '<td class="r tien" style="color:'+( r.tien ? m.chu : '#94a3b8' )+'">' +
                      ( r.tien===null ? '<span class="mo">—</span>' : tien(r.tien) )+'</td></tr>';
             }).join('') +
             '</tbody><tfoot><tr><td colspan="4" class="r">Cộng '+ds.length+' đơn</td>' +
             '<td class="r" style="color:'+m.chu+'">'+tien(tg)+'</td></tr></tfoot></table></div></div>';
      });
    }
    h += '</div></div>';
  });

  if ((k.ban||[]).length > 1){
    h += '<div class="card"><div class="cb" style="display:flex;justify-content:space-between;' +
         'align-items:center;flex-wrap:wrap;gap:8px"><b>Cộng cả '+(k.ban||[]).length+' mảng · ' +
         k.soDon+' đơn</b><span style="font-size:18px;font-weight:800;color:#0f766e">'+tien(k.tong)+'</span>' +
         '</div></div>';
  }
  o.innerHTML = h;
}

/* ══════════════════════════════════════════════════════════════════════════════════════════════
 * MÀN CẤU HÌNH — AI LÀM MẢNG NÀO
 * ══════════════════════════════════════════════════════════════════════════════════════════════
 * Anh Thắng 14/09/2026: *"bổ sung tab cấu hình trên trang chi phí tổng, để cấp quyền truy cập
 * duyệt theo mảng mình làm việc"*.
 *
 * 🔴 Ở ĐÂY KHAI PHẠM VI, KHÔNG KHAI QUYỀN. Quyền LÀM GÌ (duyệt · cấp tiền · trả lại · quyết toán ·
 *    xuất MISA) vẫn nằm ở bảng Phân quyền của từng trang mảng và chỉ ở đó. Màn này trả lời câu
 *    mà một mình trang tổng biết: người có mặt ở ba mảng thì PHỤ TRÁCH mảng nào.
 *
 * ⚠️ TÍCH HẾT = KHÔNG BÓ GÌ. Giữ danh sách đầy đủ trong sổ thì ngày mai thêm mảng thứ năm là
 *    người ấy lặng lẽ không thấy mảng mới — đúng cái bẫy "danh sách tên khai tay" đã tránh ở
 *    cửa vào trang.
 * ══════════════════════════════════════════════════════════════════════════════════════════════ */
var CH = { kq: null, dangDoc: false };

function veCauHinh(){
  var o = document.getElementById('bang');
  if (!CH.kq){ o.innerHTML = '<p class="mo">Đang đọc…</p>'; docCauHinh(); return; }
  var k = CH.kq, bans = k.bans || [];

  var h = '<div class="card"><div class="ch"><h2>⚙️ Cấu hình — ai làm mảng nào</h2></div>' +
    '<div class="cb"><p class="nho mo">Trang tổng <b>không khai quyền</b>: ai được duyệt, cấp tiền, ' +
    'quyết toán hay xuất MISA vẫn khai ở bảng <b>Phân quyền</b> của từng trang mảng. Ở đây chỉ bó ' +
    '<b>phạm vi mảng</b> — người có tài khoản ở nhiều mảng thì làm việc trên trang này ở mảng nào.</p>' +
    '<p class="nho mo">Bỏ tích một mảng = người ấy <b>không thấy và không bấm được</b> đơn của mảng ' +
    'đó trên trang tổng. <b>Tích hết = không bó gì</b> — mảng mới thêm sau này họ cũng thấy luôn.</p>' +
    '<div class="cuon" style="margin-top:10px"><table><thead><tr><th>Người</th>' +
    bans.map(function(b){ return '<th style="text-align:center">'+esc(b.ten)+'</th>'; }).join('') +
    '<th>Vai ở từng mảng</th></tr></thead><tbody>';

  (k.ds||[]).forEach(function(x, i){
    h += '<tr><td><b>'+esc(x.ten)+'</b>' +
      ( x.vao ? '' : '<div class="nho" style="color:#b45309">không vào được trang tổng</div>' ) + '</td>';
    bans.forEach(function(b){
      var coMat = (x.coMat||[]).indexOf(b.ban) >= 0;
      /* ⚠️ KHÔNG CÓ TÀI KHOẢN Ở MẢNG ẤY THÌ KHÔNG CÓ Ô TÍCH. Bày ô rồi tích vào cũng không mở
         được gì (sổ phạm vi chỉ THU HẸP, không nới ra) — một ô tích không làm gì là lời nói dối
         nhỏ mà người khai sẽ tin. */
      if (!coMat){ h += '<td style="text-align:center" class="mo nho" title="Không có tài khoản ở mảng này">—</td>'; return; }
      var lam = ( x.lam === null || x.lam === undefined ) ? null : x.lam;
      var tich = ( lam === null ) || ( lam.indexOf(b.ban) >= 0 );
      h += '<td style="text-align:center"><input type="checkbox" data-i="'+i+'" data-ban="'+esc(b.ban)+'"' +
           ( tich ? ' checked' : '' ) + '></td>';
    });
    var vai = [];
    Object.keys(x.vai||{}).forEach(function(kb){ vai.push(tenBanNgan(bans,kb)+': '+(x.vai[kb]||'—')); });
    h += '<td class="nho mo">'+esc(vai.join(' · '))+'</td></tr>';
  });

  h += '</tbody></table></div>' +
    '<div style="margin-top:12px;display:flex;gap:8px;align-items:center">' +
    '<button class="btn b-g" id="chLuu">💾 Lưu phạm vi mảng</button>' +
    '<span class="nho mo" id="chTin"></span></div></div></div>';
  o.innerHTML = h;

  document.getElementById('chLuu').onclick = function(){ luuCauHinh(); };
}

function tenBanNgan(bans, khoa){
  for (var i=0;i<bans.length;i++){ if (bans[i].ban === khoa) return bans[i].ten; }
  return khoa;
}

function docCauHinh(){
  if (CH.dangDoc) return;
  CH.dangDoc = true;
  goi('cauHinh',{}).then(function(r){
    CH.dangDoc = false;
    if (r && r.error){
      document.getElementById('bang').innerHTML = '<div class="bao bao-loi">'+esc(r.error)+'</div>';
      return;
    }
    CH.kq = r; veCauHinh();
  }).catch(function(){
    CH.dangDoc = false;
    document.getElementById('bang').innerHTML = '<div class="bao bao-loi">Không gọi được máy chủ.</div>';
  });
}

function luuCauHinh(){
  var o = document.getElementById('bang');
  var gom = {};
  Array.prototype.forEach.call(o.querySelectorAll('input[type=checkbox][data-i]'), function(n){
    var i = n.getAttribute('data-i');
    if (!gom[i]) gom[i] = [];
    if (n.checked) gom[i].push(n.getAttribute('data-ban'));
  });
  var ds = CH.kq.ds || [], can = [];
  Object.keys(gom).forEach(function(i){ if (ds[+i]) can.push({ ten: ds[+i].ten, mang: gom[i] }); });
  if (!can.length) return;

  var tin = document.getElementById('chTin');
  var nut = document.getElementById('chLuu');
  nut.disabled = true; if (tin) tin.textContent = 'Đang lưu…';
  /* Lưu tuần tự từng người: mỗi người một dòng sổ riêng, và lỗi ở một người không được kéo
     theo cả bảng. */
  var i = 0, loi = 0;
  (function ke(){
    if (i >= can.length){
      nut.disabled = false;
      if (tin) tin.textContent = loi ? ('Xong, nhưng '+loi+' người lưu không được.') : 'Đã lưu.';
      CH.kq = null; docCauHinh();
      return;
    }
    var x = can[i++];
    goi('luuCauHinh', x).then(function(r){ if (!r || r.error) loi++; ke(); })
      .catch(function(){ loi++; ke(); });
  })();
}

function lam(nut, d, viec){
  var args = { ban:d.ban, maDon:d.maDon };
  /* ⚠️ DUYỆT thì KHÔNG hỏi gì — anh Thắng 13/09/2026: *"bấm duyệt không cần hỏi cái này nhé"*.
     TRẢ LẠI thì phải hỏi lý do: đơn trả về không kèm lý do thì người lập gửi lại y nguyên. */
  if (viec === 'traLai'){
    var ly = prompt('Trả lại đơn '+d.maDon+' — lý do để người lập biết sửa gì:');
    if (ly === null) return;
    args.lyDo = ly;
  }
  nut.disabled = true;
  goi(viec, args).then(function(r){
    nut.disabled = false;
    if (r && r.error) datBao('loi', r.error); else datBao('ok', (r&&r.message)||'Xong.');
    veChinh();
  }).catch(function(){
    nut.disabled = false; datBao('loi','Không gọi được máy chủ.'); veChinh();
  });
}

/* ══════════════════════════════════════════════════════════════════════════════════════════════
 * XEM TRƯỚC ẢNH CHỨNG TỪ — anh Thắng 14/09/2026: *"rê chuột vào phóng ảnh lên nhé"*.
 *
 * 🔴 UỶ QUYỀN SỰ KIỆN Ở `document`, KHÔNG GẮN TỪNG ẢNH. Bảng dòng chi được vẽ lại sau mỗi lượt
 *    bấm Xem, mỗi lượt duyệt, mỗi lượt làm mới; gắn tay từng ảnh là phải nhớ gắn lại ở mọi chỗ
 *    vẽ — và chỗ quên sẽ là chỗ im lặng không phóng, không ai biết vì sao.
 *
 * ⚠️ LẬT KHUNG KHI CHẠM MÉP MÀN. Ảnh ở cột cuối cùng bên phải, mà khung mở sang phải thì nó tràn
 *    ra ngoài và bị cắt — đúng những dòng cuối bảng, chỗ người ta hay soi nhất.
 * ══════════════════════════════════════════════════════════════════════════════════════════════ */
(function(){
  var LE = 18;   // cách con trỏ, đủ để không che chính ô ảnh

  function hop(){ return document.getElementById('anhTo'); }

  function datCho(e){
    var o = hop(); if (!o || o.style.display !== 'block') return;
    var w = o.offsetWidth, h = o.offsetHeight;
    var x = e.clientX + LE, y = e.clientY + LE;
    if (x + w > window.innerWidth  - 8) x = e.clientX - w - LE;
    if (y + h > window.innerHeight - 8) y = e.clientY - h - LE;
    /* Chạm cả hai mép thì ghim vào trong màn, đừng để âm — âm là mất nửa khung. */
    o.style.left = Math.max(8, x) + 'px';
    o.style.top  = Math.max(8, y) + 'px';
  }

  document.addEventListener('mouseover', function(e){
    var n = e.target;
    if (!n || n.tagName !== 'IMG' || !n.getAttribute('data-to')) return;
    var o = hop(); if (!o) return;
    o.querySelector('img').src = n.getAttribute('data-to');
    o.style.display = 'block';
    datCho(e);
  });
  document.addEventListener('mousemove', datCho);
  document.addEventListener('mouseout', function(e){
    var n = e.target;
    if (!n || n.tagName !== 'IMG' || !n.getAttribute('data-to')) return;
    var o = hop(); if (o) o.style.display = 'none';
  });
  /* Cuộn trang thì tắt: khung gắn theo con trỏ, cuộn xong nó lơ lửng sai chỗ. */
  window.addEventListener('scroll', function(){
    var o = hop(); if (o) o.style.display = 'none';
  }, true);
})();

/* Bấm ra ngoài thì đóng hộp chuông — hộp che mất bảng bên dưới. */
document.addEventListener('click', function(){
  if (!CHUONG.mo) return;
  var o = document.getElementById('hopChuong');
  if (o){ o.hidden = true; CHUONG.mo = false; }
});

/* ─────────────────────────────────────────────────────────────────── khởi động */
if (layThe()){
  goi('toi',{}).then(function(r){
    if (r && r.error){ datThe(''); veVao(); return; }
    TOI = r; veChinh();
  }).catch(function(){ veVao(); });
} else { veVao(); }
</script>
