    return '<div class="hop-ls"><div style="font-weight:800;color:#334155;margin-bottom:6px">' +
           '🕘 Lịch sử chỉnh đơn</div><p class="nho mo">Chưa có dòng nào.</p></div>';
  }
  var dong = function(x){
    return '<div style="padding:7px 0;border-bottom:1px solid #f1f5f9">' +
      '<div class="nho"><b>'+esc(x.nguoi||'—')+'</b>' +
      ( x.vaiTro ? ' <span class="mo">('+esc(x.vaiTro)+')</span>' : '' ) +
      ( x.tg ? ' <span class="mo">· '+esc(x.tg)+'</span>' : '' ) + '</div>' +
      '<div class="nho" style="color:#0f766e">'+esc(x.hanhDong||'') +
      ( x.chiTiet ? ' <span class="mo">— '+esc(x.chiTiet)+'</span>' : '' ) + '</div></div>';
  };
  var dau = ds.slice(0,3), con = ds.slice(3);
  return '<div class="hop-ls">' +
    '<div style="font-weight:800;color:#334155;margin-bottom:4px">🕘 Lịch sử chỉnh đơn (<b>'+ds.length+'</b>)</div>' +
    dau.map(dong).join('') +
    ( con.length
      ? '<details style="margin-top:6px"><summary class="nho" style="cursor:pointer;color:#0f766e">' +
        '▸ xem '+con.length+' dòng cũ hơn</summary><div>'+con.map(dong).join('')+'</div></details>'
      : '' ) +
    '</div>';
}

/* KHỐI QUYẾT TOÁN — ba ô lớn + dải kết luận, đúng kiểu trang mảng. */
function veThuaThieu(t){
  if (!t || !t.daCapTien) return '';
  var cl = Number(t.chenhLech||0);
  var mau = cl > 0 ? ['#dcfce7','#86efac','#166534'] : ( cl < 0 ? ['#fef3c7','#fde68a','#92400e'] : ['#f1f5f9','#cbd5e1','#334155'] );
  var chu = cl > 0 ? 'Thừa '+tien(cl)+' — NV trả lại kế toán'
          : ( cl < 0 ? 'Thiếu '+tien(Math.abs(cl))+' — kế toán bù cho NV' : 'Khớp — không thừa thiếu' );
  return '<div class="qt-hop">' +
    '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px">' +
      '<b style="color:#92400e">💰 Quyết toán — thực chi &amp; trả tiền kế toán</b>' +
      '<span class="nho" style="background:#fef3c7;color:#92400e;padding:2px 8px;border-radius:6px;font-weight:700">' +
      'kế toán đối chiếu &amp; trả tiền</span>' +
    '</div>' +
    '<div style="display:flex;gap:12px;flex-wrap:wrap">' +
      '<div class="qt-o" style="background:#eff6ff;border-color:#bfdbfe"><div class="nhan">Tạm ứng (số đã duyệt)</div>' +
        '<div class="so" style="color:#1e40af">'+tien(t.tamUng)+'</div></div>' +
      '<div class="qt-o" style="background:#f0fdf4;border-color:#86efac"><div class="nhan">Thực chi (tổng dòng đã mua)</div>' +
        '<div class="so" style="color:#166534">'+tien(t.thucChi)+'</div></div>' +
      '<div class="qt-o" style="background:'+mau[0]+';border-color:'+mau[1]+'"><div class="nhan">Còn lại (thừa/thiếu)</div>' +
        '<div class="so" style="color:'+mau[2]+'">'+tien(Math.abs(cl))+( cl>0?'đ thừa':( cl<0?'đ thiếu':'' ))+'</div></div>' +
      ( Number(t.nccChi||0)
        ? '<div class="qt-o"><div class="nhan">Trả nhà cung cấp</div><div class="so">'+tien(t.nccChi)+'</div></div>' : '' ) +
    '</div>' +
    '<div class="nho mo" style="margin-top:8px">💡 <b>Tạm ứng</b> = số đã duyệt (cố định, khoá sau duyệt). ' +
      '<b>Thực chi</b> = tổng các dòng đã mua. → <b>Còn lại</b> = Tạm ứng − Thực chi ' +
      '(thừa: NV trả lại · thiếu: kế toán bù).</div>' +
    '<div style="margin-top:8px;padding:10px 12px;border-radius:8px;background:'+mau[0]+';border:1px solid '+mau[1]+';' +
      'color:'+mau[2]+';font-weight:800;font-size:14px">'+chu+'</div>' +
    '</div>';
}

/* ẢNH CHỨNG TỪ CỦA MỘT DÒNG CHI — anh Thắng 14/09/2026: *"thêm cột hình ảnh để dò nữa nhé"*.
 *
 * 🔴 ẢNH NHỎ BẤM RA ẢNH THẬT, KHÔNG NHÚNG ẢNH TO VÀO BẢNG. Một đơn tuần có hai chục dòng; nhúng
 *    hai chục tấm ảnh gốc là màn nặng ì và bảng dài tới mức không đối chiếu nổi — mà thứ người
 *    duyệt cần trước tiên chỉ là *"dòng này CÓ chứng từ hay không"*.
 *
 * ⚠️ KHÔNG ẢNH LÀ CHUYỆN BÌNH THƯỜNG, ĐỪNG TÔ ĐỎ. Mua lẻ không lấy hoá đơn vẫn là dòng hợp lệ;
 *    tô cảnh báo ở đây là mỗi tuần vài chục lời báo động giả, rồi người ta thôi nhìn cả cột.
 *    Một dấu gạch xám là đủ nói.
 */
function veAnh(u){
  u = String(u||'').trim();
  if (!u) return '<span class="mo" title="Dòng này chưa đính chứng từ">—</span>';
  /* ⚠️ Chỉ nhận đường dẫn http(s): ô này là dữ liệu người dùng nhập, mà `javascript:` trong
     href là một đường chạy mã ngay trên trang của người đang duyệt tiền. */
  if (!/^https?:\/\//i.test(u)) return '<span class="mo" title="Đường dẫn ảnh không hợp lệ">—</span>';
  return '<a href="'+esc(u)+'" target="_blank" rel="noopener" title="Mở ảnh chứng từ" class="o-anh">' +
    '<img src="'+esc(u)+'" alt="chứng từ" loading="lazy" data-to="'+esc(u)+'" ' +
    'style="width:34px;height:34px;object-fit:cover;border-radius:6px;border:1px solid #cbd5e1;' +
    'display:block;margin:0 auto"></a>';
}

function veChiTiet(g){
  g = g || {};
  /* ⚠️ DÒNG CHI NẰM Ở `lines`, KHÔNG PHẢI `products` — `products` là danh sách GỢI Ý tên hàng.
     Đọc nhầm khoá thì bảng đầy dòng mà không dòng nào của đơn này, và nó trông y như thật. */
  var ds = g.lines || [], don = g.don || {}, t = g.tien || null;

  /* Cơ sở của đơn lấy từ chính dòng chi. Một đơn có thể rải nhiều gian (Văn phòng / Máy tự động
     khi không tạm ứng) — nói ra số gian chứ đừng bày một cái tên như thể đơn chỉ có nó. */
  var cs = [];
  ds.forEach(function(r){ var x = (r.coso||'').trim(); if (x && cs.indexOf(x) < 0) cs.push(x); });
  var csChu = cs.length === 1 ? cs[0] : ( cs.length > 1 ? cs.length + ' cơ sở' : '' );

  var trai =
    '<div class="hop-tt">' +
      '<div style="font-size:15px;font-weight:800;color:#0f766e">Đơn đang ' + esc(don.trangThai||'—') + '</div>' +
      '<div class="nho mo" style="margin-top:2px">' +
        esc(don.ky||'') +
        ( csChu ? ' · 🏢 <b style="color:#334155">' + esc(csChu) + '</b>' : '' ) +
        ( don.nguoiLap ? ' · ' + esc(don.nguoiLap) : '' ) +
        ( don.ghiChu ? ' · ' + esc(don.ghiChu) : '' ) +
      '</div>' +
      veChipKhoa(don.trangThai) +
      veDaiTT(don.trangThai) +
    '</div>';

  if (!ds.length){
    /* ⚠️ "Chưa có dòng chi" KHÁC "đọc hỏng": đơn xin ứng trước được phép gửi khi chưa liệt kê
       hạng mục. Nói rõ để người duyệt không đi tìm lỗi ở chỗ không có lỗi. */
    trai += '<p class="mo nho" style="margin-top:10px">Đơn này <b>chưa có dòng chi nào</b> — ' +
            'đơn xin ứng trước. Số xin nằm ở ô tạm ứng.</p>';
  } else {
    var tong = 0, tongTC = 0, coAnh = 0, coTC = false;
    ds.forEach(function(r){
      if ((r.anh||'').trim()) coAnh++;
      if (r.thucChi !== null && r.thucChi !== undefined) coTC = true;
    });
    var h = '<div class="cuon" style="margin-top:12px"><table><thead><tr>' +
      '<th>Cơ sở</th><th>Loại chi phí</th><th>Nội dung</th>' +
      '<th class="r">SL</th><th class="r">Đơn giá</th><th class="r">Thành tiền</th>' +
      '<th class="r">Thực chi</th><th style="text-align:center">Ảnh</th></tr></thead><tbody>';
    ds.forEach(function(r){
      var tt = Number(r.thanhTien||0); tong += tt;
      var tc = ( r.thucChi === null || r.thucChi === undefined ) ? null : Number(r.thucChi);
      if (tc !== null) tongTC += tc;
      /* 🔴 THỰC CHI LỆCH THÀNH TIỀN THÌ TÔ LÊN — đó chính là dòng người duyệt phải soi: mua
         hụt, mua thêm, hay gõ nhầm. Bằng nhau thì để xám, khỏi tranh mắt với chỗ cần nhìn. */
      var lech = ( tc !== null && tc !== tt );
      h += '<tr><td>'+esc(r.coso||'')+'</td><td>'+esc(r.nhom||'')+'</td><td>'+esc(hoaDau(r.noiDung))+'</td>' +
           '<td class="r">'+(r.soLuong||'')+'</td><td class="r">'+tien(Number(r.donGia||0))+'</td>' +
           '<td class="r">'+tien(tt)+'</td>' +
           '<td class="r"'+( lech ? ' style="color:#b45309;font-weight:800" title="Lệch thành tiền"' : ' class="r mo"' )+'>' +
             ( tc === null ? '<span class="mo" title="Bản mảng chưa trả được số này">—</span>' : tien(tc) )+'</td>' +
           '<td style="text-align:center">'+veAnh(r.anh)+'</td></tr>';
    });
    trai += h + '</tbody><tfoot><tr><td colspan="5" class="r">Cộng '+ds.length+' dòng</td>' +
            '<td class="r">'+tien(tong)+'</td>' +
            '<td class="r">'+( coTC ? tien(tongTC) : '<span class="mo">—</span>' )+'</td>' +
            '<td style="text-align:center" class="nho '+( coAnh === ds.length ? '' : 'mo' )+'">' +
            coAnh+'/'+ds.length+'</td></tr></tfoot></table></div>';
  }
  trai += veThuaThieu(t) + veMoc(g.moc);

  return '<div class="hai-cot"><div>' + trai + '</div><div>' + veLichSu(g.lichSu) + '</div></div>';
}

/* ══════════════════════════════════════════════════════════════════════════════════════════════
 * MÀN XUẤT MISA — anh Thắng 14/09/2026: *"Trang tổng là xem, duyệt, quyết toán, xuất misa, sau
 * này kế toán và quản lý làm trên trang này, không làm trên trang bộ phận."*
 * ══════════════════════════════════════════════════════════════════════════════════════════════
 * 🔴 MỖI MẢNG MỘT TỆP RIÊNG. Bút toán MISA mang mã đơn vị của từng cơ sở, và ba mảng có ba danh
 *    mục tài khoản riêng — gộp một tệp là kế toán phải ngồi tách tay trên bảng bút toán, chỗ dễ
 *    lẫn nhất trong cả quy trình.
 *
 * 🔴 XEM KHÔNG PHẢI LÀ XUẤT. Đánh dấu "đã xuất" ngay lúc bày bảng thì một lượt xem thử rồi đóng
 *    màn sẽ làm lượt xuất THẬT sau đó ra tệp rỗng — và không ai hiểu vì sao. Nên đánh dấu là một
 *    nút riêng, chỉ bật lên SAU khi đã bấm tải tệp.
 *
 * ⚠️ TỆP .CSV CÓ BOM. Không có BOM thì Excel mở ra tiếng Việt thành ký tự lạ, kế toán tưởng dữ
 *    liệu hỏng. Ngăn cách bằng dấu phẩy, ô nào chứa phẩy/nháy/xuống dòng thì bọc nháy kép.
 * ══════════════════════════════════════════════════════════════════════════════════════════════ */
var MISA = { ky:'all', mode:'chuaxuat', pl:'all', ban:[], daTai:{} };

function veMisa(){
  var o = document.getElementById('bang');
  o.innerHTML =
    '<div class="card"><div class="ch"><h2>📤 Xuất bút toán sang MISA</h2>' +
      '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">' +
        '<label class="nho mo">Kỳ</label><input id="mKy" placeholder="vd 2026-09 · để trống = tất cả" ' +
          'value="'+esc(MISA.ky==='all'?'':MISA.ky)+'" style="width:210px">' +
        '<label class="nho mo">Đơn</label><select id="mMode">' +
          '<option value="chuaxuat"'+(MISA.mode==='chuaxuat'?' selected':'')+'>Chưa xuất lần nào</option>' +
          '<option value="all"'+(MISA.mode==='all'?' selected':'')+'>Tất cả (kể cả đã xuất)</option>' +
        '</select>' +
        '<label class="nho mo">Phân loại</label><select id="mPl">' +
          '<option value="all"'+(MISA.pl==='all'?' selected':'')+'>Cả hai</option>' +
          '<option value="canhan"'+(MISA.pl==='canhan'?' selected':'')+'>Thanh toán cá nhân</option>' +
          '<option value="ncc"'+(MISA.pl==='ncc'?' selected':'')+'>Nhà cung cấp</option>' +
        '</select>' +
        '<button class="btn b-p" id="mDoc">Đọc bút toán</button>' +
      '</div></div>' +
      '<div class="cb"><p class="nho mo">Mỗi mảng ra một tệp riêng. Bấm <b>Đọc bút toán</b> để xem trước, ' +
      'tải tệp về, rồi mới bấm <b>Đánh dấu đã xuất</b> — xem thử không làm mất lượt xuất thật.</p></div>' +
    '</div><div id="mKq"></div>';

  document.getElementById('mDoc').onclick = function(){
    var k = (document.getElementById('mKy').value||'').trim();
    MISA.ky   = k === '' ? 'all' : k;
    MISA.mode = document.getElementById('mMode').value;
    MISA.pl   = document.getElementById('mPl').value;
    MISA.daTai = {};
    docMisa();
  };
  /* 🔴 TỰ ĐỌC KHI MỞ TAB — anh Thắng 14/09/2026: *"Xuất misa chưa lấy bên kvc hay sao anh chưa
     thấy"*. Màn cũ chờ bấm "Đọc bút toán" mới chạy, trong khi hai tab bên cạnh (Tra chi phí,
     Tổng quan) tự đọc ngay. Người dùng đọc sự im lặng ấy thành "mảng KVC không lấy được" —
     và đó là cách đọc hợp lý với những gì màn hình bày ra. */
  if (MISA.ban.length) veMisaKq(); else docMisa();
}

function docMisa(){
  var o = document.getElementById('mKq');
  o.innerHTML = '<p class="mo">Đang đọc bút toán…</p>';
  goi('misa',{ky:MISA.ky, mode:MISA.mode, pl:MISA.pl}).then(function(r){
    if (r && r.error){ o.innerHTML = '<div class="bao bao-loi">'+esc(r.error)+'</div>'; return; }
    MISA.ban = r.ban || [];
    veMisaKq();
  }).catch(function(){ o.innerHTML = '<div class="bao bao-loi">Không gọi được máy chủ.</div>'; });
}

function veMisaKq(){
  var o = document.getElementById('mKq');
  if (!MISA.ban.length){ o.innerHTML = '<div class="card"><div class="cb"><p class="mo">Chưa đọc.</p></div></div>'; return; }

  var h = '';
  MISA.ban.forEach(function(b, bi){
    var cols = b.cols || [], rows = b.rows || [];
    h += '<div class="card"><div class="ch">' +
      '<h2>🏷 '+esc(b.tenBan)+' <span class="chip">'+rows.length+' dòng · '+b.soDon+' đơn</span></h2>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
        ( rows.length
          ? '<button class="btn b-p nho" data-tai="'+bi+'">⬇ Tải .csv</button>' +
            nutXong(b, bi)
          : '' ) +
      '</div></div><div class="cb">';

    if (b.thieu){
      /* Mảng chưa cài xong — KHÁC HẲN "không có bút toán nào". Nói rõ để khỏi ai đi sửa bộ lọc. */
      h += '<div class="bao bao-canh">⚠️ '+esc((b.canh||[])[0]||'Bản này chưa cài, hoặc quá cũ.')+'</div>';
    } else if (!rows.length){
      h += '<p class="mo">Không có bút toán nào khớp bộ lọc. ✓</p>';
    } else {
      /* ══════════════════════════════════════════════════════════════════════════════════════
       * LÔ NÀY GỒM ĐƠN NÀO — anh Thắng 14/09/2026: *"không có chỗ xuất misa theo đơn"*.
       * ══════════════════════════════════════════════════════════════════════════════════════
       * 🔴 TỆP MISA KHÔNG CẮT ĐƯỢC THEO TỪNG ĐƠN, và đó là do hình dạng của bút toán chứ không
       *    phải do màn này thiếu nút. Lõi gom dòng chi theo MẢNG + LOẠI CHI PHÍ rồi xếp theo
       *    ngày; một đơn tuần rải thành nhiều dòng nằm xen với đơn khác, và dòng bút toán không
       *    mang mã đơn (ô "Số chứng từ" để trống cho MISA tự đánh số). Cắt theo đơn là phải đổi
       *    cách gom ở lõi của từng bản — việc khác, không làm lén ở đây.
       *
       * ⚠️ NHƯNG KẾ TOÁN VẪN PHẢI BIẾT LÔ NÀY GỒM GÌ, nhất là vì nút bên cạnh sắp đánh dấu
       *    đúng những đơn ấy là "đã xuất". Bày danh sách mã đơn ra, ngay cạnh con số.
       * ══════════════════════════════════════════════════════════════════════════════════════ */
      var mds = b.maDons || [];
      if (mds.length){
        h += '<details style="margin-bottom:10px"><summary class="nho" style="cursor:pointer;color:#0f766e">' +
             'Lô này gồm <b>'+mds.length+' đơn</b> — bấm để xem mã đơn</summary>' +
             '<div class="nho mo" style="padding:6px 0 2px">' +
             mds.map(function(m){ return '<span class="chip-l">'+esc(m)+'</span>'; }).join('') +
             '</div></details>';
      } else {
        h += '<p class="nho mo" style="margin-bottom:8px">Nhánh bút toán này không chốt theo mã đơn, ' +
             'nên không có danh sách đơn để liệt kê.</p>';
      }
      /* Cảnh báo của chính bản ấy (thiếu mã tài khoản, thiếu mã đơn vị…) — hiện TRƯỚC bảng:
         đẩy một tệp thiếu mã sang MISA rồi mới biết là phải gỡ bút toán ra khỏi sổ kế toán. */
      (b.canh||[]).forEach(function(c){ h += '<div class="bao bao-canh">⚠️ '+esc(c)+'</div>'; });
      var xem = rows.slice(0, 20);
      h += '<div class="cuon"><table><thead><tr>' +
        cols.map(function(c){ return '<th>'+esc(c)+'</th>'; }).join('') + '</tr></thead><tbody>' +
        xem.map(function(r){
          return '<tr>' + cols.map(function(c,ci){
            var v = Array.isArray(r) ? r[ci] : r[c];
            return '<td'+( typeof v === 'number' ? ' class="r"' : '' )+'>'+
                   esc( typeof v === 'number' ? tien(v) : (v==null?'':v) )+'</td>';
          }).join('') + '</tr>';
        }).join('') + '</tbody></table></div>';
      if (rows.length > xem.length){
        h += '<p class="nho mo" style="margin-top:6px">Đang xem '+xem.length+' dòng đầu. ' +
             'Tệp .csv có đủ cả '+rows.length+' dòng.</p>';
      }
    }
    h += '</div></div>';
  });
  o.innerHTML = h;

  Array.prototype.forEach.call(o.querySelectorAll('button[data-tai]'), function(n){
    n.onclick = function(){ taiMisa(MISA.ban[+n.getAttribute('data-tai')]); };
  });
  Array.prototype.forEach.call(o.querySelectorAll('button[data-xong]'), function(n){
    n.onclick = function(){ xongMisa(n, MISA.ban[+n.getAttribute('data-xong')]); };
  });
}

/* Nút "Đánh dấu đã xuất" — hai điều kiện, mỗi điều kiện một lời giải thích riêng.
   🔴 `maDons` RỖNG KHÔNG PHẢI LỖI: lõi MISA chỉ trả danh sách mã đơn ở nhánh chi phí thường;
      các nhánh khác (tạm ứng, đợt trả NCC…) chốt theo cách riêng của chúng và trả mảng rỗng.
      Bật nút lên trong cảnh ấy là người ta bấm rồi nhận câu "Không có đơn nào để đánh dấu" —
      nghe như hỏng, trong khi chẳng có gì hỏng cả. Nên nói thẳng ngay trên nút. */
function nutXong(b, bi){
  var ds = b.maDons || [];
  if (!ds.length){
    return '<span class="nho mo" title="Nhánh bút toán này không chốt theo mã đơn">' +
           'không có mã đơn để đánh dấu</span>';
  }
  var san = !!MISA.daTai[b.ban];
  return '<button class="btn b-g nho" data-xong="'+bi+'"' +
    ( san ? '' : ' disabled title="Tải tệp về đã, rồi mới đánh dấu"' ) +
    '>✓ Đánh dấu '+ds.length+' đơn đã xuất</button>';
}

/** Một ô .csv: bọc nháy kép khi có phẩy, nháy hoặc xuống dòng; nháy trong ô nhân đôi. */
function oCsv(v){
  var t = (v == null) ? '' : String(v);
  return /[",\n\r]/.test(t) ? '"' + t.replace(/"/g,'""') + '"' : t;
}

function taiMisa(b){
  var cols = b.cols || [], rows = b.rows || [];
  var d = [ cols.map(oCsv).join(',') ];
  rows.forEach(function(r){
    d.push( cols.map(function(c,ci){ return oCsv( Array.isArray(r) ? r[ci] : r[c] ); }).join(',') );
  });
  /* ﻿ = BOM. Thiếu nó thì Excel đọc tệp bằng bảng mã máy và tiếng Việt ra ký tự lạ. */
  var blob = new Blob(['﻿' + d.join('\r\n')], {type:'text/csv;charset=utf-8;'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'misa-' + b.ban + '-' + ( MISA.ky === 'all' ? 'tatca' : MISA.ky ) + '.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  MISA.daTai[b.ban] = true;   // giờ mới cho bấm "Đánh dấu đã xuất"
  veMisaKq();
}

function xongMisa(nut, b){
  if (!confirm('Đánh dấu '+(b.maDons||[]).length+' đơn của '+b.tenBan+' là ĐÃ XUẤT MISA?\n\n' +
               'Sau bước này chúng không còn nằm trong lượt "Chưa xuất lần nào" nữa.')) return;
  nut.disabled = true;
  goi('misaXong',{ban:b.ban, pl:MISA.pl, maDons:b.maDons||[]}).then(function(r){
    nut.disabled = false;
    if (r && r.error){ datBao('loi', r.error); } else { datBao('ok', (r&&r.message)||'Xong.'); }
    veChinh();
  }).catch(function(){
    nut.disabled = false; datBao('loi','Không gọi được máy chủ.'); veChinh();
  });
}

/* ══════════════════════════════════════════════════════════════════════════════════════════════
 * MÀN TRA CHI PHÍ — GÕ MỘT LẦN, GOM CẢ BA MẢNG
 * ══════════════════════════════════════════════════════════════════════════════════════════════
 * Anh Thắng 14/09/2026: *"chọn cửa hàng, chọn loại chi phí là biết được ngay phải không"* →
 * *"nếu trang tổng khi gõ, nó tự gom 3 trang lại được không"*.
 *
 * 🔴 HỘP CHỌN, KHÔNG PHẢI Ô GÕ, cho cửa hàng và loại chi phí. Ô gõ dò trong cả nội dung dòng
 *    chi: gõ "Chi phí cơ sở" thì dính luôn mọi dòng có mấy chữ ấy trong phần mô tả. Và gõ thiếu
 *    dấu hay sai một chữ là ra THIẾU TIỀN — thiếu bao nhiêu thì không ai biết, vì con số nhỏ đi
 *    trông vẫn hợp lý. Ô gõ vẫn còn, nhưng để tìm nội dung, không phải để bó danh mục.
 *
 * 🔴 MỖI MẢNG MỘT BẢNG RIÊNG — *"tách 3 bảng riêng, để kế toán biết 3 bộ phận"*, *"vì tên có thể
 *    trùng nhau"*. Ba mảng có thể cùng có một cửa hàng tên y hệt.
 * ══════════════════════════════════════════════════════════════════════════════════════════════ */
var TRA = { coso:'all', loai:'all', ky:'all', q:'', kq:null, dangDoc:false };

function oChon(id, nhan, val, ds, chuAll){
  var h = '<label class="nho mo" style="margin-right:4px">'+esc(nhan)+'</label><select id="'+id+'">' +
          '<option value="all">'+esc(chuAll)+'</option>';
  (ds||[]).forEach(function(x){
    h += '<option value="'+esc(x)+'"'+(String(val)===String(x)?' selected':'')+'>'+esc(x)+'</option>';
  });
  return h + '</select>';
}

function veTra(){
  var o = document.getElementById('bang');
  var k = TRA.kq || {};
  o.innerHTML =
    '<div class="card"><div class="ch"><h2>🔎 Tra chi phí — gom cả ba mảng</h2></div>' +
      '<div class="cb"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">' +
        oChon('tCoso','Cửa hàng', TRA.coso, k.cosoList, 'Tất cả cửa hàng') +
        oChon('tLoai','Loại chi phí', TRA.loai, k.loaiList, 'Tất cả loại') +
        oChon('tKy','Kỳ', TRA.ky, k.kyList, 'Mọi kỳ') +
        '<input id="tQ" placeholder="🔎 nội dung dòng chi, mã tài khoản…" value="'+esc(TRA.q)+'" style="min-width:230px;flex:1">' +
        '<button class="btn b-p" id="tTim">Tra</button>' +
        '<button class="btn b-x" id="tXoa">Bỏ lọc</button>' +
      '</div>' +
      ( TRA.kq
        ? '<p class="nho mo" style="margin-top:8px">Tìm thấy <b>'+k.soDong+' dòng</b> · cộng <b>'+tien(k.tong)+'</b> ' +
          'trên '+(k.ban||[]).length+' mảng.</p>'
        : '<p class="nho mo" style="margin-top:8px">Chọn cửa hàng và/hoặc loại chi phí rồi bấm <b>Tra</b>. ' +
          'Lần đầu để trống hết cũng được — nó nạp đủ danh mục cho hai hộp chọn.</p>' ) +
      '</div></div><div id="tKq"></div>';

  document.getElementById('tTim').onclick = function(){
    TRA.coso = document.getElementById('tCoso').value;
    TRA.loai = document.getElementById('tLoai').value;
    TRA.ky   = document.getElementById('tKy').value;
    TRA.q    = document.getElementById('tQ').value;
    docTra();
  };
  document.getElementById('tXoa').onclick = function(){
    TRA.coso='all'; TRA.loai='all'; TRA.ky='all'; TRA.q=''; docTra();
  };
  document.getElementById('tQ').addEventListener('keydown', function(e){
    if (e.key === 'Enter'){ e.preventDefault(); document.getElementById('tTim').click(); }
  });

  if (TRA.kq) veTraKq(); else docTra();   // vào tab là nạp luôn, để hai hộp chọn có danh mục
}

function docTra(){
  if (TRA.dangDoc) return;
  TRA.dangDoc = true;
  var o = document.getElementById('tKq');
  if (o) o.innerHTML = '<p class="mo">Đang gom ba mảng…</p>';
  goi('tra',{coso:TRA.coso, loai:TRA.loai, ky:TRA.ky, q:TRA.q}).then(function(r){
    TRA.dangDoc = false;
    if (r && r.error){ if (o) o.innerHTML = '<div class="bao bao-loi">'+esc(r.error)+'</div>'; return; }
    TRA.kq = r;
    veTra();   // vẽ lại cả thanh lọc: hai hộp chọn vừa có danh mục đầy đủ
  }).catch(function(){
    TRA.dangDoc = false;
    if (o) o.innerHTML = '<div class="bao bao-loi">Không gọi được máy chủ.</div>';
  });
}

function veTraKq(){
  var o = document.getElementById('tKq'), k = TRA.kq;
  if (!o || !k) return;
  var h = '';
  (k.ban||[]).forEach(function(b){
    var it = b.items || [];
    h += '<div class="card"><div class="ch">' +
      '<h2>🏷 '+esc(b.tenBan)+' <span class="chip">'+b.soDong+' dòng</span></h2>' +
      '<div class="nho mo">Cộng <b>'+tien(b.tong)+'</b>' +
      ( b.url ? ' · <a href="'+esc(b.url)+'" target="_blank" rel="noopener">mở trang mảng ↗</a>' : '' ) +
      '</div></div><div class="cb">';

    if (!it.length){
      h += '<p class="mo">Mảng này không có dòng nào khớp. ✓</p>';
    } else {
      /* Cộng theo cửa hàng đứng TRƯỚC bảng dòng: khi lọc "tất cả cửa hàng" thì đây mới là thứ
         người ta cần, còn bảng dòng là để soi chi tiết một khoản. */
      if ((b.byCoso||[]).length > 1){
        h += '<div class="cuon" style="margin-bottom:10px"><table><thead><tr><th>Cửa hàng</th>' +
             '<th class="r">Số dòng</th><th class="r">Cộng</th></tr></thead><tbody>' +
             b.byCoso.map(function(c){
               return '<tr><td>'+esc(c.coso||c.ten||'')+'</td><td class="r">'+(c.n||0)+'</td>' +
                      '<td class="r">'+tien(c.tien||0)+'</td></tr>';
             }).join('') + '</tbody></table></div>';
      }
      h += '<div class="cuon"><table><thead><tr><th>Ngày</th><th>Cửa hàng</th><th>Loại chi phí</th>' +
           '<th>Nội dung</th><th>Mảng</th><th class="r">TK Nợ</th><th class="r">Số tiền</th>' +
           '</tr></thead><tbody>' +
        it.map(function(r){
          return '<tr><td class="nho">'+esc(r.ngay||'')+'</td><td>'+esc(r.coso||'')+'</td>' +
                 '<td>'+esc(r.loai||'')+'</td><td>'+esc(hoaDau(r.noiDung))+'</td>' +
                 '<td class="nho mo">'+esc(r.mang||'')+'</td>' +
                 '<td class="r nho">'+esc(r.tkNo||'')+'</td>' +
                 '<td class="r">'+tien(Number(r.tien||0))+'</td></tr>';
        }).join('') + '</tbody></table></div>';
      /* ⚠️ NÓI RA KHI BẢNG BỊ CẮT. Con số cộng ở trên là của CẢ lát cắt; bày 200 dòng mà im lặng
         thì người đọc tự cộng tay rồi kết luận phần mềm tính sai. */
      if (b.soDong > it.length){
        h += '<p class="nho mo" style="margin-top:6px">Đang xem <b>'+it.length+'</b> dòng đầu trong ' +
             b.soDong+' dòng. Con số cộng ở trên là của <b>cả '+b.soDong+' dòng</b>. ' +
             'Lọc hẹp lại (chọn kỳ, hoặc một cửa hàng) để xem đủ.</p>';
      }
    }
    h += '</div></div>';
  });

  /* Tổng chung để cuối, sau ba bảng — đọc xong từng mảng rồi mới tới con số gộp. */
  if ((k.ban||[]).length > 1){
    h += '<div class="card"><div class="cb" style="display:flex;justify-content:space-between;' +
         'align-items:center;flex-wrap:wrap;gap:8px">' +
         '<b>Cộng cả '+(k.ban||[]).length+' mảng</b>' +
         '<span style="font-size:18px;font-weight:800;color:#0f766e">'+tien(k.tong)+'</span>' +
         '</div></div>';
  }
  o.innerHTML = h;
}

/* ══════════════════════════════════════════════════════════════════════════════════════════════
 * MÀN TỔNG QUAN — MỌI ĐƠN TỪ TRƯỚC TỚI GIỜ, CHIA THEO BƯỚC
 * ══════════════════════════════════════════════════════════════════════════════════════════════
 * Anh Thắng 14/09/2026: *"thêm giúp anh 1 cái tab đầu tiên (Dashboard) hiện tất cả đơn từ trước
 * đến giờ, kèm các bộ lọc: lọc theo cơ sở, lọc theo mảng, lọc theo ngày, lọc theo chi phí, lọc
 * theo người nhập"* → *"chỗ này cũng tách ra các bảng: đã tạm ứng, chưa tạm ứng, chờ tạm ứng —
 * tức các bước để kế toán theo dõi, nhớ ai nhập trước, lên trước"*.
 *
 * 🔴 CHIA THEO BƯỚC, KHÔNG ĐỔ MỘT ĐỐNG. Một bảng 800 dòng đủ mọi trạng thái thì không trả lời
 *    được câu người ta thật sự hỏi: *"đang kẹt ở khâu nào"*. Chia ra rồi thì nhìn số đơn mỗi

 * 🔴 VÀ TRONG MỖI BƯỚC, AI NỘP TRƯỚC ĐỨNG TRƯỚC — cùng luật công bằng với các tab việc.
 * ══════════════════════════════════════════════════════════════════════════════════════════════ */
var TQ = { ban:'', coso:'', loai:'', nguoi:'', tuNgay:'', denNgay:'', kq:null, dangDoc:false };

        oChon('qNguoi','Người nhập', TQ.nguoi, k.nguoiList, 'Tất cả người') +
        '<label class="nho mo">Từ ngày</label><input type="date" id="qTu" value="'+esc(TQ.tuNgay)+'">' +
        '<label class="nho mo">đến</label><input type="date" id="qDen" value="'+esc(TQ.denNgay)+'">' +

      '</div>' +
      ( k.coCat ? '<p class="nho" style="margin-top:8px;color:#b45309">⚠️ Có mảng nhiều đơn hơn ' +
        'số bày ra được — con số đếm ở trên là của <b>cả lát cắt</b>, còn bảng chỉ bày phần đầu. ' +
        'Lọc hẹp lại (chọn kỳ hoặc một cơ sở) để xem đủ.</p>' : '' ) +
    '</div></div><div id="qKq"></div>';

  document.getElementById('qTim').onclick = function(){

  });
}

/* Tông màu của một bước. Xem khối `.buoc` trong CSS: ba tông theo NGHĨA, không phải bảy màu. */
function mauBuoc(tt){
  var M = {
    /* Chưa tới lượt ai — xám, cố tình nhạt: nó không phải việc của người đang nhìn. */
    'Nháp':              { chu:'#64748b', nen:'#f1f5f9', nenNhat:'#fcfdfe', vien:'#e2e8f0', bieu:'📝' },
    /* ĐANG CHỜ một người nào đó làm — cam, tông duy nhất kêu lên. */
    'Chờ duyệt tạm ứng': { chu:'#b45309', nen:'#fef3c7', nenNhat:'#fffdf5', vien:'#fde68a', bieu:'⏳' },
    'Chờ cấp tạm ứng':   { chu:'#b45309', nen:'#fef3c7', nenNhat:'#fffdf5', vien:'#fde68a', bieu:'⏳' },
    'Chờ quyết toán':    { chu:'#b45309', nen:'#fef3c7', nenNhat:'#fffdf5', vien:'#fde68a', bieu:'⏳' },
    /* Tiền ĐÃ ra khỏi két — xanh dương, mốc đáng nhớ nhất của một đơn. */
    'Đã cấp tạm ứng':    { chu:'#0369a1', nen:'#e0f2fe', nenNhat:'#f8fcff', vien:'#bae6fd', bieu:'💸' },
    /* Xong — xanh lá. */
    'Đã quyết toán':     { chu:'#166534', nen:'#dcfce7', nenNhat:'#f9fefb', vien:'#86efac', bieu:'✅' },
    'Đã xuất MISA':      { chu:'#166534', nen:'#dcfce7', nenNhat:'#f9fefb', vien:'#86efac', bieu:'📤' }
  };
  /* ⚠️ Trạng thái LẠ (bản mảng đổi chữ) vẫn phải vẽ ra được — trả tông xám thay vì để undefined
     rồi cả khối thành "undefined". */
  return M[String(tt||'')] || { chu:'#64748b', nen:'#f1f5f9', nenNhat:'#fcfdfe', vien:'#e2e8f0', bieu:'•' };
}

function veTongQuanKq(){
  var o = document.getElementById('qKq'), k = TQ.kq;
  if (!o || !k) return;
  var buoc = k.buoc || [];
  var h = '';

  (k.ban||[]).forEach(function(b){
    var rows = b.rows || [];
    h += '<div class="card"><div class="ch">' +
      '<h2>🏷 '+esc(b.tenBan)+' <span class="chip">'+b.soDon+' đơn</span></h2>' +
      '<div class="nho mo">Cộng <b>'+tien(b.tong)+'</b>' +
      ( b.url ? ' · <a href="'+esc(b.url)+'" target="_blank" rel="noopener">mở trang mảng ↗</a>' : '' ) +
      '</div></div><div class="cb">';

    if (!rows.length){
      h += '<p class="mo">Không có đơn nào khớp bộ lọc.</p>';
    } else {
      /* Dải đếm theo bước — nhìn một cái là thấy đang ùn ở khâu nào. */
      var dem = {};
      rows.forEach(function(r){ dem[r.trangThai] = (dem[r.trangThai]||0) + 1; });
      h += '<div style="margin-bottom:8px">' +
        buoc.map(function(bc){
          var n = dem[bc.tt] || 0, m = mauBuoc(bc.tt);
          return '<span class="dem-chip"'+( n ? ' style="background:'+m.nen+';border-color:'+m.vien+';color:'+m.chu+'"' : '' )+'>' +
                 esc(bc.ten)+': <b>'+n+'</b></span>';
        }).join('') + '</div>';

      /* Mỗi BƯỚC một bảng, theo đúng thứ tự quy trình. */
      buoc.forEach(function(bc){
        var ds = rows.filter(function(r){ return r.trangThai === bc.tt; });
        if (!ds.length) return;
        /* 🔴 Ai nộp trước lên trước — trừ hai bước cuối (đã xong) thì mới nhất trước. */
        var xong = ( bc.tt === 'Đã quyết toán' || bc.tt === 'Đã xuất MISA' );
        ds = ds.slice().sort(function(a,c){
          var x = String(a.ngayTao||''), y = String(c.ngayTao||'');
          return xong ? ( x > y ? -1 : ( x < y ? 1 : 0 ) ) : ( x < y ? -1 : ( x > y ? 1 : 0 ) );
        });
        var tg = 0;
        ds.forEach(function(r){ if (r.tien !== null) tg += Number(r.tien); });

        var m = mauBuoc(bc.tt);
        h += '<div class="buoc" style="border-left-color:'+m.chu+';background:'+m.nenNhat+'">' +
             '<div class="buoc-dau">' +
               '<span class="buoc-ten" style="color:'+m.chu+'">'+m.bieu+' '+esc(bc.ten) +
                 '<span class="buoc-so" style="background:'+m.nen+';color:'+m.chu+'">'+ds.length+' đơn</span></span>' +
               '<span class="nho" style="color:'+m.chu+';font-weight:700">Cộng '+tien(tg)+'</span>' +
             '</div>' +
             '<div class="cuon" style="border-color:'+m.vien+'"><table>' +
             '<thead><tr style="background:'+m.nen+'">' +
               '<th style="background:'+m.nen+';color:'+m.chu+'">Cơ sở</th>' +
               '<th style="background:'+m.nen+';color:'+m.chu+'">Người nhập</th>' +
               '<th style="background:'+m.nen+';color:'+m.chu+'">Kỳ</th>' +
               '<th style="background:'+m.nen+';color:'+m.chu+'">Lúc nhập</th>' +
               '<th class="r" style="background:'+m.nen+';color:'+m.chu+'">Số tiền</th></tr></thead><tbody>' +
             ds.map(function(r, k){
               /* Số thứ tự trong hàng chờ: "ai nộp trước lên trước" chỉ có nghĩa khi nhìn thấy
                  được thứ tự. Bảng đã xong thì đánh số vô nghĩa nên bỏ. */
               var stt = xong ? '' : '<span class="mo nho" style="margin-right:6px">'+(k+1)+'.</span>';
               return '<tr><td>'+stt+veCoSo(r.coso)+'<div class="nho mo">'+esc(r.maDon)+'</div></td>' +
                      '<td>'+esc(r.nguoiLap)+'</td>' +
                      '<td class="nho">'+esc(r.ky)+'</td>' +
                      '<td class="nho mo">'+esc(ngay(r.ngayTao))+'</td>' +
                      '<td class="r tien" style="color:'+( r.tien ? m.chu : '#94a3b8' )+'">' +
                      ( r.tien===null ? '<span class="mo">—</span>' : tien(r.tien) )+'</td></tr>';
             }).join('') +
             '</tbody><tfoot><tr><td colspan="4" class="r">Cộng '+ds.length+' đơn</td>' +
             '<td class="r" style="color:'+m.chu+'">'+tien(tg)+'</td></tr></tfoot></table></div></div>';
      });
    }
    h += '</div></div>';
  });

  if ((k.ban||[]).length > 1){
    h += '<div class="card"><div class="cb" style="display:flex;justify-content:space-between;' +
         'align-items:center;flex-wrap:wrap;gap:8px"><b>Cộng cả '+(k.ban||[]).length+' mảng · ' +
         k.soDon+' đơn</b><span style="font-size:18px;font-weight:800;color:#0f766e">'+tien(k.tong)+'</span>' +
         '</div></div>';
  }
  o.innerHTML = h;
}

/* ══════════════════════════════════════════════════════════════════════════════════════════════
 * MÀN CẤU HÌNH — AI LÀM MẢNG NÀO
 * ══════════════════════════════════════════════════════════════════════════════════════════════
 * Anh Thắng 14/09/2026: *"bổ sung tab cấu hình trên trang chi phí tổng, để cấp quyền truy cập
 * duyệt theo mảng mình làm việc"*.
 *
 * 🔴 Ở ĐÂY KHAI PHẠM VI, KHÔNG KHAI QUYỀN. Quyền LÀM GÌ (duyệt · cấp tiền · trả lại · quyết toán ·
 *    xuất MISA) vẫn nằm ở bảng Phân quyền của từng trang mảng và chỉ ở đó. Màn này trả lời câu
 *    mà một mình trang tổng biết: người có mặt ở ba mảng thì PHỤ TRÁCH mảng nào.
 *
 * ⚠️ TÍCH HẾT = KHÔNG BÓ GÌ. Giữ danh sách đầy đủ trong sổ thì ngày mai thêm mảng thứ năm là
 *    người ấy lặng lẽ không thấy mảng mới — đúng cái bẫy "danh sách tên khai tay" đã tránh ở
 *    cửa vào trang.
 * ══════════════════════════════════════════════════════════════════════════════════════════════ */
var CH = { kq: null, dangDoc: false };

function veCauHinh(){
  var o = document.getElementById('bang');
  if (!CH.kq){ o.innerHTML = '<p class="mo">Đang đọc…</p>'; docCauHinh(); return; }
  var k = CH.kq, bans = k.bans || [];

  var h = '<div class="card"><div class="ch"><h2>⚙️ Cấu hình — ai làm mảng nào</h2></div>' +
    '<div class="cb"><p class="nho mo">Trang tổng <b>không khai quyền</b>: ai được duyệt, cấp tiền, ' +
    'quyết toán hay xuất MISA vẫn khai ở bảng <b>Phân quyền</b> của từng trang mảng. Ở đây chỉ bó ' +
    '<b>phạm vi mảng</b> — người có tài khoản ở nhiều mảng thì làm việc trên trang này ở mảng nào.</p>' +
    '<p class="nho mo">Bỏ tích một mảng = người ấy <b>không thấy và không bấm được</b> đơn của mảng ' +
    'đó trên trang tổng. <b>Tích hết = không bó gì</b> — mảng mới thêm sau này họ cũng thấy luôn.</p>' +
    '<p class="nho mo">Cột <b>Vào trang tổng</b> mở cửa cho người cần theo dõi mà chưa có quyền xử lý ' +
    'đơn nào (giám đốc, kế toán đang bàn giao), hoặc khoá lại người có quyền mà không cần vào đây. ' +
    'Ai đã có quyền duyệt · cấp tiền · quyết toán · xuất MISA ở một mảng thì <b>tự vào được</b>, ' +
    'không phải khai.</p>' +
    '<div class="cuon" style="margin-top:10px"><table><thead><tr><th>Người</th>' +
    '<th style="text-align:center">Vào trang tổng</th>' +
    bans.map(function(b){ return '<th style="text-align:center">'+esc(b.ten)+'</th>'; }).join('') +
    '<th>Vai ở từng mảng</th></tr></thead><tbody>';

  (k.ds||[]).forEach(function(x, i){
    h += '<tr><td><b>'+esc(x.ten)+'</b>' +
      ( x.vao ? '' : '<div class="nho" style="color:#b45309">không vào được trang tổng</div>' ) + '</td>';

    /* ⚠️ KHÔNG CHO TỰ KHOÁ MÌNH. Màn này chỉ Admin mở được; Admin bỏ tích chính mình là mất
       luôn đường quay lại, và chỗ mở ra chỉ còn nằm trong wp-admin. */
    var toi = ( TOI && TOI.ten && TOI.ten.toLowerCase() === String(x.ten||'').toLowerCase() );
    h += '<td style="text-align:center">' +
      '<input type="checkbox" data-vao="'+i+'"'+( x.vao ? ' checked' : '' ) +
      ( toi ? ' disabled title="Không tự khoá cửa của chính mình được"' : '' ) + '>' +
      '<div class="nho mo">'+esc(viCo(x, toi))+'</div></td>';

    bans.forEach(function(b){
      var coMat = (x.coMat||[]).indexOf(b.ban) >= 0;
      /* ⚠️ KHÔNG CÓ TÀI KHOẢN Ở MẢNG ẤY THÌ KHÔNG CÓ Ô TÍCH. Bày ô rồi tích vào cũng không mở
         được gì (sổ phạm vi chỉ THU HẸP, không nới ra) — một ô tích không làm gì là lời nói dối
         nhỏ mà người khai sẽ tin. */
      if (!coMat){ h += '<td style="text-align:center" class="mo nho" title="Không có tài khoản ở mảng này">—</td>'; return; }
      var lam = ( x.lam === null || x.lam === undefined ) ? null : x.lam;
      var tich = ( lam === null ) || ( lam.indexOf(b.ban) >= 0 );
      h += '<td style="text-align:center"><input type="checkbox" data-i="'+i+'" data-ban="'+esc(b.ban)+'"' +
           ( tich ? ' checked' : '' ) + '></td>';
    });
    var vai = [];
    Object.keys(x.vai||{}).forEach(function(kb){ vai.push(tenBanNgan(bans,kb)+': '+(x.vai[kb]||'—')); });
    h += '<td class="nho mo">'+esc(vai.join(' · '))+'</td></tr>';
  });

  h += '</tbody></table></div>' +
    '<div style="margin-top:12px;display:flex;gap:8px;align-items:center">' +
    '<button class="btn b-g" id="chLuu">💾 Lưu phạm vi mảng</button>' +
    '<span class="nho mo" id="chTin"></span></div></div></div>';
  o.innerHTML = h;

  document.getElementById('chLuu').onclick = function(){ luuCauHinh(); };
}

/* Vì sao người này vào được (hay không) — người khai cần đọc ra LÝ DO, vì bỏ tích một người
   đang vào theo quyền và bỏ tích một người vốn đã không vào là hai việc khác hẳn nhau. */
function viCo(x, toi){
  if (toi) return 'chính mình';
  if (x.ngoaiLe === 'them') return 'cho vào thêm';
  if (x.ngoaiLe === 'chan') return 'đang bị chặn';
  return x.coViec ? 'theo quyền sẵn có' : 'chưa có quyền nào';
}

function tenBanNgan(bans, khoa){
  for (var i=0;i<bans.length;i++){ if (bans[i].ban === khoa) return bans[i].ten; }
  return khoa;
}

function docCauHinh(){
  if (CH.dangDoc) return;
  CH.dangDoc = true;
  goi('cauHinh',{}).then(function(r){
    CH.dangDoc = false;
    if (r && r.error){
      document.getElementById('bang').innerHTML = '<div class="bao bao-loi">'+esc(r.error)+'</div>';
      return;
    }
    CH.kq = r; veCauHinh();
  }).catch(function(){
    CH.dangDoc = false;
    document.getElementById('bang').innerHTML = '<div class="bao bao-loi">Không gọi được máy chủ.</div>';
  });
}

function luuCauHinh(){
  var o = document.getElementById('bang');
  var gom = {};
  Array.prototype.forEach.call(o.querySelectorAll('input[type=checkbox][data-i]'), function(n){
    var i = n.getAttribute('data-i');
    if (!gom[i]) gom[i] = [];
    if (n.checked) gom[i].push(n.getAttribute('data-ban'));
  });
  /* Ô tích cửa vào đi cùng chuyến với ô tích mảng: một người một lượt ghi, không để hai lượt
     gọi cho một dòng rồi lượt sau hỏng mà lượt trước đã ghi. */
  var vao = {};
  Array.prototype.forEach.call(o.querySelectorAll('input[type=checkbox][data-vao]'), function(n){
    /* ⚠️ Ô BỊ KHOÁ (chính mình) KHÔNG GỬI. `disabled` chỉ chặn được ngón tay, không chặn được
       vòng lặp này — gom cả nó là máy chủ vẫn ghi đè cửa của chính người đang khai. */
    if (n.disabled) return;
    vao[n.getAttribute('data-vao')] = n.checked ? 1 : 0;
  });
  var ds = CH.kq.ds || [], can = [];
  /* Gộp khoá của cả hai sổ ô tích: một người chỉ có ô cửa vào mà không có ô mảng nào (mảng của
     họ đã bị gỡ khỏi trang) thì vẫn phải lưu được cửa vào cho họ. */
  var khoa = {};
  Object.keys(gom).forEach(function(i){ khoa[i] = 1; });
  Object.keys(vao).forEach(function(i){ khoa[i] = 1; });
  Object.keys(khoa).forEach(function(i){
    if (!ds[+i]) return;
    var x = { ten: ds[+i].ten, mang: gom[i] || [] };
    if (vao[i] !== undefined) x.vao = vao[i];
    can.push(x);
  });
  if (!can.length) return;

  var tin = document.getElementById('chTin');
  var nut = document.getElementById('chLuu');
  nut.disabled = true; if (tin) tin.textContent = 'Đang lưu…';
  /* Lưu tuần tự từng người: mỗi người một dòng sổ riêng, và lỗi ở một người không được kéo
     theo cả bảng. */
  var i = 0, loi = 0;
  (function ke(){
    if (i >= can.length){
      nut.disabled = false;
      if (tin) tin.textContent = loi ? ('Xong, nhưng '+loi+' người lưu không được.') : 'Đã lưu.';
      CH.kq = null; docCauHinh();
      return;
    }
    var x = can[i++];
    goi('luuCauHinh', x).then(function(r){ if (!r || r.error) loi++; ke(); })
      .catch(function(){ loi++; ke(); });
  })();
}

/* ══════════════════════════════════════════════════════════════════════════════════════════════
 * LÀM MỘT LƯỢT CHO NHIỀU ĐƠN.
 * ══════════════════════════════════════════════════════════════════════════════════════════════
 * 🔴 GỬI TUẦN TỰ, MỖI ĐƠN MỘT LƯỢT GỌI — không gộp thành một lời gọi "làm hết". Mỗi đơn đi qua
 *    đúng cái cổng và đúng cái chốt quyền như khi bấm tay, nên một đơn bị chối không kéo theo
 *    mười chín đơn kia, và nhật ký bên trang mảng vẫn ghi từng đơn một.
 *
 * 🔴 HỎI TRƯỚC, KÈM SỐ TIỀN. Đây là nút ra tiền cho cả chục đơn cùng lúc; bấm nhầm thì không có
 *    nút hoàn tác nào ở đây cả.
 *
 * ⚠️ ĐƠN NÀO XONG THÌ BỎ CHỌN NGAY. Giữ nguyên lựa chọn sau khi chạy là người ta bấm lần nữa
 *    lên đúng những đơn vừa làm.
 * ══════════════════════════════════════════════════════════════════════════════════════════════ */
function lamHangLoat(nut, viec){
  var lat = nut.getAttribute('data-lat');
  var hop = nut.closest('.buoc');
  if (!hop) return;
  var ds = [];
  Array.prototype.forEach.call(hop.querySelectorAll('input[data-chon]:checked'), function(x){
    var k = x.getAttribute('data-chon'), i = k.indexOf('|');
    ds.push({ ban: k.slice(0, i), maDon: k.slice(i + 1), khoa: k });
  });
  if (!ds.length) return;

  var ten = ( ( VIEC_HL[NHOM] || [] ).filter(function(v){ return v.viec === viec; })[0] || {} ).ten || viec;
  var tong = 0;
  ROWS.forEach(function(d){
    if (CHON[d.ban+'|'+d.maDon] && d.tien !== null &&
        ds.some(function(x){ return x.khoa === d.ban+'|'+d.maDon; })) { tong += Number(d.tien); }
  });
  if (!confirm(ten+' cho '+ds.length+' đơn, cộng '+tien(tong)+'?\n\nViệc này không hoàn tác được ở đây.')) return;

  nut.disabled = true;
  var i = 0, xong = 0, loi = [];
  (function ke(){
    if (i >= ds.length){
      datBao(loi.length ? 'loi' : 'ok',
        'Đã '+ten.toLowerCase()+' '+xong+'/'+ds.length+' đơn.' +
        ( loi.length ? ' Không được: '+loi.join(' · ') : '' ));
      veChinh();
      return;
    }
    var x = ds[i++];
    nut.textContent = ten+'… '+i+'/'+ds.length;
    goi(viec, { ban: x.ban, maDon: x.maDon }).then(function(r){
      if (r && r.error) { loi.push(x.maDon+' ('+r.error+')'); }
      else { xong++; delete CHON[x.khoa]; }
      ke();
    }).catch(function(){ loi.push(x.maDon+' (không gọi được máy chủ)'); ke(); });
  })();
}

function lam(nut, d, viec){
  var args = { ban:d.ban, maDon:d.maDon };
  /* ⚠️ DUYỆT thì KHÔNG hỏi gì — anh Thắng 13/09/2026: *"bấm duyệt không cần hỏi cái này nhé"*.
     TRẢ LẠI thì phải hỏi lý do: đơn trả về không kèm lý do thì người lập gửi lại y nguyên. */
  if (viec === 'traLai'){
    var ly = prompt('Trả lại đơn '+d.maDon+' — lý do để người lập biết sửa gì:');
    if (ly === null) return;
    args.lyDo = ly;
  }
  nut.disabled = true;
  goi(viec, args).then(function(r){
    nut.disabled = false;
    if (r && r.error) datBao('loi', r.error); else datBao('ok', (r&&r.message)||'Xong.');
    veChinh();
  }).catch(function(){
    nut.disabled = false; datBao('loi','Không gọi được máy chủ.'); veChinh();
  });
}

/* ══════════════════════════════════════════════════════════════════════════════════════════════
 * XEM TRƯỚC ẢNH CHỨNG TỪ — anh Thắng 14/09/2026: *"rê chuột vào phóng ảnh lên nhé"*.
 *
 * 🔴 UỶ QUYỀN SỰ KIỆN Ở `document`, KHÔNG GẮN TỪNG ẢNH. Bảng dòng chi được vẽ lại sau mỗi lượt
 *    bấm Xem, mỗi lượt duyệt, mỗi lượt làm mới; gắn tay từng ảnh là phải nhớ gắn lại ở mọi chỗ
 *    vẽ — và chỗ quên sẽ là chỗ im lặng không phóng, không ai biết vì sao.
 *
 * ⚠️ LẬT KHUNG KHI CHẠM MÉP MÀN. Ảnh ở cột cuối cùng bên phải, mà khung mở sang phải thì nó tràn
 *    ra ngoài và bị cắt — đúng những dòng cuối bảng, chỗ người ta hay soi nhất.
 * ══════════════════════════════════════════════════════════════════════════════════════════════ */
(function(){
  var LE = 18;   // cách con trỏ, đủ để không che chính ô ảnh

  function hop(){ return document.getElementById('anhTo'); }

  function datCho(e){
    var o = hop(); if (!o || o.style.display !== 'block') return;
    var w = o.offsetWidth, h = o.offsetHeight;
    var x = e.clientX + LE, y = e.clientY + LE;
    if (x + w > window.innerWidth  - 8) x = e.clientX - w - LE;
    if (y + h > window.innerHeight - 8) y = e.clientY - h - LE;
    /* Chạm cả hai mép thì ghim vào trong màn, đừng để âm — âm là mất nửa khung. */
    o.style.left = Math.max(8, x) + 'px';
    o.style.top  = Math.max(8, y) + 'px';
  }

  document.addEventListener('mouseover', function(e){
    var n = e.target;
    if (!n || n.tagName !== 'IMG' || !n.getAttribute('data-to')) return;
    var o = hop(); if (!o) return;
    o.querySelector('img').src = n.getAttribute('data-to');
    o.style.display = 'block';
    datCho(e);
  });
  document.addEventListener('mousemove', datCho);
  document.addEventListener('mouseout', function(e){
    var n = e.target;
    if (!n || n.tagName !== 'IMG' || !n.getAttribute('data-to')) return;
    var o = hop(); if (o) o.style.display = 'none';
  });
  /* Cuộn trang thì tắt: khung gắn theo con trỏ, cuộn xong nó lơ lửng sai chỗ. */
  window.addEventListener('scroll', function(){
    var o = hop(); if (o) o.style.display = 'none';
  }, true);
})();

/* Bấm ra ngoài thì đóng hộp chuông — hộp che mất bảng bên dưới. */
document.addEventListener('click', function(){
  if (!CHUONG.mo) return;
  var o = document.getElementById('hopChuong');
  if (o){ o.hidden = true; CHUONG.mo = false; }
});

/* ─────────────────────────────────────────────────────────────────── khởi động */
if (layThe()){
  goi('toi',{}).then(function(r){
    if (r && r.error){ datThe(''); veVao(); return; }
    TOI = r; veChinh();
  }).catch(function(){ veVao(); });
} else { veVao(); }
</script>
</body>
</html>
