<style>
/*═══════════════════════════════════════════════════════════
 * JP CAPSULE v2 — Css (web nhân viên, ưu tiên điện thoại)
 *═══════════════════════════════════════════════════════════*/

:root{
  --bg:#f4f5f7; --card:#fff; --ink:#111827; --sub:#6b7280;
  --line:#e5e7eb; --primary:#111827; --gold:#c9a227;
  --warn:#b45309; --warnBg:#fffbeb; --danger:#b91c1c;
  --ok:#047857; --okBg:#ecfdf5; --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
h1{font-size:20px;margin:0}
h2{font-size:15px;margin:0 0 10px;font-weight:700}

.screen{display:none}
.screen.active{display:block}
.hidden{display:none !important}

/* Hộp thoại — dùng cho màn đổi PIN. Trước đây web nhân viên chưa có cái nào. */
.modalBg{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:70;
  display:flex;align-items:center;justify-content:center;padding:16px}
.modalBox{background:#fff;border-radius:14px;padding:18px;width:100%;max-width:340px;
  box-shadow:0 18px 50px rgba(0,0,0,.24)}
.modalBox h2{margin:0 0 4px;font-size:17px}
.modalBox .sub{font-size:12px;color:var(--sub);margin:0 0 12px}
.pinIn{width:100%;font-size:24px;text-align:center;letter-spacing:10px;
  padding:10px;border:1px solid var(--line);border-radius:10px}
.modalAct{display:flex;gap:8px;margin-top:14px}
.modalAct .btn{flex:1}
.pad{padding:12px 12px 90px}
.sub{color:var(--sub);font-size:12px;display:block}
.hint{color:var(--sub);font-size:12px;margin:6px 0 0}
.secTitle{margin:18px 4px 8px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:14px;margin-bottom:12px}

.loginWrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.loginCard{width:100%;max-width:380px}
.brand{display:flex;gap:12px;align-items:center;margin-bottom:16px}
.logo{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(135deg,#3f3f46,var(--gold));color:#fff;font-weight:800}

.topbar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);
  padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.topbar .center{text-align:center;flex:1;min-width:0}
.topbar strong{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.fld{display:block;margin-bottom:10px}
.fld>span{display:block;font-size:12px;color:var(--sub);margin-bottom:4px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);
  border-radius:10px;font-size:16px;background:#fff;color:var(--ink);font-family:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid #cbd5e1;border-color:#cbd5e1}
input[readonly],input:disabled{background:#f3f4f6;color:var(--sub)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

.btn{border:1px solid var(--line);background:#fff;color:var(--ink);
  padding:11px 14px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn.ghost{background:#fff}
.btn.block{width:100%;margin-top:4px}
.btn.sm{padding:7px 10px;font-size:13px}
.btn.danger{color:var(--danger);border-color:#fecaca}
.btn:active{transform:translateY(1px)}
.actions{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);
  padding:10px 12px;display:grid;grid-template-columns:1fr 1.4fr;gap:8px}

/* Dai nut cua bang gan anh loat. ⚠️ KHONG dung lai `.actions` — cai do
   `position:fixed` o day man hinh, dat bang gan vao do la no bay xuong duoi cung. */
.loatNut{display:flex;gap:8px;margin-top:10px}
.loatNut .btn{flex:1}

.zone{background:#fff;border:1px solid var(--line);border-radius:var(--r);
  padding:12px;margin-bottom:12px}
.zoneHead{display:flex;gap:8px;align-items:flex-end;margin-bottom:10px}
.zoneHead .fld{flex:1;margin:0}
.mrow{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;background:#fcfcfd}
.mrow.hasWarn{border-color:#fcd34d;background:var(--warnBg)}
.mrowTop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.mrowTop b{font-size:14px}
.calc{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;color:var(--sub)}
.calc b{color:var(--ink)}
.groupTitle{font-size:11px;color:var(--sub);text-transform:uppercase;
  letter-spacing:.04em;margin:10px 0 6px;font-weight:700}

.sum .sumRow{display:flex;justify-content:space-between;padding:6px 0;font-size:14px}
.sum .sumRow.sub2{color:var(--sub);font-size:13px;padding-left:8px}
.sum .sumRow.big{border-top:1px solid var(--line);margin-top:8px;padding-top:10px;
  font-size:16px;font-weight:700}

.warnCard{border-color:#fcd34d;background:var(--warnBg)}
.warnItem{border-top:1px dashed #fcd34d;padding:7px 0;font-size:13px}
.warnItem:first-child{border-top:0}
.warnItem b{color:var(--warn)}
.alert{border-radius:12px;padding:11px 12px;margin-bottom:12px;font-size:14px}
.alert.warn{background:var(--warnBg);border:1px solid #fcd34d;color:var(--warn)}
.pill{background:#fde68a;color:var(--warn);border-radius:999px;padding:1px 8px;font-size:12px}

.list .item{background:#fff;border:1px solid var(--line);border-radius:12px;
  padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px;cursor:pointer}
.list .item:active{background:#f9fafb}
.badge{font-size:11px;padding:3px 9px;border-radius:999px;background:#f3f4f6;
  color:var(--sub);white-space:nowrap;font-weight:600}
.badge.pending{background:#e0f2fe;color:#0369a1}
.badge.fixing{background:#fee2e2;color:var(--danger)}
.badge.done{background:var(--okBg);color:var(--ok)}
.badge.draft{background:#f3f4f6;color:var(--sub)}
.signs{font-size:11px;color:var(--sub);margin-top:3px}

.photoStrip{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.thumb{position:relative;width:62px;height:62px;border-radius:9px;overflow:hidden;
  border:1px solid var(--line);background:#f3f4f6}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
/* O thay cho anh nho KHONG xem truoc duoc (file anh chi co quyen chu so huu).
   Phai noi ro DA TAI LEN — o trong tron la nhan vien tuong chup chua duoc roi
   chup lai, sinh anh trung. */
.thumb .thumbVo{width:100%;height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1px;background:#E8F6EE;
  color:#15803D;font-size:8px;line-height:1.1;text-align:center;padding:2px;
  box-sizing:border-box}
.thumb .thumbVo b{font-size:15px;line-height:1}
/* Trong BANG thi o chi 28px — hai dong chu bi cat, doc khong ra. Bo chu, giu dau
   ✓ (chu day du con o `title`), va dua so `n/N ✓` ben canh la du de nhan vien biet
   anh da len. Cat chu roi de nguyen la chu vua khong doc duoc vua chiem cho. */
.photoCell .thumb .thumbVo span{display:none}
.photoCell .thumb .thumbVo b{font-size:16px}
.thumb .x{position:absolute;top:1px;right:1px;background:rgba(0,0,0,.6);color:#fff;
  width:19px;height:19px;border-radius:999px;font-size:12px;line-height:19px;text-align:center}
.addPhoto{width:62px;height:62px;border:1px dashed #cbd5e1;border-radius:9px;
  display:grid;place-items:center;color:var(--sub);font-size:22px;background:#fff}
.progressText{font-size:13px;color:var(--sub)}

.msg{font-size:13px;margin:8px 0 0;min-height:18px}
.msg.err{color:var(--danger)}
.msg.ok{color:var(--ok)}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);z-index:50;
  background:#111827;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;max-width:90%}
.busy{position:fixed;inset:0;background:rgba(255,255,255,.75);z-index:60;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:14px}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--primary);
  border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* Trang thai NHAP — nhan vien phai THAY so da an toan hay chua, khong phai doan.
   Ba mau: xanh = da luu, vang = con cho tu luu, do = chua len duoc he thong. */
.nhapState{font-size:12px;line-height:1.5;padding:9px 12px;border-radius:10px;
  margin:0 0 8px;border:1px solid var(--line);background:#F8FAFC;color:var(--sub)}
.nhapState.ok{background:#ECFDF5;border-color:#A7F3D0;color:#047857}
.nhapState.cho{background:#FFFBEB;border-color:#FCD34D;color:#92400E}
.nhapState.loi{background:#FEF2F2;border-color:#FECACA;color:#B91C1C;font-weight:600}

@media(min-width:720px){
  .pad{max-width:820px;margin:0 auto}
  .actions{max-width:820px;margin:0 auto;position:sticky;border-radius:12px 12px 0 0}
}

/*═══════ BẢNG NHẬP THEO ĐÚNG FORM GIẤY ═══════*/
.tblWrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);
  border-radius:10px;background:#fff;margin-bottom:10px}
table.form{border-collapse:collapse;width:max-content;min-width:100%;font-size:13px}
table.form th,table.form td{border:1px solid var(--line);padding:0;text-align:center;
  white-space:nowrap;vertical-align:middle}
table.form th{background:#f8fafc;color:var(--sub);font-size:11px;font-weight:700;
  padding:6px 8px;text-transform:uppercase;letter-spacing:.02em}
table.form th.grp{background:#eef2f7;color:var(--ink)}
/* Dòng TỔNG cuối bảng (Andy 07/08/2026: "bảng cần có tổng phía dưới mỗi cột").
   Nền đậm + gạch trên để mắt tách nó khỏi dòng dữ liệu cuối cùng — không thì
   nhìn tưởng là một mã hàng nữa. */
table.form tr.tongRow td{background:#eef2f7;border-top:2px solid var(--line2, #cbd5e1);
  font-weight:700;color:var(--ink);padding:7px 6px;white-space:nowrap}
table.form tr.tongRow td.lbl{text-align:left;font-size:12px}

/* VAI TRÒ CỦA CỘT — Andy 04/08/2026: "cột hàng còn lộn xộn, nhân viên sẽ điền
   hay gán ảnh". Ô nào gõ được / ô nào server tính / ô nào chuyển từ kỳ trước
   trước đây chỉ phân biệt được bằng màu nền nhạt, không ai đoán ra. Nay đánh dấu
   thẳng trên đầu cột, và có chú giải dưới bảng. */
table.form th.rNV{background:#eff6ff;color:#1d4ed8}
table.form th.rTU{background:#f1f5f9;color:#475569}
table.form th.rKY{background:#fef9c3;color:#92400e}
table.form th.rANH{background:#f5f3ff;color:#6d28d9}
table.form th .rl{display:block;font-size:9px;font-weight:800;letter-spacing:.4px;
  opacity:.85;margin-top:2px}
.chuGiai{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--sub);
  margin:6px 0 0;padding:7px 9px;background:#f8fafc;border:1px solid var(--line);
  border-radius:8px}
.chuGiai b{font-weight:800}
.cgNV b{color:#1d4ed8}.cgTU b{color:#475569}.cgKY b{color:#92400e}.cgANH b{color:#6d28d9}
table.form td{height:38px}
table.form td.lbl{padding:0 8px;text-align:left;font-weight:600;background:#fafafa;
  position:sticky;left:0;z-index:2;box-shadow:1px 0 0 var(--line)}
table.form th.lbl{position:sticky;left:0;z-index:3}
table.form input,table.form select{width:100%;height:36px;border:0;border-radius:0;
  padding:0 7px;font-size:14px;text-align:right;background:transparent}
table.form select{text-align:left;font-size:13px}
table.form input:focus,table.form select:focus{outline:2px solid #94a3b8;outline-offset:-2px}
table.form input[readonly]{background:#f3f4f6;color:var(--sub);font-weight:600}
/* ⚠️ `display:table-cell` là BẮT BUỘC, không phải cho đẹp.
   Có rule chung `.calc{display:flex}` ở trên (dùng cho khối tổng ngoài bảng). Ô
   `td.calc` trong bảng nhập trúng luôn rule đó ⇒ display:flex ⇒ ô bị lấy ra khỏi
   hàng của bảng và XẾP DỌC, làm cả bảng lệch cột: nhân viên nhìn số Actual nằm dưới
   cột khác. Bảng nhập nào cũng có 4–5 ô TỰ TÍNH nên lệch gần hết bảng.
   Chỉ lộ ra khi chụp màn hình — đếm số cột trong HTML vẫn đúng 20/20. */
table.form td.calc{display:table-cell;background:#f8fafc;font-weight:700;
  padding:0 8px;text-align:right;vertical-align:middle}
table.form td.warn{background:var(--warnBg)}
table.form tr.warnRow td{background:var(--warnBg)}
table.form td.act{padding:0 4px}
.w70{width:70px}.w90{width:90px}.w110{width:110px}.w140{width:140px}.w170{width:170px}
/* Bang tien mau TACH chi con 10 cot nen o TEN HANG duoc rong hon. `w170` bop chu
   xuong 153px trong khi "Trung Capsule 100k" can 159px ⇒ chu bi CAT — dung bay
   luoi 31 cot, va `input.value` doc ra thi van du chu nen chi hinh hoc bat duoc. */
.w210{width:210px}
.zoneTitle{display:flex;gap:8px;align-items:center;margin:2px 0 8px;flex-wrap:wrap}
.zoneTitle b{font-size:14px}
.miniBtn{border:1px solid var(--line);background:#fff;border-radius:8px;
  padding:5px 9px;font-size:12px;font-weight:600;cursor:pointer}
.miniBtn.danger{color:var(--danger);border-color:#fecaca}
.photoCell{display:flex;gap:3px;align-items:center;padding:0 5px}
.photoCell img{width:28px;height:28px;object-fit:cover;border-radius:4px;border:1px solid var(--line)}
.photoCell .add{width:28px;height:28px;border:1px dashed #cbd5e1;border-radius:4px;
  display:grid;place-items:center;color:var(--sub);font-size:16px;background:#fff}
/* Trong BẢNG thì ảnh phải nhỏ lại. `.thumb`/`.addPhoto` mặc định 62px — dòng bảng
   cao 38px nên ảnh làm dãn cả dòng, lệch hết cột. */
.photoCell .thumb,.photoCell .addPhoto{width:28px;height:28px;border-radius:4px;flex:0 0 auto}
.photoCell .addPhoto{font-size:16px}
.photoCell .thumb .x{width:13px;height:13px;line-height:13px;font-size:9px}
/* Cần mấy ảnh / đã có mấy ảnh — số này cấu hình theo từng ô máy */
.photoNeed{font-size:10px;font-weight:700;color:var(--warn);white-space:nowrap;flex:0 0 auto}
.photoNeed.du{color:var(--ok)}
.scrollHint{font-size:11px;color:var(--sub);margin:0 0 6px}

/* Bàn số bấm PIN — ngón tay trên điện thoại, nên ô bấm to và thưa */
.pinBox{font-size:30px;text-align:center;letter-spacing:14px}
.pinPad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.pinKey{height:58px;font-size:22px;font-weight:600;background:#fff;
  border:1px solid var(--line);border-radius:12px;cursor:pointer}
.pinKey:active{background:#e2e8f0}
.pinKey.alt{font-size:18px;color:var(--sub)}
</style>


<style>
/* ══════ KHỐI "TRƯỚC KHI NỘP" (Andy chốt 05/08/2026) ══════
   Checklist là thứ CHẶN nộp, cảnh báo thì không — nên hai khối phải trông khác nhau
   rõ rệt, không chỉ khác chữ. Đủ thì xanh viền mảnh, thiếu thì đỏ viền dày. */
#preSubmit{margin-top:14px}
.chkCardOk{border-left:4px solid #16a34a}
.chkCardBad{border-left:4px solid #dc2626;background:#fff5f5}
.chkOk{color:#15803d;font-weight:700;padding:2px 0}
.chkBad{color:#b91c1c;font-weight:700;padding:2px 0}
.chkItem{padding:5px 0 5px 4px;font-size:14px;border-top:1px dashed #e5e7eb}
.chkItem.bad{color:#b91c1c}
.chkItem.warn{color:#92400e}
/* Nút Nộp khi chưa đủ điều kiện: mờ nhưng VẪN BẤM ĐƯỢC — bấm vào phải nói ra lý do,
   `disabled` thì không có sự kiện nào nên nhân viên không biết vì sao bấm không được. */
.btn.primary.chuaDu{opacity:.5}

/* ══════ BUNG BẢNG (Andy: "cuộn ngang nhưng kiểu bung") ══════
   Giữ nguyên cuộn ngang, thêm chế độ BUNG: bảng tràn ra hết bề rộng cửa sổ và chữ
   nhỏ lại một bậc, nên nhìn được hết cột mà không phải kéo. Bấm lại thì thu về.
   ⚠️ Không dùng `position:fixed` — bàn phím điện thoại đẩy layout, ô nhập chạy mất. */
/* ⚠️ Chừa CHỖ RIÊNG cho nút, đừng đặt `top:-30px` cho nó nằm đè lên khối trên.
   Đã mắc: ở bảng kho ngoài nút đè lên câu hướng dẫn, đọc ra "…KHÔ⤢ Bung rộng".
   Chỉ ảnh mới thấy — đếm phần tử thì cả hai đều "có mặt". */
.bungWrap{position:relative;padding-top:30px}
.bungBtn{position:absolute;right:6px;top:0;z-index:3}
.tblWrap.bung{overflow-x:auto;margin-left:calc(50% - 49vw);width:98vw;max-width:98vw}
.tblWrap.bung table.form{font-size:12.5px}
.tblWrap.bung table.form input,.tblWrap.bung table.form select{font-size:12.5px}
.tblWrap.bung table.form td,.tblWrap.bung table.form th{padding-left:4px;padding-right:4px}
</style>

<style>
/* Nút ✎ gửi đề nghị sửa tồn đầu — nằm TRONG ô, góc phải, nhỏ để không đẩy cột rộng ra.
   Ô tồn đầu chỉ đọc nên không tranh chỗ bấm với con trỏ nhập. */
table.form td{position:relative}
.dnBtn{position:absolute;right:2px;top:50%;transform:translateY(-50%);
  padding:0 4px;font-size:12px;line-height:18px;opacity:.55}
.dnBtn:hover{opacity:1}
</style>
