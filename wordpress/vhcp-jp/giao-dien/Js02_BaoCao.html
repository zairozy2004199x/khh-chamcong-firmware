<script>
/*═══════════════════════════════════════════════════════════
 * JP CAPSULE v2 — Js02_BaoCao
 * Màn nhập báo cáo dạng BẢNG, giữ đúng bố cục form giấy:
 *   · Máy TIỀN : 1 dòng = 1 ô máy, cột Before / After / Actual
 *   · Máy XU   : mỗi ô = 2 dòng COIN và MONEY, gộp ô phần Collection
 * Mọi con số chính thức đều do SERVER trả về sau khi lưu.
 *═══════════════════════════════════════════════════════════*/

function openNewReport() {
  var loc = $('selLoc').value, f = $('inFrom').value, t = $('inTo').value || $('inFrom').value;
  if (!loc) { setMsg('openMsg', 'Chọn cơ sở', 'err'); return; }
  if (!f) { setMsg('openMsg', 'Chọn ngày bắt đầu', 'err'); return; }

  busy(true, 'Đang mở báo cáo…');
  var mt = $('selType') ? $('selType').value : 'TIEN';
  srv('jpOpenReport', APP.token, loc, f, t, mt).then(function (d) {
    busy(false);
    if (!d.ok) { setMsg('openMsg', d.msg, 'err'); return; }
    setMsg('openMsg', '');
    bindReport(d);
    jpNoiGieo(d.gieo);
  }).catch(function (e) { busy(false); setMsg('openMsg', e.message, 'err'); });
}

/**
 * Nói ra đã TỰ GHI LẠI bao nhiêu dòng từ kỳ trước.
 *
 * Andy 11/08/2026: *"sao nhân viên gửi báo cáo rồi mà báo cáo sau nó kh tự ghi lại
 * hàng tên mã misa và tồn đầu"*.
 *
 * ⚠️ **Gieo im lặng cũng là một vấn đề.** Nhân viên mở ra thấy sẵn tên hàng và tồn đầu
 * thì tin luôn là số đã chốt — mà nếu gieo từ báo cáo **chưa duyệt** thì kế toán còn có
 * thể trả về và số đó đổi. Nên nói rõ nguồn, và nói rõ ô tồn đầu **gõ được**.
 *
 * ⚠️ Dòng bị bỏ vì **đã trả kho về 0** cũng phải nói ra — không thì nhân viên tưởng
 * web làm mất mã hàng.
 */
function jpNoiGieo(g) {
  /* Không gieo được dòng nào MÀ CÓ LÝ DO thì phải nói ra — bảng trắng trông y hệt lúc
     app hỏng, nhân viên không có đường nào biết mình cần làm gì. */
  if (g && !g.soDong && g.lyDo) { toast(g.lyDo); return; }
  if (!g || !g.soDong) return;
  var bo = (g.boQuaTraKho || []).length;
  var t = 'Đã tự ghi lại ' + g.soDong + ' dòng từ kỳ trước (đến ' + dmy(g.denNgay) + ')';
  if (bo) t += ' · bỏ ' + bo + ' mã đã trả kho về 0: ' + g.boQuaTraKho.join(', ');
  if (g.daDuyet) {
    t += '. Tồn đầu là tồn cuối kỳ đó, đã duyệt nên bị khoá.';
  } else {
    t += '. ⚠️ Kỳ đó CHƯA được kế toán duyệt nên tồn đầu có thể còn đổi — ô tồn đầu ' +
         'vẫn GÕ ĐƯỢC, soát lại giúp.';
  }
  toast(t);
}

/**
 * Đổi kỳ báo cáo. Máy chủ là chốt cuối — nó chặn trùng kỳ và chặn báo cáo đã nộp.
 *
 * ⚠️ Đổi xong phải **nạp lại báo cáo**: `rpPeriod` trên thanh tiêu đề in kỳ CŨ, mà hai
 * chỗ cùng nói một kỳ mà lệch nhau thì không ai biết chỗ nào đúng.
 */
function jpDoiKy() {
  var f = $('kyTu').value, t = $('kyDen').value;
  if (!f) { toast('Chọn ngày bắt đầu kỳ'); return; }
  if (!confirm('Đổi kỳ báo cáo sang ' + dmy(f) + ' – ' + dmy(t || f) + '?')) return;
  busy(true, 'Đang đổi kỳ…');
  srv('jpSuaKyBaoCao', APP.token, APP.report.id, f, t).then(function (r) {
    busy(false); toast(r.msg);
    openReportById(APP.report.id);
  }).catch(function (e) { busy(false); toast(e.message); });
}

function openReportById(id) {
  busy(true, 'Đang tải…');
  srv('jpGetReport', APP.token, id).then(function (d) {
    busy(false); bindReport(d);
  }).catch(function (e) { busy(false); toast(e.message); });
}

function jpBackHome() {
  /* Nháp đã giữ trên máy ở mọi lần gõ, nên rời đi KHÔNG mất số — nói rõ vậy thay vì
     chỉ hỏi "rời đi?" khiến nhân viên tưởng mất. Vẫn thử lưu lên hệ thống trước. */
  if (APP.dirty && APP.canEdit) {
    if (!confirm('Còn thay đổi chưa lưu lên hệ thống.\n\n' +
        'Số đã gõ vẫn được giữ TRÊN MÁY NÀY — mở lại báo cáo là làm tiếp được.\n\n' +
        'Rời đi?')) return;
    jpLuuNhapMay();
    jpSaveDraft(false, true);         // thử đẩy lên, không chặn việc rời đi
  }
  APP.dirty = false;
  show('scHome');
  loadMyReports();
}

function bindReport(d) {
  APP.report = d.head;
  APP.zones = d.zones || [];
  APP.rows = d.rows || [];
  APP.photos = d.photos || [];
  APP.canEdit = d.canEdit;
  /* ⚠️ Giữ lại để `renderZones` in ra DẢI BĂNG cố định. Chỉ toast là sai: toast tắt đi
     thì bảng vẫn trắng mà không còn dòng nào giải thích — đúng bệnh "cảnh báo chỉ hiện
     MỘT LẦN rồi mất" đã ghi ở mục ký một phần. */
  APP.gieo = d.gieo || null;
  /* Đồng hồ đếm trứng — máy chủ đọc từ CƠ SỞ mỗi lần mở, không chốt vào báo cáo.
     `!== false` chứ không `!!`: thiếu trường (bản cũ, hoặc lỗi mạng) phải rơi về CÓ,
     tức hiện đủ cột. Ẩn cột vì một trường `undefined` là giấu ô nhân viên cần điền. */
  APP.coDhTrung = d.coDhTrung !== false;
  /* Cơ sở này có được chọn giá 1 xung theo dòng không — mặc định KHÔNG (chỉ SUNWORLD PQ
     có hai loại máy lẫn nhau). Andy chốt 29/08/2026: *"còn mấy cơ sở khác ẩn đó đi"*. */
  APP.chonGiaXung = d.chonGiaXung === true;
  APP.headWarns = d.headWarns || [];
  APP.trungNguoiKhac = d.trungNguoiKhac || [];
  APP.dirty = false;

  $('rpLoc').textContent = d.head.locationName;
  $('rpPeriod').textContent = dmy(d.head.fromDate) + ' – ' + dmy(d.head.toDate) +
    ' · ' + (d.head.machineType === 'XU' ? 'Máy xu' : 'Máy tiền') +
    (jpLaTach(d.head) ? ' · mẫu tách tiền / hàng' : '');
  var b = $('rpStatus');
  b.textContent = statusText(d.head.status);
  b.className = 'badge ' + badgeCls(d.head.status);

  /* Ô đổi kỳ CHỈ hiện khi báo cáo đang sửa được — đã nộp thì phải bấm "Sửa trong 24
     giờ" trước, và chính hàm đó giữ đồng hồ. Hiện ô lúc không sửa được là mời người ta
     bấm rồi ăn lỗi từ máy chủ. */
  $('kyBox').classList.toggle('hidden', !d.canEdit);
  jpHienNutXoa();
  $('kyTu').value = d.head.fromDate;
  $('kyDen').value = d.head.toDate;

  /* Mẫu TÁCH: số tiền đọc từ APP của máy, KHÔNG có đồng hồ nào (Andy chốt 12/08/2026).
     In "theo đồng hồ" ở khối tổng là web nói sai nguồn của con số — cùng bệnh với màn
     Tổng quan kho dạy `Nợ 641` sau khi đầu tài khoản đã đổi. */
  var mauTach = jpLaTach(d.head);
  if ($('lbRev')) {
    $('lbRev').textContent = mauTach ? 'Doanh thu theo APP của máy'
                                     : 'Doanh thu theo đồng hồ';
  }
  if ($('lbCashMeter')) {
    $('lbCashMeter').textContent = mauTach ? '· Tiền mặt APP báo'
                                           : '· Tiền mặt theo đồng hồ';
  }

  var rb = $('rejectBox');
  if (d.head.status === 'CAN_SUA' && d.head.rejectReason) {
    rb.innerHTML = '<b>Kế toán ' +
      (d.head.rejectPart === 'STOCK' ? 'kho' : 'doanh thu') +
      ' trả về:</b><br>' + esc(d.head.rejectReason);
    rb.classList.remove('hidden');
  } else rb.classList.add('hidden');

  $('inAdj').value = d.head.adjMachine || 0;
  $('inAdjNote').value = d.head.adjMachineNote || '';
  $('inRefund').value = d.head.refundCustomer || 0;
  $('inRefundNote').value = d.head.refundNote || '';
  $('inRemark').value = d.head.remark || '';

  /* Hai nhắc nhở về cấu hình / trùng người — nói ngay, đừng để nhập xong mới lệch */
  var nhac = [];

  if (!machinesOfLoc().length) {
    nhac.push('<b>Cơ sở này chưa cấu hình ô / máy nào.</b> ' +
      'Vẫn nhập được, nhưng số đầu kỳ sẽ lấy theo mã hàng thay vì theo từng ô — ' +
      'hai ô bán cùng mã hàng sẽ dùng chung một số. Báo kế toán thêm ô máy ở ' +
      'Cấu hình → Ô / máy.');
  }

  if (APP.trungNguoiKhac && APP.trungNguoiKhac.length) {
    nhac.push('<b>Cùng kỳ này còn ' + APP.trungNguoiKhac.length +
      ' báo cáo của người khác:</b> ' +
      APP.trungNguoiKhac.map(function (x) {
        return esc(x.userName) + ' (' + statusText(x.status) + ')';
      }).join(', ') +
      '. Chỉ số đồng hồ là số của máy — nếu hai người cùng báo một máy thì doanh thu ' +
      'bị tính hai lần. Soát lại xem ai thu máy nào.');
  }

  var cw = $('cfgWarnBox');
  if (nhac.length) {
    cw.innerHTML = nhac.join('<hr style="border:0;border-top:1px solid #fcd34d;margin:8px 0">');
    cw.classList.remove('hidden');
  } else cw.classList.add('hidden');

  if (!APP.zones.length) APP.zones = [{ id: '', name: 'Khu vực 1', clusterId: '', note: '' }];

  renderZones();
  paintTotals(d.head);
  paintWarnings();
  paintCheckList();
  /* Tien do anh da di kem `jpGetReport` — dung ban do, khong goi lai may chu. */
  refreshPhotoProgress(d.anhTienDo);
  /* Nháp tự lưu: đặt canh rời trang, in trạng thái, rồi mới mời phục hồi.
     Mời SAU khi đã vẽ xong bảng để nhân viên thấy số hiện có mà so. */
  jpDatCanhTuLuu();
  JP_NHAP_LOI = '';
  jpTrangThaiNhap();
  setTimeout(jpMoiPhucHoiNhap, 0);

  applyEditLock();
  show('scReport');
}

/**
 * Khoá mọi ô nhập / nút trong màn báo cáo khi không còn quyền sửa.
 * Trước đây chỉ disable `.actions button`, nên "+ Thêm khu vực", "+ Thêm ô/máy",
 * nút "×" và toàn bộ ô nhập trong bảng vẫn bấm được trên báo cáo đã nộp — nhân
 * viên nhập xong mới biết là không lưu được.
 */
function applyEditLock() {
  var lock = !APP.canEdit;
  document.querySelectorAll(
    '.actions button, #btnAddZone, #zoneWrap button, #zoneWrap select, ' +
    '#scReport .sum input, #scReport .sum textarea'
  ).forEach(function (e) { e.disabled = lock; });

  /* Ô nhập trong bảng: readonly để vẫn đọc được số, không sửa được */
  document.querySelectorAll('#zoneWrap input').forEach(function (e) {
    if (lock) e.readOnly = true;
  });
}

/*──────── Vẽ khu vực dưới dạng BẢNG ────────*/
function renderZones() {
  var wrap = $('zoneWrap'); wrap.innerHTML = '';

  /* DẢI BĂNG "vì sao bảng trắng" — đặt NGAY ĐẦU vùng bảng, không để cuối màn: cuối màn
     là phải cuộn mới thấy, mà người đang vội sẽ bỏ qua đúng người cần nó nhất.
     Chỉ hiện khi THẬT SỰ chưa có dòng nào — gieo được rồi mà vẫn treo dải băng là nói
     một chuyện không còn đúng. */
  if (APP.gieo && !APP.gieo.soDong && APP.gieo.lyDo && !(APP.rows || []).length) {
    var bang = el('div', 'alert warn');
    bang.innerHTML = '<b>Bảng chưa có dòng nào — web không tự ghi lại được từ kỳ trước.</b>' +
                     '<br>' + esc(APP.gieo.lyDo);
    wrap.appendChild(bang);
  }
  /* Vẽ lại là mọi dòng tổng cũ biến mất — xoá đăng ký, không thì `jpCapNhatTong`
     đi tìm những ô `id` không còn tồn tại và danh sách phình mãi. */
  JP_TONG = [];
  dsMaHang();                                   // nạp gợi ý mã hàng (thẻ nằm ngoài wrap)
  var isCoin = APP.report.machineType === 'XU';
  /* Mẫu do MÁY CHỦ chốt lúc tạo báo cáo (`head.bcMau`), không đọc lại từ cơ sở:
     kế toán đổi mẫu giữa buổi thì báo cáo đang nhập dở phải giữ đúng bố cục. */
  var laTach = !isCoin && jpLaTach(APP.report);

  APP.zones.forEach(function (z, zi) {
    var box = el('div', 'zone');

    /* --- Tiêu đề khu vực --- */
    var head = el('div', 'zoneTitle');
    head.innerHTML =
      '<b>Khu vực</b>' +
      '<input type="text" style="width:150px" value="' + esc(z.name) + '" ' +
        'oninput="jpZoneName(' + zi + ',this.value)">' +
      clusterSelect(z.clusterId, zi);
    var del = el('button', 'miniBtn danger', 'Xoá khu vực');
    del.onclick = function () { jpDelZone(zi); };
    head.appendChild(del);
    box.appendChild(head);

    if (hasQRCluster(z.clusterId)) {
      box.appendChild(el('div', 'groupTitle', 'Ảnh Pay Box / QR của cụm'));
      box.appendChild(el('div', 'photoStrip', '')).id = 'zp_' + zi;
    }

    var idx = [];
    APP.rows.forEach(function (r, ri) {
      if (r.zoneKey === undefined) r.zoneKey = zoneIndexOf(r.zoneId);
            /* Bảng tồn kho, KHO NGOÀI và bảng HÀNG (mẫu tách) đều tách riêng,
               không nằm trong khu vực */
      if (r.rowKind === 'STOCK' || r.rowKind === 'NGOAI' || r.rowKind === 'HANG') return;
      if (r.zoneKey === zi) idx.push(ri);
    });

    box.appendChild(el('p', 'scrollHint', 'Vuốt ngang để xem hết cột →'));
    var tw = el('div', 'tblWrap');
    tw.innerHTML = isCoin ? tableCoin(idx)
                 : laTach ? tableMayTien(idx)
                 : tableMoney(idx);
    box.appendChild(bungBang(tw, 'tien'));

    /* Nút bật cột bổ sung / trả kho chỉ có nghĩa ở mẫu CHUNG — mẫu tách không có
       cột hàng nào trong bảng tiền, bấm vào không đổi gì mà nhân viên tưởng hỏng. */
    if (!isCoin && !laTach) {
      var tg = el('button', 'btn ghost sm',
        JP_COT_THEM ? 'Ẩn cột bổ sung / trả kho' : 'Hiện cột bổ sung / trả kho');
      tg.onclick = jpToggleCotThem;
      box.appendChild(tg);
    }

    var add = el('button', 'btn ghost block', '+ Thêm ô / máy');
    add.onclick = function () { jpAddRow(zi); };
    box.appendChild(add);

    wrap.appendChild(box);
  });

  /* --- MẪU TÁCH: bảng HÀNG theo mã + BẢNG TỔNG có chênh lệch --- */
  if (laTach) {
    var hIdx = [];
    APP.rows.forEach(function (r, ri) { if (r.rowKind === 'HANG') hIdx.push(ri); });

    var hBox = el('div', 'zone');
    hBox.appendChild(el('div', 'zoneTitle', '<b>② HÀNG HOÁ THEO MÃ — tách khỏi bảng tiền</b>'));
    hBox.appendChild(el('p', 'scrollHint',
      'Một dòng = một mã hàng của CẢ cơ sở, không gắn vào ô máy nào. ' +
      'Kỳ đầu tiên tự gõ mã hàng · mã Misa · tồn đầu; từ kỳ sau web tự nhảy đủ dòng ' +
      'và tồn cuối kỳ trước thành tồn đầu kỳ này (ô đó khoá).'));
    var ht = el('div', 'tblWrap');
    ht.innerHTML = tableHang(hIdx);
    hBox.appendChild(bungBang(ht, 'hang'));
    var addH = el('button', 'btn ghost block', '+ Thêm mã hàng');
    addH.onclick = jpAddHangRow;
    hBox.appendChild(addH);
    wrap.appendChild(hBox);

    var tBox = el('div', 'zone');
    tBox.appendChild(el('div', 'zoneTitle', '<b>BẢNG TỔNG — so tiền với hàng</b>'));
    var tt = el('div', 'tblWrap');
    tt.innerHTML = bangTongTachHtml();
    tBox.appendChild(tt);
    wrap.appendChild(tBox);
  }

  /* --- MÁY XU: bảng hàng tồn cơ sở, tách hẳn khỏi bảng tiền --- */
  if (isCoin) {
    var sIdx = [];
    APP.rows.forEach(function (r, ri) { if (r.rowKind === 'STOCK') sIdx.push(ri); });

    var sBox = el('div', 'zone');
    sBox.appendChild(el('div', 'zoneTitle', '<b>BÁO CÁO XU · HÀNG TỒN CƠ SỞ</b>'));
    sBox.appendChild(el('p', 'scrollHint',
      'Nhập số xu kiểm từng ngày trong tuần · Hàng bán = tổng xu ÷ giá xu'));
    var st = el('div', 'tblWrap');
    st.innerHTML = tableStock(sIdx);
    sBox.appendChild(bungBang(st, 'xu'));
    var addS = el('button', 'btn ghost block', '+ Thêm mã hàng');
    addS.onclick = jpAddStockRow;
    sBox.appendChild(addS);
    wrap.appendChild(sBox);
  }

  /* --- KHO NGOÀI: hàng cơ sở giữ ngoài máy, kiểm kê riêng ---
     Andy chốt 04/08/2026: gửi nhiều thì không nhồi hết vào máy được, phần dư nằm
     trong kho của cơ sở và phải có bảng kiểm kê riêng. Có ở CẢ hai loại báo cáo. */
  var nIdx = [];
  APP.rows.forEach(function (r, ri) { if (r.rowKind === 'NGOAI') nIdx.push(ri); });

  var nBox = el('div', 'zone');
  nBox.appendChild(el('div', 'zoneTitle', '<b>KHO NGOÀI · KIỂM KÊ HÀNG NGOÀI MÁY</b>'));
  nBox.appendChild(el('p', 'scrollHint',
    'Hàng cơ sở đang giữ NGOÀI máy — gửi nhiều thì phần dư nằm đây. ' +
    'Bảng này chỉ kiểm kê chỗ hàng, KHÔNG tính tiền và không sinh giá vốn.'));
  var nt = el('div', 'tblWrap');
  nt.innerHTML = tableNgoai(nIdx);
  nBox.appendChild(bungBang(nt, 'ngoai'));
  var addN = el('button', 'btn ghost block', '+ Thêm mã hàng kho ngoài');
  addN.onclick = jpAddNgoaiRow;
  nBox.appendChild(addN);
  wrap.appendChild(nBox);

  setTimeout(function () {
    renderZonePhotos();
    APP.rows.forEach(function (r, i) { renderRowPhotos(i); });
    applyEditLock();          // bảng vừa vẽ lại thì khoá lại
    jpVeLaiSoTuTinh();        // …và trả mọi ô TỰ TÍNH về số ĐANG GÕ, không phải số đã lưu
  }, 0);
}

/*──────── BẢNG KHO NGOÀI — hàng cơ sở giữ ngoài máy ────────*/
function tableNgoai(idx) {
  var h = '<table class="form">' +
    '<tr>' +
      thVT('Tên hàng', 'NV', '', 'lbl w170') + thVT('Mã Misa', 'NV', '', 'w110') +
      thVT('Tồn đầu kỳ', 'KY', '', 'w90') + thVT('Nhập thêm<br>trong kỳ', 'NV', '', 'w90') +
      thVT('Cấp ra máy', 'NV', '', 'w90') + thVT('Trả về<br>kho tổng', 'NV', '', 'w90') +
      thVT('Còn lại<br>(tính)', 'TU', '', 'w90') + thVT('Đếm<br>thực tế', 'NV', '', 'w90') +
      thVT('Lệch', 'TU', '', 'w90') + thVT('Ghi chú', 'NV', '', 'w170') +
      '<th></th>' +
    '</tr>';

  idx.forEach(function (ri) {
    var r = APP.rows[ri];
    var w = (r.warns && r.warns.length) ? ' class="warnRow"' : '';
    var con = num(r.stockLeftCalc);
    var lech = (r.stockActual === '' || r.stockActual === null || r.stockActual === undefined)
      ? '' : (num(r.stockActual) - con);
    h += '<tr' + w + '>' +
      '<td class="lbl w170">' + itemNhap(tenDeHien(r), ri) + '</td>' +
      /* Ma Misa GO DUOC: gia suy tu tien to ma Misa, ma moi / mua ngoai khong co
         trong danh muc thi khong co duong nao khac de bao gia. */
      '<td class="w110"><input type="text" value="' + esc(r.itemMisa) +
        '" placeholder="100JP023"' +
        ' oninput="jpRowSet(' + ri + ',\'itemMisa\',this.value);jpTinhDong(' + ri + ')"></td>' +
      cell(r.stockOpen, 'stockOpen', ri, r.carried) +
      cell(r.addQty1, 'addQty1', ri) +
      cell(r.stockOut, 'stockOut', ri) +
      cell(r.returnQty, 'returnQty', ri) +
      '<td class="calc w90" id="con' + ri + '"><b>' + con + '</b></td>' +
      cell(r.stockActual, 'stockActual', ri) +
      '<td class="calc w90" id="lech' + ri + '">' + (lech === '' ? '<span class="sub">—</span>'
        : '<b style="color:' + (lech === 0 ? 'inherit' : lech > 0 ? '#047857' : '#b91c1c') +
          '">' + (lech > 0 ? '+' : '') + lech + '</b>') + '</td>' +
      '<td class="w170"><input type="text" style="text-align:left" value="' + esc(r.note) +
        '" oninput="jpRowSet(' + ri + ',\'note\',this.value)"></td>' +
      '<td class="act"><button class="miniBtn danger" onclick="jpDelRow(' + ri + ')">×</button></td>' +
    '</tr>';
  });

  if (idx.length) {
    /* 11 cot: ten · Misa · ton dau · nhap them · cap ra may · tra kho tong
       · con lai · dem thuc te · lech · ghi chu · nut */
    h += jpHangTong('tgNg', idx, [
      { nhan: 'TỔNG ' + idx.length + ' mã' }, null,
      { k: 'stockOpen' }, { k: 'addQty1' }, { k: 'stockOut' }, { k: 'returnQty' },
      { k: 'con', xt: true }, { k: 'stockActual' }, null, null, null
    ]);
  } else {
    h += '<tr><td colspan="11" style="color:#6b7280;padding:14px">' +
         'Cơ sở không giữ hàng ngoài máy thì để trống bảng này.</td></tr>';
  }
  return h + '</table>' + chuGiaiBang(
    '<b>Còn lại</b> = Tồn đầu + Nhập thêm − Cấp ra máy − Trả về kho tổng. ' +
    '<b>Cấp ra máy</b> là số đã nhồi vào máy — số đó nằm trong cột "Ban đầu" của ô máy ' +
    'rồi, nên ở đây <b>không tính là bán</b>.<br>' +
    'Gõ <b>Đếm thực tế</b> lệch với <b>Còn lại</b> thì hệ thống cảnh báo chứ không chặn — ' +
    'đó chính là chỗ cần soát.');
}

/*──────── VAI TRÒ CỦA CỘT ────────
 * Andy 04/08/2026: "cột hàng báo cáo nhân viên còn lộn xộn chưa đúng chức năng
 * hay nhân viên sẽ điền hay gán ảnh". Bốn vai trò, ghi thẳng lên đầu cột:
 *   NV  — nhân viên gõ vào
 *   TỰ  — server tính, gõ không được (và cũng không nên tin số client tính)
 *   KỲ  — chuyển từ kỳ trước, khoá lại vì đó là số cuối kỳ trước
 *   ẢNH — chỗ gắn ảnh, không gõ
 * Đây chỉ là NHÃN. Chốt thật vẫn ở server (`jpCalcRow_`) và ở `applyEditLock`.  */
var VAI_TRO = { NV: 'NHÂN VIÊN', TU: 'TỰ TÍNH', KY: 'KỲ TRƯỚC', ANH: 'GẮN ẢNH' };

/**
 * Một ô đầu cột có nhãn vai trò. r = 'NV' | 'TU' | 'KY' | 'ANH' | ''
 * `themCls` gộp vào CÙNG một attribute class — hai attribute class trên một thẻ
 * thì browser lấy cái đầu và bỏ cái sau, mất luôn màu vai trò.
 */
function thVT(label, r, attr, themCls) {
  var cls = [];
  if (themCls) cls.push(themCls);
  if (r) cls.push('r' + r);
  var tag = r ? '<span class="rl">' + VAI_TRO[r] + '</span>' : '';
  return '<th' + (cls.length ? ' class="' + cls.join(' ') + '"' : '') +
         (attr || '') + '>' + label + tag + '</th>';
}

/** Chú giải dưới bảng — nói lại đúng bốn vai trò bằng tiếng người. */
function chuGiaiBang(themGi) {
  return '<div class="chuGiai">' +
    '<span class="cgNV"><b>NHÂN VIÊN</b> — ô bạn tự gõ</span>' +
    '<span class="cgTU"><b>TỰ TÍNH</b> — hệ thống tính, không gõ được</span>' +
    '<span class="cgKY"><b>KỲ TRƯỚC</b> — tự chuyển từ số cuối kỳ trước rồi khoá; ' +
      'riêng kỳ đầu tiên của cơ sở thì gõ tay</span>' +
    '<span class="cgANH"><b>GẮN ẢNH</b> — bấm vào ô để chụp / chọn ảnh</span>' +
    (themGi ? '<span>' + themGi + '</span>' : '') +
    '</div>';
}

/*
 * Hiện cột "Bổ sung hàng 1/2" và "Trả về kho" hay không.
 *
 * Form giấy máy tiền KHÔNG có ba cột này — bổ sung ghi bằng CHỮ ở cột "Note (Topup
 * hàng)" ("dư 20k", "4 mẫu"). Bỏ hẳn thì mất khả năng ghi số lượng, nên để sau một
 * nút bật/tắt, MẶC ĐỊNH TẮT cho khớp form giấy.
 * Công thức ở máy chủ vẫn tính đủ cả ba — tắt chỉ là không hiện ô nhập.
 */
var JP_COT_THEM = false;
function jpToggleCotThem() {
  JP_COT_THEM = !JP_COT_THEM;
  renderZones();
}

/*════════ MẪU TÁCH — hai bảng riêng + bảng tổng có chênh lệch ════════
 * Andy chốt 04/08/2026, riêng JP Sân bay Phú Quốc: *"tách tiền và hàng riêng trong
 * 1 bảng tổng và có phần chênh lệch tiền giữa 2 phần này để nhìn so sánh"*.
 *
 * Mẫu chung nhồi tiền + hàng vào cùng một dòng nên hàng bị khoá vào đúng một ô máy.
 * SBPQ có 54 mã hàng, số ô máy ít hơn nhiều ⇒ không gắn 1-1 được.
 *
 *   Bảng TIỀN  (dòng `MAY`)  — theo ô máy, trong khu vực, chỉ đồng hồ tiền
 *   Bảng HÀNG  (dòng `HANG`) — theo mã hàng, một bảng cho cả cơ sở
 *   Bảng TỔNG                — hai con số cạnh nhau + CHÊNH LỆCH
 *
 * ⚠️ Số ở bảng tổng do **máy chủ** tính (`revMeter` / `revHang` / `lechTienHang`),
 * client chỉ in ra. Tính lại ở client là hai công thức, và lúc lệch nhau thì nhân
 * viên thấy một số mà kế toán thấy số khác.
 */

/*──────── MẪU TÁCH · BẢNG TIỀN — NHÂN VIÊN TỰ ĐIỀN HẾT ────────
 *
 * Andy chốt 12/08/2026: *"riêng báo cáo sân bay phú quốc em thay đổi cho anh chỉ cần
 * cột mã hàng mã misa thành tiền rồi 3 cột là tiền mặt app - qr - tiền mặt thực tế —
 * còn hàng thì vẫn vậy"*, *"cái này sẽ là nhân viên tự điền hết"*, và *"tiền thực thu
 * mới chính là tiền thu được, thêm cột lệch cho tôi nhé"*.
 *
 * ⚠️ **Bỏ hết phần đồng hồ** (Before · After · Actual · COLLECTION) và bỏ cả cột ô
 * máy: SBPQ đọc số từ APP của máy, không có công-tơ-mét để trừ. Nên `Thành tiền` ở
 * đây là ô GÕ, không còn là ô tự tính — đúng chỗ khác hẳn mọi bảng khác của app.
 *
 * ⚠️ Cột đầu in **TÊN HÀNG**, không in mã. Đó là chính điều Andy chốt 07/08/2026
 * (*"mã hàng hiển thị tên không phải chọn xong ra mã misa"*): mã `150JP065` thì
 * nhân viên đứng ở máy không biết là hàng gì. Mã Misa nằm ở cột ngay bên cạnh, và
 * nó là mã kế toán khớp sổ MISA.
 *
 * ⚠️ Cột **Lệch = Tiền mặt THỰC TẾ − Tiền mặt APP**, không trừ vào `Thành tiền`:
 * `Thành tiền` đã gộp QR nên trừ vào nó là ra lệch giả đúng bằng QR. Xem `jpLechTM_`
 * (00_Config) — nguồn duy nhất của phép trừ này, ba chỗ dùng chung.
 *
 * ⚠️ Ô **Ảnh giữ lại** dù Andy chỉ kể sáu cột dữ liệu: số ở bảng này giờ do người gõ
 * hết, nên ảnh màn hình app là bằng chứng DUY NHẤT để kế toán soi lại. Nhưng
 * `jpCheckPhotos_` **không đòi** nó (một ảnh app thường thấy hết các mã).
 */
function tableMayTien(idx) {
  var h = '<table class="form">' +
    '<tr>' +
      thVT('Tên hàng', 'NV', '', 'lbl w210') +
      thVT('Mã Misa', 'NV', '', 'w110') +
      /* ⚠️ Nhãn phải nói ra QUAN HỆ giữa ba cột, không chỉ gọi tên chúng. Andy xác nhận
         29/08/2026: app của máy hiện "Thành tiền" ĐÃ GỒM cả tiền mặt lẫn QR. Nhãn cũ chỉ
         ghi "Thành tiền" nên nhân viên SBPQ điền số TIỀN MẶT vào đó rồi ghi QR ra riêng —
         đo trên sheet 24/08: 9/14 dòng có Thành tiền == Tiền mặt app, và tổng QR
         (9,5tr) LỚN HƠN tổng Thành tiền (5,92tr), làm tiền phải nộp ra ÂM 1,52tr. */
      thVT('Thành tiền<br><small>= tiền mặt + QR</small>', 'NV', '', 'w140') +
      thVT('Tiền mặt<br>APP báo', 'NV', '', 'w140') +
      thVT('QR<br><small>đã nằm trong Thành tiền</small>', 'NV', '', 'w140') +
      thVT('Tiền mặt<br>THỰC TẾ đếm được', 'NV', '', 'w140') +
      thVT('Lệch<br>(thực tế − app)', 'TU', '', 'w140') +
      thVT('Ảnh màn hình app', 'ANH', '', 'w110') +
      thVT('Ghi chú / lý do lệch', 'NV', '', 'w170') +
      '<th></th>' +
    '</tr>';

  idx.forEach(function (ri) {
    var r = APP.rows[ri];
    var w = (r.warns && r.warns.length) ? ' class="warnRow"' : '';
    var o = jpXemTruoc(r);
    var khoaTien = !o.goTay;
    h += '<tr' + w + '>' +
      '<td class="lbl w210">' + itemNhap(tenDeHien(r), ri) + '</td>' +
      /* Mã Misa GÕ ĐƯỢC — y như ba bảng kia. Khoá nó thì mã mới / hàng mua ngoài
         vĩnh viễn không có mã Misa, mà đó là số kế toán dùng để khớp sổ MISA. */
      '<td class="w110"><input type="text" value="' + esc(r.itemMisa) +
        '" placeholder="100JP023"' +
        ' oninput="jpRowSet(' + ri + ',\'itemMisa\',this.value)"' +
        ' onchange="jpPickItemMisa(' + ri + ',this.value)"></td>' +
      /* Dòng đời cũ CÒN đồng hồ thì tiền vẫn do máy chủ suy ra (`jpMayGoTay_` false)
         ⇒ **khoá bốn ô lại**. Để gõ được là gõ xong lưu là số bị ghi đè về số suy từ
         đồng hồ, im lặng — đúng bẫy "hai con số cãi nhau" đã mắc nhiều lần.
         ⚠️⚠️ Câu cũ ở đây ghi *"không có dòng nào như vậy trong dữ liệu thật (0 dòng
         MAY)"* — **nay SAI**, và chính giả định đó làm cái khoá này trông vô hại. Thực
         tế `jpAddRow` bản cũ tạo ô máy với `mBefore: 0`, nên tới 20/08/2026 sheet có
         hàng loạt dòng MAY mang số 0 ⇒ chúng bị khoá cả bốn ô, trong khi máy chủ lại
         đang ĐÒI điền đúng mấy ô đó. Chốt phân biệt là `mBefore > 0`, không phải
         ô-trống — xem `jpMayGoTay` bên dưới. */
      oTien(r.amount, 'amount', ri, khoaTien) +
      oTien(r.cash, 'cash', ri, khoaTien) +
      oTien(r.bank, 'bank', ri, khoaTien) +
      oTien(r.cashReal, 'cashReal', ri, khoaTien) +
      '<td class="calc w140' + (num(o.lechTM) !== 0 ? ' lech' : '') +
        '" id="ltm' + ri + '">' + jpChuLechTM(o.lechTM) + '</td>' +
      '<td class="w110"><div class="photoCell" id="ps_' + ri + '"></div></td>' +
      '<td class="w170"><input type="text" style="text-align:left" value="' + esc(r.note) +
        '" oninput="jpRowSet(' + ri + ',\'note\',this.value)"></td>' +
      '<td class="act"><button class="miniBtn danger" onclick="jpDelRow(' + ri + ')">×</button></td>' +
    '</tr>';
  });

  if (idx.length) {
    /* 10 cot: ten hang · Ma Misa · thanh tien · tien mat app · QR
       · tien mat thuc te · lech · anh · ghi chu · nut
       ⚠️ Mang nay phai KHOP TUNG PHAN TU voi hang tieu de o tren — lech mot o la
       moi con so nam duoi nhan sai ma van in ra binh thuong. */
    h += jpHangTong('tgMt', idx, [
      { nhan: 'TỔNG ' + idx.length + ' dòng' }, null,
      { k: 'amount', tien: true }, { k: 'cash', tien: true },
      { k: 'bank', tien: true }, { k: 'cashReal', tien: true },
      { k: 'lechTM', xt: true, tien: true }, null, null, null
    ]);
  } else {
    h += '<tr><td colspan="10" style="color:#6b7280;padding:14px">' +
         'Chưa có dòng nào — bấm "Thêm ô / máy"</td></tr>';
  }
  return h + '</table>' + chuGiaiBang(
    '<b>Bảng này CHỈ có tiền</b>, và số lấy từ <b>APP của máy</b> — bạn gõ vào hết. ' +
    'Hàng nằm ở bảng riêng bên dưới, theo mã hàng. ' +
    '<b>Thành tiền</b> phải bằng <b>Tiền mặt app + QR</b>; ' +
    '<b>Lệch</b> = tiền mặt bạn đếm được − tiền mặt app báo, và ' +
    '<b>tiền mặt THỰC TẾ mới là số phải nộp về</b>.');
}

/** Ô nhập TIỀN — rộng hơn ô số lượng vì một số tiền là 7 chữ số. */
function oTien(val, key, ri, khoa) {
  return '<td class="w140"><input type="number" inputmode="numeric" value="' +
    (jpTrongO(val) ? '' : num(val)) + '"' +
    (khoa ? ' readonly title="Dòng này còn chỉ số đồng hồ nên tiền do hệ thống suy ra' +
            ' từ đồng hồ — gõ vào sẽ bị ghi đè khi lưu"' : '') +
    ' oninput="jpRowSet(' + ri + ',\'' + key + '\',this.value)"></td>';
}

/**
 * Chuỗi in ra ở ô LỆCH — **một chỗ dựng duy nhất**, dùng cả lúc vẽ bảng và lúc gõ.
 *
 * Viết lại rời ở `jpTinhDong` là hai cách in cho cùng một con số: sửa màu ở một chỗ
 * quên chỗ kia, rồi ô lệch đổi màu tuỳ vào việc vừa gõ hay vừa vẽ lại bảng.
 *
 * ⚠️ Ô trống in `—`, KHÔNG in `0`: chưa đếm khác với đếm được đúng bằng app.
 */
function jpChuLechTM(v) {
  if (jpTrongO(v)) return '<span class="sub">—</span>';
  var n = num(v);
  return '<b style="color:' +
    (n === 0 ? 'inherit' : n > 0 ? '#047857' : '#b91c1c') + '">' +
    (n > 0 ? '+' : '') + money(n) + 'đ</b>';
}

/*──────── MẪU TÁCH · BẢNG HÀNG — theo mã hàng, đã bán SUY từ số đếm ────────*/
function tableHang(idx) {
  var h = '<table class="form">' +
    '<tr>' +
      thVT('Tên hàng', 'NV', '', 'lbl w170') + thVT('Mã Misa', 'NV', '', 'w110') +
      thVT('Giá<br>/trứng', 'TU', '', 'w110') +
      thVT('Tồn đầu kỳ', 'KY', '', 'w90') +
      thVT('Nhập thêm<br>trong kỳ', 'NV', '', 'w90') +
      thVT('Trả về<br>kho tổng', 'NV', '', 'w90') +
      thVT('Lỗi / xé mẫu', 'NV', '', 'w90') +
      thVT('ĐÃ BÁN', 'NV', '', 'w90') +
      thVT('Tồn cuối kỳ<br>(tính)', 'TU', '', 'w100') +
      thVT('Đếm thực tế<br>(không bắt buộc)', 'NV', '', 'w110') +
      thVT('Lệch', 'TU', '', 'w80') +
      thVT('Tiền theo hàng', 'TU', '', 'w120') +
      thVT('Hoàn khách<br>(tiền)', 'NV', '', 'w110') +
      thVT('= mấy quả', 'TU', '', 'w80') +
      thVT('Lý do hoàn', 'NV', '', 'w150') +
      thVT('Ghi chú', 'NV', '', 'w170') +
      '<th></th>' +
    '</tr>';

  idx.forEach(function (ri) {
    var r = APP.rows[ri];
    var w = (r.warns && r.warns.length) ? ' class="warnRow"' : '';
    /* Giá suy từ MÃ MISA trước (Andy chốt 05/08: "tiền tính từ ô misa") */
    var gia = num(r.price) || giaTuMa(r.itemMisa) || giaTuMa(r.itemCode);
    var ban = num(r.soldQty);
    /* Tồn cuối là số TÍNH RA — cùng công thức máy chủ, đừng viết khác */
    var cuoi = num(r.stockOpen) + num(r.addQty1) + num(r.addQty2)
               - num(r.returnQty) - num(r.defectQty) - ban;
    var coDem = !(r.stockActual === '' || r.stockActual === null ||
                  r.stockActual === undefined);
    var lechDem = coDem ? (num(r.stockActual) - cuoi) : 0;
    h += '<tr' + w + '>' +
      '<td class="lbl w170"><input type="text" style="text-align:left" value="' +
        esc(r.itemName) + '" placeholder="tên hàng"' +
        ' oninput="jpRowSet(' + ri + ',\'itemName\',this.value)"></td>' +
      '<td class="w110"><input type="text" value="' + esc(r.itemMisa) +
        '" placeholder="100JP023"' +
        ' oninput="jpRowSet(' + ri + ',\'itemMisa\',this.value);jpUpdateGia(' + ri + ')"' +
        ' onchange="jpPickItemMisa(' + ri + ',this.value)"></td>' +
      '<td class="calc w110" id="gia' + ri + '">' + (gia ? money(gia) : '—') + '</td>' +
      cell(r.stockOpen, 'stockOpen', ri, r.carried) +
      cell(r.addQty1, 'addQty1', ri) +
      cell(r.returnQty, 'returnQty', ri) +
      cell(r.defectQty, 'defectQty', ri) +
      cell(r.soldQty, 'soldQty', ri) +
      '<td class="calc w100" id="con' + ri + '"><b>' + cuoi + '</b></td>' +
      cell(r.stockActual, 'stockActual', ri) +
      '<td class="calc w80' + (coDem && lechDem !== 0 ? ' lech' : '') +
        '" id="lech' + ri + '">' +
        (coDem ? (lechDem > 0 ? '+' + lechDem : lechDem) : '—') + '</td>' +
      '<td class="calc w120" id="tien' + ri + '"><b>' + money(ban * gia) + '</b></td>' +
      cell(r.refundAmt, 'refundAmt', ri) +
      '<td class="calc w80" id="qua' + ri + '">' + (num(r.refundAmt) && gia
          ? Math.floor(num(r.refundAmt) / gia) : 0) + '</td>' +
      '<td class="w150"><input type="text" style="text-align:left" value="' +
        esc(r.refundRowNote) + '" oninput="jpRowSet(' + ri + ',\'refundRowNote\',this.value)"></td>' +
      '<td class="w170"><input type="text" style="text-align:left" value="' + esc(r.note) +
        '" oninput="jpRowSet(' + ri + ',\'note\',this.value)"></td>' +
      '<td class="act"><button class="miniBtn danger" onclick="jpDelRow(' + ri + ')">×</button></td>' +
    '</tr>';
  });

  if (idx.length) {
    /* 17 cot: ten · Misa · gia · ton dau · nhap them · tra kho · loi · da ban
       · ton cuoi · dem thuc te · lech · thanh tien · hoan khach · quy ra qua
       · ly do hoan · ghi chu · nut */
    h += jpHangTong('tgHg', idx, [
      { nhan: 'TỔNG ' + idx.length + ' mã' }, null, null,
      { k: 'stockOpen' }, { k: 'addQty1' }, { k: 'returnQty' }, { k: 'defectQty' },
      { k: 'soldQty' }, { k: 'con', xt: true }, { k: 'stockActual' }, null,
      { k: 'tien', xt: true, tien: true }, { k: 'refundAmt', tien: true },
      { k: 'qua', xt: true }, null, null, null
    ]);
  }
  if (!idx.length) {
    h += '<tr><td colspan="17" style="color:#6b7280;padding:14px">' +
         'Chưa có mã hàng nào — bấm "Thêm mã hàng"</td></tr>';
  }
  return h + '</table>' + chuGiaiBang(
    '<b>Tồn cuối = Tồn đầu + Nhập thêm − Trả kho − Lỗi − ĐÃ BÁN.</b> ' +
    'Nhân viên gõ <b>ĐÃ BÁN</b>, web tự tính tồn cuối.<br>' +
    '<b>Giá lấy từ ô Mã Misa</b> (100JP023 → 100.000đ), không lấy từ tên hàng.<br>' +
    '<b>Đếm thực tế</b> để trống được — gõ vào thì web so với tồn cuối tính ra và ' +
    'in cột <b>Lệch</b>, đó là chỗ bắt được đếm sai hoặc mất hàng.<br>' +
    '⚠️ <b>Ô ĐÃ BÁN để trống là CHƯA KHAI</b>, không phải bán được 0 — và ' +
    '<b>không nộp được</b> khi còn ô trống, vì tồn cuối kỳ này là tồn đầu kỳ sau.');
}

       CÒN TỒN TẠI ngay cạnh con số — nặng hơn nhãn sai, vì nó dạy người đọc cách kiểm

    '<tr><td class="lbl"><b id="btNhan1">① TIỀN</b></td>' +

    '<tr><td class="lbl"><b>④ HÀNG</b> — theo số đếm được</td>' +
      '<td>Σ (Đã bán × Giá) của mọi mã hàng</td>' +
      '<td class="calc"><b id="btHang">0đ</b></td></tr>' +
    '<tr id="btRowLech"><td class="lbl"><b>CHÊNH LỆCH</b> ③ − ④</td>' +
      '<td id="btYNghia">—</td>' +
      '<td class="calc"><b id="btLech">0đ</b></td></tr>' +
    '</table>' +
    '<div class="chuGiai"><span>' +
      '<b>Hai đường ĐỘC LẬP</b>: <span id="btNguon">tiền đi từ đồng hồ máy</span>, ' +
      'hàng đi từ kiểm đếm thực tế. ' +
      'Nên số lệch ở đây là số lệch <b>thật</b>, không phải lỗi cộng trừ.<br>' +
      '<b>Dương</b> = tiền thu nhiều hơn hàng ra ⇒ <b>thiếu hàng</b> (hoặc đếm sai). ' +
      '<b>Âm</b> = hàng ra nhiều hơn tiền thu ⇒ <b>thiếu tiền</b>.<br>' +

/** In số vào bảng tổng. Số do MÁY CHỦ tính, đây chỉ hiển thị. */
function paintBangTong(t) {
  if (!$('btTien')) return;                     // báo cáo mẫu chung, không có bảng này
  var lech = num(t.lechTienHang);
  var hoan = num(t.refundTotal);
  /*
   * ⚠️ Nói đúng NGUỒN của con số ①. Mẫu TÁCH sau 12/08/2026: tiền là số nhân viên đọc
   * từ APP của máy, không còn `Actual × 5.000đ` nào. Web in một công thức không còn
   * dùng là dạy người đọc kiểm tra bằng phép tính sai — cùng bệnh màn Tổng quan kho
   * dạy `Nợ 641` sau khi đầu tài khoản đã đổi.
   *
   * ⚠️ Phép so tiền-vs-hàng VẪN là hai đường độc lập (app vs kiểm đếm), nên không hạ
   * cấp câu "Hai đường ĐỘC LẬP" — chỉ đổi tên đường thứ nhất.
   */
  var goTay = APP.rows.some(function (r) {
    return (r.rowKind || '') === 'MAY' && jpMayGoTay(r);
  });
  $('btNhan1').textContent = goTay ? '① TIỀN — theo APP của máy' : '① TIỀN — theo đồng hồ';
  $('btCach1').textContent = goTay ? 'Σ Thành tiền nhân viên đọc từ APP'
                                   : 'Σ (Actual × 5.000đ) của mọi ô máy';
  $('btCach3').textContent = goTay ? 'tiền APP đã trừ phần trả lại khách'
                                   : 'tiền đồng hồ đã trừ phần trả lại khách';
  if ($('btNguon')) {
    $('btNguon').textContent = goTay ? 'tiền đi từ APP của máy' : 'tiền đi từ đồng hồ máy';
  }
  $('btTien').textContent = money(t.revMeter) + 'đ';
  $('btHoan').textContent = money(hoan) + 'đ';
  $('btRong').textContent = money(num(t.revMeterRong)) + 'đ';
  $('btHang').textContent = money(t.revHang) + 'đ';
  /* Tô nhạt dòng hoàn khi không có hoàn nào — đỡ rối bảng, nhưng KHÔNG ẩn:
     ẩn đi là người đọc không cộng ra được ① − ② = ③. */
  $('btRowHoan').className = hoan ? 'warnRow' : '';
  $('btLech').textContent = money(lech) + 'đ';
  var row = $('btRowLech');
  row.className = lech === 0 ? '' : 'warnRow';
  $('btYNghia').textContent = lech === 0
    ? (goTay ? 'Khớp — tiền APP đúng bằng hàng đếm được'
             : 'Khớp — tiền đồng hồ đúng bằng hàng đếm được')
    : (lech > 0 ? 'THIẾU HÀNG ' + money(Math.abs(lech)) + 'đ — tiền thu nhiều hơn hàng ra'
                : 'THIẾU TIỀN ' + money(Math.abs(lech)) + 'đ — hàng ra nhiều hơn tiền thu');
}

/*──────── BẢNG MÁY TIỀN — đúng form, có cột Giá để soi ngang ────────*/
/**
 * NÚT BUNG cho một bảng (Andy chốt 05/08/2026: *"cuộn ngang nhưng kiểu bung"*).
 *
 * Giữ nguyên cuộn ngang, thêm chế độ BUNG: bảng tràn ra gần hết bề rộng cửa sổ và chữ
 * nhỏ lại một bậc, nên nhìn được hết cột mà không phải kéo qua kéo lại.
 *
 * ⚠️ Nút phải nói ra **còn mấy cột nữa bên phải** khi chưa bung. Chỉ ghi "Bung" thì
 * nhân viên không biết mình đang thiếu gì — mà đó chính là chỗ Andy thấy rối.
 *
 * ⚠️ Trạng thái bung giữ theo TÊN BẢNG trong `JP_BUNG`, không giữ trong DOM: `renderZones`
 * vẽ lại toàn bộ nên state trong DOM mất sạch mỗi lần gõ một ô.
 */
var JP_BUNG = {};

function bungBang(wrap, ten) {
  var box = el('div', 'bungWrap');
  var btn = el('button', 'btn ghost sm bungBtn');
  if (JP_BUNG[ten]) wrap.classList.add('bung');

  function ve() {
    var w = wrap.querySelector('table');
    var con = w ? Math.max(0, w.scrollWidth - wrap.clientWidth) : 0;
    btn.innerHTML = JP_BUNG[ten]
      ? '⤡ Thu lại'
      : (con > 20 ? '⤢ Bung rộng — còn ' + Math.ceil(con / 90) + ' cột bên phải'
                  : '⤢ Bung rộng');
  }
  btn.onclick = function () {
    JP_BUNG[ten] = !JP_BUNG[ten];
    wrap.classList.toggle('bung', !!JP_BUNG[ten]);
    ve();
  };
  box.appendChild(btn);
  box.appendChild(wrap);
  setTimeout(ve, 0);                 // chờ trình duyệt đo xong bề rộng thật
  return box;
}

/*
 * HAI Ô ĐỒNG HỒ ĐẾM TRỨNG CÓ HIỆN KHÔNG — một chỗ trả lời cho cả tiêu đề, thân bảng
 * và dòng tổng. Ba chỗ đó PHẢI cùng câu trả lời, lệch một cột là cả bảng trượt.
 *
 * Cờ tắt là ẩn, **kể cả khi dòng đang có số** (Andy chốt 15/08/2026: *"đổi luôn cả báo
 * cáo đang nhập dở"*).
 *
 * ⚠️ Bản đầu em viết ngược lại — "còn số thì vẫn hiện" — và nó **không bao giờ ẩn được
 * gì** ở đúng cái báo cáo cần ẩn. Cái lo lúc đó là thật: `jpCalcMoneyRow_` suy `Đã bán`
 * từ `hAfter` KHI Ô ĐÓ CÓ GIÁ TRỊ, nên ẩn ô đang có số là để một con số quyết định
 * doanh số mà nhân viên không thấy. Nhưng cách chữa đúng không phải là giữ cột lại —
 * là **NÓI RA** (`jpNhacDhCu`). Ẩn im lặng mới là chỗ sai.
 */
function jpHienDhTrung() {
  return APP.coDhTrung;
}

/**
 * Bảng này có cột "Loại máy" (chọn giá 1 xung) không?
 *
 * ⚠️ Chỉ ẨN giao diện. Máy chủ vẫn ÉP giá xung về mặc định khi cờ tắt — xem
 * `jpChonGiaXung_` (`00_Config`). Web ở `ANYONE_ANONYMOUS` nên ẩn ô mà không chặn ở
 * máy chủ là không chặn gì cả.
 */
function jpHienCotXung() {
  return APP.chonGiaXung === true;
}

/*
 * Dòng nhắc khi cột đã ẩn MÀ SỐ CŨ VẪN CÒN — không thì `Đã bán` của mấy dòng đó suy từ
 * một ô không còn trên màn hình. Trả chuỗi rỗng khi không có gì để nhắc: một khối cảnh
 * báo lúc nào cũng hiện là khối không ai đọc.
 */
function jpNhacDhCu(idx) {
  if (APP.coDhTrung) return '';
  var co = (idx || []).filter(function (ri) {
    var r = APP.rows[ri] || {};
    return jpStr0(r.hBefore) !== '' || jpStr0(r.hAfter) !== '';
  });
  if (!co.length) return '';
  return '<p class="hint"><b>' + co.length + ' dòng còn số đồng hồ đếm trứng cũ</b> — ' +
    'cơ sở này đã khai máy không có đồng hồ nên hai ô đó đã ẩn, nhưng số cũ <b>vẫn đang ' +
    'được dùng để tính “Đã bán”</b> của các dòng đó. Muốn bỏ hẳn thì báo kế toán xoá, ' +
    'hoặc bật lại ô “Máy có đồng hồ đếm trứng” ở Cấu hình → Cơ sở rồi xoá tay.</p>';
}

    '<tr>' +

      '<th class="grp" colspan="3">Hoàn khách</th>' +

      thVT('COLLECTION', 'TU') + thVT('Thành tiền', 'TU') +
      thVT('Thực thu<br><small>đếm được</small>', 'NV', '', 'w120') +

      cell(r.refundAmt, 'refundAmt', ri) +

          ? Math.floor(num(r.refundAmt) / gia) : 0) + '</td>' +

    '</tr>';
  });

  if (idx.length) {
    /* Thu tu PHAI khop than bang, va than bang doi theo `them` — khai cung mot
       mang cho ca hai truong hop la lech cot ngay khi bam "Hien cot bo sung".
       Bo trong: o may · ma hang · ma Misa · gia · Before · After · Note topup
       · ly do hoan · anh · remarks · nut. */
    /* ⚠️ Thêm cột "Loại máy" (29/08/2026) ⇒ phải thêm ĐÚNG MỘT `null` nữa ở đây, và
       cộng 1 vào colspan của dòng rỗng bên dưới. Thiếu là cả dòng TỔNG lệch một cột —
       `khoa-cot.js` bắt được ngay, và đó đúng là việc của nó. */
    var cotT = [
      { nhan: 'TỔNG ' + idx.length + ' ô máy' }, null, null, null, null, null
    ];
    if (gx) cotT.push(null);
    cotT = cotT.concat([
      { k: 'actual', xt: true }, { k: 'collection', xt: true },
      { k: 'tien', xt: true, tien: true },
      { k: 'cashReal', tien: true }, { k: 'lechTM', xt: true, tien: true },
      { k: 'hOpen' }
    ]);
    /* Thu tu PHAI y het than bang: hOpen -> [hBefore, hAfter] -> [addQty]. */
    if (dh) cotT.push({ k: 'hBefore' }, { k: 'hAfter' });
    if (them) cotT.push({ k: 'addQty1' }, { k: 'addQty2' });
    /* `soldQty` / `hLeft` doc THANG truong may chu — dung y het o than bang
       ngay tren no. Lay qua `jpXemTruoc` thi dong tong song con cot tren dung
       im, hai so cai nhau tren cung mot man. */
    cotT.push({ k: 'soldQty' }, { k: 'hLeft' });
    if (them) cotT.push({ k: 'returnQty' });
    cotT.push({ k: 'stockOut' }, null, { k: 'stockActual' },
              { k: 'refundAmt', tien: true }, { k: 'qua', xt: true },
              null, null, null, null);
    h += jpHangTong('tgTi', idx, cotT);
  } else {
    /* ⚠️ colspan cua dong rong cung phai tru 2 — de nguyen la o "Chua co o nao" thoi
       ra ngoai bang khi cot bi an. Cung ho bay colspan da mac o nhom "Product". */
    h += '<tr><td colspan="' + ((them ? 28 : 25) - (dh ? 0 : 2) + (gx ? 1 : 0)) +
         '" style="color:#6b7280;padding:14px">' +
         'Chưa có ô nào — bấm "Thêm ô / máy"</td></tr>';
  }
  return h + '</table>' + jpNhacDhCu(idx) + chuGiaiBang(
    'Đúng bố cục form giấy <b>SUMMARY STATION SALES AND CASH REPORT</b>. ' +
    '<b>COLLECTION</b> = Actual ÷ 2 (đơn vị 10.000đ) · <b>Thành tiền</b> = Actual × 5.000đ. ' +
    /* ⚠️ Cau chu giai phai doi theo. May khong co dong ho ma van day "lay theo dong ho
       dem trung" la web day sai cach ra so — cung loi voi "Σ (Chenh dong ho × 5.000d)"
       cua mau TACH da phai bo. */
    (dh ? '<b>Đã bán trong ngày</b> lấy theo đồng hồ đếm trứng (After − Before), không suy từ tiền. '
        : '<b>Đã bán trong ngày</b> suy từ <b>Thành tiền ÷ Giá/trứng</b> — cơ sở này đã khai ' +
          'máy <b>không có đồng hồ đếm trứng</b>. ') +
    '<b>Còn lại</b> = Ban đầu − Đã bán' + (them ? ' + Bổ sung − Trả về kho' : '') + '.' +
    (them ? '' : '<br>Muốn ghi <b>bổ sung hàng</b> / <b>trả về kho</b> bằng SỐ LƯỢNG thì bấm ' +
      '<b>"Hiện cột bổ sung / trả kho"</b> — form giấy chỉ ghi bằng chữ ở cột Note.'));
}

/**
 * Giá 1 trứng suy từ tiền tố MÃ HÀNG: 50JP=50k · 100JP=100k · 150JP=150k · 200JP=200k
 * Phải suy từ `itemCode` đúng như server (`jpGiaTuMa_`) — trước đây client suy từ
 * `itemMisa` nên hai mã khác tiền tố thì nhân viên thấy một giá, hệ thống tính giá khác.
 */
function giaTuMa(ma) {
  var m2 = String(ma || '').trim().match(/^(\d+)\s*JP/i);
  if (!m2) return 0;
  var k = parseInt(m2[1], 10);
  return (k > 0 && k <= 1000) ? k * 1000 : 0;
}

/*
 * Tỷ giá lấy từ `boot.rates` của MÁY CHỦ, không gõ số cứng ở client.
 * Cùng loại bẫy với `giaTuMa`: gõ cứng ở đây thì đổi quy tắc tính tiền bên server là
 * nhân viên thấy một số, hệ thống tính số khác — mà không ai biết.
 */
function giaXuMot()    { return num((APP.boot && APP.boot.rates || {}).coin) || 50000; }
function giaMoneyMot() { return num((APP.boot && APP.boot.rates || {}).coinMoney) || 10000; }
/**
 * Tiền một XUNG đồng hồ máy tiền — MỘT chỗ hỏi, y như hai hàm trên.
 *
 * ⚠️ Trước 20/08/2026 con số `5000` viết CỨNG ở **hai** chỗ trong `jpXemTruoc`, trong khi
 * máy chủ đã gửi sẵn `rates.moneyPulse` (`03_CauHinh`) mà client không dùng. Đổi tỷ lệ ở
 * `JP_RATE_MONEY_PULSE` thì màn xem trước **im lặng giữ số cũ**: nhân viên thấy một số,
 * lưu xong ra số khác — đúng bệnh "hai con số cãi nhau" mà bản sao `jpMayGoTay_` vừa gây
 * ra ba lần. Tìm ra khi soát cả nhóm bản sao, không phải vì có ai báo lỗi.
 */
function giaXungMot()  { return num((APP.boot && APP.boot.rates || {}).moneyPulse) || 5000; }

/**
 * Giá 1 xung của DÒNG này — lấy theo KHU nó đang nằm. Bản client của `jpGiaXung_`.
 *
 * ⚠️ KHÔNG dùng `giaXungMot()` ở nhánh tính tiền nữa: hàm đó trả hằng số chung của cả
 * hệ thống, mà từ 29/08/2026 giá xung là **của từng khu** (SUNWORLD PQ có hai loại máy
 * tiền tách theo khu). Dùng nhầm là màn hình in một số, máy chủ ghi một số khác —
 * và nhân viên tin số trên màn hình.
 */
function giaXungDong(r) {
  return Number(r && r.giaXung) === 10000 ? 10000 : 5000;
}

/*════════════════════ DÒNG TỔNG CUỐI BẢNG ════════════════════
 *
 * Andy 07/08/2026: *"bảng cần có tổng phía dưới mỗi cột"*.
 *
 * Khai báo theo CỘT, đúng thứ tự các `<td>` của thân bảng — lệch một ô là số
 * cộng nằm dưới nhầm cột, mà vẫn trông như một con số thật.
 *   null              → ô trống (cột chữ, cột đơn giá — cộng vào là vô nghĩa)
 *   { k: 'stockOpen' }→ cộng thẳng trường đó trên dòng
 *   { k, xt: true }   → cộng trường của `jpXemTruoc(r)` — mấy cột TỰ TÍNH
 *   { tien: true }    → in ra dạng tiền
 *
 * ⚠️ Cột TỰ TÍNH phải lấy qua `jpXemTruoc`, KHÔNG đọc `r.soldQty` sẵn có: mấy
 * trường đó do máy chủ ghi nên trước lượt lưu chúng còn là số CŨ. Đọc chúng thì
 * dòng tổng đứng im trong khi ô ngay trên nó đã đổi — người dùng thấy hai số
 * cãi nhau trên cùng một màn.
 */
var JP_TONG = [];       // các bảng đang hiện, để vá lại khi gõ

function jpHangTong(pre, idx, cot) {
  JP_TONG.push({ pre: pre, idx: idx, cot: cot });
  var t = jpCongCot(idx, cot);
  return '<tr class="tongRow">' + cot.map(function (c, i) {
    if (!c) return '<td></td>';
    if (c.nhan) return '<td class="lbl"><b>' + c.nhan + '</b></td>';
    return '<td class="' + (c.cls || 'calc') + '" id="' + pre + i + '"><b>' +
           jpSoTong(t[i], c) + '</b></td>';
  }).join('') + '</tr>';
}

function jpCongCot(idx, cot) {
  var t = cot.map(function () { return null; });
  idx.forEach(function (ri) {
    var r = APP.rows[ri];
    if (!r) return;
    var xt = null;
    cot.forEach(function (c, i) {
      if (!c || c.nhan) return;
      var v;
      if (c.xt) { if (!xt) xt = jpXemTruoc(r) || {}; v = xt[c.k]; }
      else if (c.ngay !== undefined) { v = (r.xuDays || [])[c.ngay]; }
      else v = r[c.k];
      if (v === '' || v === null || v === undefined) return;
      t[i] = (t[i] || 0) + num(v);
    });
  });
  return t;
}

function jpSoTong(v, c) {
  if (v === null) return '';
  return c.tien ? money(v) : v;
}

/** Vá lại mọi dòng tổng đang hiện — gọi sau mỗi lần gõ, không vẽ lại bảng. */
function jpCapNhatTong() {
  JP_TONG.forEach(function (b) {
    var t = jpCongCot(b.idx, b.cot);
    b.cot.forEach(function (c, i) {
      if (!c || c.nhan) return;
      var o = $(b.pre + i);
      if (o) o.innerHTML = '<b>' + jpSoTong(t[i], c) + '</b>';
    });
  });
}

/** Nhập số xu kiểm của 1 ngày. */
function jpXuDay(ri, di, val) {
  var r = APP.rows[ri];
  if (!r.xuDays) r.xuDays = [];
  r.xuDays[di] = val;
  jpDirty();
  jpTinhDong(ri);                 // tổng xu · hàng bán · hàng còn hiện ngay
}

/*──────── Ô nhập trong bảng ────────*/
function cell(val, key, ri, carried, rowspan) {
  var CARRIED_KEYS = ['mBefore', 'cBefore', 'hBefore', 'hOpen', 'stockOpen'];
  var lock = (carried && CARRIED_KEYS.indexOf(key) >= 0);

  /* Ô TỒN ĐẦU mở lại được ĐẦU THÁNG MỚI (Andy chốt 05/08/2026). Cờ do MÁY CHỦ quyết
     (`jpMoTonDau_`), client chỉ đọc — đừng tự suy theo ngày ở đây, hai chỗ tự suy là
     hai luật rồi lệch nhau. Còn khoá thì có nút gửi đề nghị kế toán. */
  var laTonDau = (key === 'stockOpen' || key === 'hOpen');
  if (lock && laTonDau && APP.report && APP.report.moTonDau) lock = false;

  var rs = rowspan ? ' rowspan="' + rowspan + '"' : '';
  var nut = (lock && laTonDau)
    ? '<button class="miniBtn dnBtn" title="Gửi đề nghị kế toán sửa tồn đầu"' +
      ' onclick="jpXinSuaTonDau(' + ri + ')">✎</button>'
    : '';
  return '<td class="w90"' + rs + '><input type="number" inputmode="numeric" value="' +
    (val === '' ? '' : num(val)) + '"' +
    (lock ? ' readonly title="Tồn cuối kỳ trước — sửa được đầu tháng mới, hoặc bấm ✎ gửi đề nghị kế toán"' : '') +
    ' oninput="jpRowSet(' + ri + ',\'' + key + '\',this.value);jpTinhDong(' + ri + ')">' +
    nut + '</td>';
}

/**
 * Gửi đề nghị kế toán sửa tồn đầu một dòng.
 *
 * ⚠️ Hỏi số mới TRƯỚC rồi mới hỏi lý do, và **bắt buộc có lý do** — máy chủ cũng chặn
 * (`jpGuiDeNghiTonDau`), đây chỉ là chặn sớm cho nhanh.
 */
function jpXinSuaTonDau(ri) {
  var r = APP.rows[ri];
  var cu = num(r.rowKind === 'HANG' ? r.stockOpen : r.hOpen);
  var ten = r.itemName || r.itemMisa || r.itemCode || r.machineCode || ('dòng ' + (ri + 1));

  var moi = prompt('Tồn đầu của ' + ten + ' đang là ' + cu +
                   '.\n\nSố ĐÚNG phải là bao nhiêu?', String(cu));
  if (moi === null) return;
  if (String(moi).trim() === '' || isNaN(Number(moi))) { toast('Phải nhập một con số'); return; }
  if (Number(moi) === cu) { toast('Số mới bằng số cũ — không cần đề nghị'); return; }

  var lyDo = prompt('Vì sao phải sửa? Kế toán cần căn cứ để duyệt.\n' +
                    '(ví dụ: đếm lại thấy 250, kỳ trước ghi nhầm)');
  if (lyDo === null) return;
  if (!String(lyDo).trim()) { toast('Phải ghi lý do'); return; }

  busy(true, 'Đang gửi đề nghị…');
  srv('jpGuiDeNghiTonDau', APP.token, {
    reportId: APP.report.id, rowId: r.id, soMoi: Number(moi), lyDo: String(lyDo).trim()
  }).then(function (d) {
    busy(false);
    toast(d.msg);
  }).catch(function (e) { busy(false); toast(e.message); });
}
/** Ô CHỈ ĐỌC do máy chủ tính. `id` để `jpTinhDong` vá lại được ngay lúc gõ —
    không có id thì ô đứng im tới lượt lưu, đúng cái Andy kêu "lâu hiện lên". */
function ro(val, id, rowspan) {
  var rs = rowspan ? ' rowspan="' + rowspan + '"' : '';
  return '<td class="calc w90"' + rs + (id ? ' id="' + id + '"' : '') + '>' +
         (val || 0) + '</td>';
}

function hasQRCluster(clusterId) {
  if (!clusterId) return false;

    return String(x.id) === String(clusterId);
  })[0];

}

function zoneIndexOf(zoneId) {
  for (var i = 0; i < APP.zones.length; i++) {
    if (String(APP.zones[i].id) === String(zoneId)) return i;
  }
  return 0;
}

function clusterSelect(cur, zi) {

/** Ô/máy đã cấu hình cho cơ sở của báo cáo đang mở. */
function machinesOfLoc() {

    return String(m.locationId) === String(locId);
  });
}

function machineSelect(cur, ri) {

  if (!ds.length) {

         '>' + esc(m.code) + '</option>';

/*════════════════════ Ô MÃ HÀNG — GÕ TỰ DO, có gợi ý ════════════════════
 *
 * Andy chốt 06/08/2026: *"nhiều khi mã mới hay mua ngoài không có"*.
 *
 * Trước bản này ô này là `<select>` khoá cứng vào danh mục ⇒ mã mới hoặc hàng mua
 * ngoài **không nhập được gì cả**, nhân viên đứng hình. Nay là ô gõ tự do kèm
 * `<datalist>` — vẫn gợi ý đủ danh mục khi bấm vào, nhưng gõ mã lạ vẫn nhận.
 *
 * ⚠️ Gõ trúng mã có trong danh mục thì TỰ ĐIỀN tên + Misa + giá; gõ mã lạ thì
 * **KHÔNG xoá** những gì nhân viên đã gõ tay. Xoá là mất công gõ lại, mà đây đúng
 * là tình huống mã lạ nên chẳng có gì để điền vào.
 */
/**
 * Ô hàng hoá — nhân viên gõ **TÊN HÀNG**, không gõ mã.
 *
 * Andy 07/08/2026: *"mã hàng hiển thị tên không phải chọn xong ra mã misa"*.
 * Trước đây ô này buộc vào `itemCode`, mà `itemCode` trong danh mục JP chính là
 * mã MISA — nên chọn xong màn hình chỉ còn `150JP065`, nhân viên đứng ở máy
 * không biết đó là hàng gì.
 *
 * Cột `Mã Misa` bên cạnh vẫn có và vẫn gõ được, nên không mất thông tin nào.
 * Bảng HÀNG của mẫu TÁCH vốn đã làm đúng khuôn này từ đầu — nay ba bảng thống nhất.
 *
 * ⚠️ Gõ tên lạ (hàng mua ngoài, mã mới) vẫn nhận. `itemCode` để trống thì máy chủ
 * tự lấy theo mã Misa (`jpSaveReport`: `itemCode || itemMisa`), nên kho vẫn tra
 * được. Đừng ép phải khớp danh mục — đúng cái Andy mở ra hôm 06/08.
 */
/**
 * Tên hàng để HIỆN — dòng đời cũ có mã mà chưa có tên thì tra danh mục lấy tên.
 *
 * Không có bước này thì mọi dòng cũ hiện ra ô TRỐNG ở cột đầu: nhân viên nhìn
 * bảng không biết dòng nào là hàng gì, mà mã thì đã chuyển sang cột bên cạnh.
 * ⚠️ Chỉ tra danh mục, KHÔNG bịa: mã lạ (hàng mua ngoài) vẫn để trống cho nhân
 * viên tự gõ — in đại cái mã vào ô "Tên hàng" là nói sai tên hàng.
 */
function tenDeHien(r) {
  if (jpStr0(r.itemName)) return r.itemName;
  var m = String(r.itemMisa || r.itemCode || '').trim().toLowerCase();
  if (!m) return '';
  var i = (APP.boot.items || []).filter(function (x) {
    return String(x.misa).trim().toLowerCase() === m ||
           String(x.code).trim().toLowerCase() === m;
  })[0];
  return i ? (i.name || '') : '';
}
function jpStr0(v) { return (v === null || v === undefined) ? '' : String(v).trim(); }

/** Báo cáo này có phải mẫu TÁCH (tiền / hàng hai bảng) — MỘT chỗ hỏi cho cả web. */
function jpLaTach(h) { return jpStr0((h || {}).bcMau).toUpperCase() === 'TACH'; }

function itemNhap(cur, ri) {
  return '<input type="text" list="dsMaHang" style="text-align:left"' +
    ' value="' + esc(cur) + '" placeholder="tên hàng — gõ được hàng mới"' +
    ' oninput="jpRowSet(' + ri + ',\'itemName\',this.value)"' +
    ' onchange="jpChonMaHang(' + ri + ',this.value)">';
}

/**
 * Đổ danh mục vào ô gợi ý mã hàng — MỘT bản cho cả trang, không mỗi ô một bản.
 *
 * ⚠️ Thẻ `<datalist>` nằm sẵn trong `Index.html`, NGOÀI `#zoneWrap`. Nhét nó vào
 * trong `zoneWrap` thì nó thành con đầu tiên và mọi selector `.zone:first-child`
 * hết khớp — đã làm hỏng `nhap.js` + `bctach.js` đúng kiểu đó, mà giao diện thì
 * trông y hệt nên không ai thấy.
 */
function dsMaHang() {
  var d = $('dsMaHang');
  if (!d) return;
  /* Khoá theo TÊN vì ô nhập giờ là tên. Phần sau dấu — là mã Misa, trình duyệt
     hiện nó làm chú thích nên nhân viên vẫn đối chiếu được mã khi cần. */
  d.innerHTML = (APP.boot.items || []).map(function (i) {
    return '<option value="' + esc(i.name) + '">' + esc(i.misa || i.code) + '</option>';
  }).join('');
}

/** Gõ xong mã: khớp danh mục thì điền hộ, không khớp thì để nguyên. */
function jpChonMaHang(ri, ten) {
  var r = APP.rows[ri];
  if (!r) return;
  r.itemName = ten;
  var t = String(ten).trim().toLowerCase();
  /* Khớp theo TÊN trước — đó là thứ nhân viên vừa gõ. Không khớp thì thử coi họ
     gõ thẳng mã (quen tay từ bản cũ), để không bắt ai phải đổi thói quen. */
  var i = (APP.boot.items || []).filter(function (x) {
    return String(x.name).trim().toLowerCase() === t;
  })[0] || (APP.boot.items || []).filter(function (x) {
    return String(x.code).trim().toLowerCase() === t ||
           String(x.misa).trim().toLowerCase() === t;
  })[0];
  if (i) {
    r.itemName = i.name || ten;
    r.itemCode = i.code || r.itemCode;
    r.itemMisa = i.misa || r.itemMisa;
    if (num(i.price) > 0) r.price = i.price;
    /* Vẽ lại để ô Mã Misa và Giá bên cạnh hiện số vừa điền hộ.
       ⚠️ An toàn ở ĐÂY vì hàm này gắn vào `onchange` — nó chỉ chạy khi ô đã mất
       tiêu điểm. Gọi `renderZones` trong `oninput` mới là chỗ làm con trỏ nhảy
       ra khỏi ô đang gõ, khiến gõ số hai chữ số không nổi. */
    renderZones();
  }
  jpDirty();
  jpTinhDong(ri);
}

/*════════════════ SỐ XEM TRƯỚC TRÊN MÁY — MỘT BẢN DUY NHẤT ════════════════
 *
 * Andy 06/08/2026: *"phần tính toán e nó lâu hiện lên quá"*.
 *
 * Vì sao lâu: bảng máy xu và máy tiền in thẳng `r.xuTong` · `r.soldQty` ·
 * `r.stockLeftCalc` · `r.amount` — **những số do MÁY CHỦ tính**. Nhân viên gõ xong
 * phải chờ tới lượt lưu (tự lưu sau 25 giây ngừng gõ) mới thấy số đổi.
 *
 * Nay tính ngay trên máy để HIỆN LIỀN. Máy chủ VẪN là chốt cuối — số lưu vào sheet
 * vẫn do `jpCalcRow_` tính, đây thuần tuý là xem trước.
 *
 * ⚠️ **Công thức phải KHỚP TỪNG PHÉP với máy chủ** (`jpCalcStockRow_` ·
 * `jpCalcMoneyRow_` · `jpCalcHangRow_`). Lệch một dấu là nhân viên thấy một số,
 * lưu xong ra số khác — tệ hơn là để chậm. Có test ghim hai bên bằng CÙNG bộ số
 * (`test/browser/xem-truoc.js` so với `test/tinh-tien.js`), lệch là đỏ.
 *
 * ⚠️ Chỉ tính số ĐỂ HIỆN. Không đụng `r.soldQty` / `r.amount` — đó là ô máy chủ ghi;
 * client ghi đè vào là gửi lên số của chính mình rồi máy chủ tin theo.
 */
/**
 * Chênh lệch một đồng hồ — bản sao ĐÚNG TỪNG NHÁNH của `jpMeterDelta_` (04_TinhToan).
 *
 * ⚠️ Ô "sau" TRỐNG hoặc CHẠY LÙI thì trả **0**, KHÔNG rơi về `mActual`. Rơi về là
 * màn hình in số cũ của máy chủ trong khi máy chủ sẽ tính ra 0 — nhân viên thấy một
 * số, lưu xong ra số khác, đúng cái tệ hơn để chậm. Em đã viết sai đúng chỗ này ở
 * bản đầu; test chỉ xanh vì bộ số nào cũng điền đủ hai đồng hồ.
 */
function jpDoiDongHo(truoc, sau) {
  if (jpTrongO(sau)) return 0;
  var b = num(truoc), a = num(sau);
  return a < b ? 0 : a - b;
}

/**
 * Bản sao `jpMayGoTay_` (00_Config) — dòng máy loại GÕ TAY, không có đồng hồ nào.
 *
 * ⚠️⚠️ **`mBefore = 0` KHÔNG phải "có đồng hồ" — so `> 0`, ĐỪNG dùng `jpTrongO`.**
 * Gặp thật 20/08/2026, ngay sau khi vá bản ở máy chủ: SBPQ **không bấm được** ba ô
 * *tiền mặt app · QR app · tiền thực thu*. Vì `khoaTien = !o.goTay`, mà hàm này còn
 * dò bằng ô-trống nên dòng có `mBefore = 0` bị coi là có đồng hồ ⇒ **khoá cả bốn ô
 * tiền**. Máy chủ thì đã nhận là gõ tay và **đang đòi đúng mấy ô đó** — tức app bắt
 * điền một ô nó không cho bấm.
 *
 * ⚠️⚠️ Bài học: vá `jpMayGoTay_` ở máy chủ mà quên bản sao này là **vá nửa vời**, và
 * nửa còn lại hỏng nặng hơn nửa đã vá. Chú thích ngay trên nó ghi rõ "Bản sao" — sửa
 * một bên thì phải grep bản kia. Có phép soát tĩnh khoá lại (`soat-tinh.py`, phép 10).
 */
function jpMayGoTay(r) {
  return !!r && num(r.mBefore) <= 0 && jpTrongO(r.mAfter);
}

function jpXemTruoc(r) {
  var k = r.rowKind || 'MONEY';
  var gia = num(r.price) || giaTuMa(r.itemMisa) || giaTuMa(r.itemCode);
  var o = { gia: gia };

  if (k === 'STOCK') {
    /* jpCalcStockRow_: tổng xu → bán = tổng ÷ giá xu (làm tròn XUỐNG) → còn */
    var xd = r.xuDays || [], tong = 0;
    for (var i = 0; i < xd.length; i++) tong += num(xd[i]);
    var gx = num(r.giaXu);
    o.xuTong = tong;
    o.ban = gx > 0 ? Math.floor(tong / gx) : 0;
    o.con = num(r.stockOpen) + num(r.addQty1) + num(r.addQty2)
          - num(r.xuLa) - o.ban - num(r.defectQty) - num(r.returnQty);
    o.du = (gx > 0 && tong % gx !== 0) ? (tong % gx) : 0;
  } else if (k === 'HANG') {
    /* jpCalcHangRow_: NV gõ ĐÃ BÁN, tồn cuối là số suy ra */
    o.ban = num(r.soldQty);
    o.con = num(r.stockOpen) + num(r.addQty1) + num(r.addQty2)
          - num(r.returnQty) - num(r.defectQty) - o.ban;
    o.tien = o.ban * gia;
    o.qua = (num(r.refundAmt) && gia) ? Math.floor(num(r.refundAmt) / gia) : 0;
  } else if (k === 'NGOAI') {
    o.con = num(r.stockOpen) + num(r.addQty1) - num(r.stockOut) - num(r.returnQty);
  } else if (k === 'COIN') {
    /* jpCalcCoinRow_: MỘT vị trí, HAI đồng hồ. Tiền lấy theo đồng hồ COIN
       (`amount = cActual × giá xu`); đồng hồ MONEY là đường thứ hai để ĐEM SO,
       không cộng vào tiền — cộng cả hai là doanh thu gấp đôi.
       ⚠️ Dòng COIN KHÔNG giữ hàng: `xuTong`/`ban`/`con` ép về 0 y như máy chủ. */
    o.cActual = jpDoiDongHo(r.cBefore, r.cAfter);
    o.actual  = jpDoiDongHo(r.mBefore, r.mAfter);
    o.tienXu    = o.cActual * giaXuMot();
    o.tienMoney = o.actual  * giaMoneyMot();
    o.tien   = o.tienXu;
    o.thu    = num(r.cash) + num(r.bank);
    o.lechXuMoney = o.tienXu - o.tienMoney;      // hai đồng hồ phải ra cùng một số
    o.lechThu     = o.tienXu - o.thu;            // đồng hồ vs tiền đếm được
    o.xuTong = 0; o.ban = 0; o.con = 0;
  } else if (k === 'MAY') {
    /* jpCalcMayRow_ — bảng tiền SBPQ, NHÂN VIÊN TỰ ĐIỀN (Andy chốt 12/08/2026).
       Đồng hồ CÓ số thì vẫn suy tiền từ nó (báo cáo đời cũ), không có thì lấy đúng
       số đã gõ. Bảng không còn ô đồng hồ nào, nhưng nhánh này phải giữ để mở lại
       báo cáo cũ không ra số khác máy chủ. */
    var goTay = jpMayGoTay(r);
    var mM = goTay ? 0 : jpDoiDongHo(r.mBefore, r.mAfter);
    o.actual = mM;
    o.goTay = goTay;
    if (!goTay) {
      o.tien = mM * giaXungDong(r);
      o.tm   = o.tien - num(r.bank);
    } else {
      o.tien = jpTrongO(r.amount) ? '' : num(r.amount);
      o.tm   = jpTrongO(r.cash) ? '' : num(r.cash);
    }
    /* ⚠️ `collection` suy TỪ TIỀN, không giữ `mM / 2` — với máy 10.000đ/xung nó phải
       bằng CHÍNH số xung. Xem chú thích ở `jpCalcMoneyRow_` (`04_TinhToan`). */
    o.collection = num(o.tien) / 10000;
    /* Bản sao `jpLechTM_` (00_Config). ⚠️ Ô trống là CHƯA ĐẾM ⇒ KHÔNG có lệch.
       Coi là 0 thì lệch ra −(tiền mặt app), mà `jpTongXemTruoc` đặt
       `adjMachine = Σ lệch` ⇒ TỔNG PHẢI NỘP trên màn về 0 ngay khi mở báo cáo. */
    o.lechTM = (jpTrongO(r.cashReal) || jpTrongO(r.cash))
      ? '' : (num(r.cashReal) - num(r.cash));
    o.qua = (num(r.refundAmt) && gia) ? Math.floor(num(r.refundAmt) / gia) : 0;
  } else {
    /* MONEY — jpCalcMoneyRow_ */
    var mAct = jpDoiDongHo(r.mBefore, r.mAfter);
    o.actual = mAct;
    o.tien = mAct * giaXungDong(r);
    o.collection = o.tien / 10000;              // đơn vị 10.000đ, đúng như form giấy
    o.tm = o.tien - num(r.bank);                // Tiền mặt = thành tiền − chuyển khoản
    /* THỰC THU theo từng mã (Andy chốt 30/08/2026). Bản sao `jpLechTM_` (`00_Config`).
       ⚠️ Ô trống là CHƯA ĐẾM ⇒ KHÔNG có lệch. Coi là 0 thì lệch ra −(tiền mặt máy báo),
       mà `jpTongXemTruoc` đặt `adjMachine = Σ lệch` ⇒ TỔNG PHẢI NỘP trên màn về 0 ngay
       khi mở báo cáo — đúng cái bẫy đã ghi ở nhánh `MAY`. */
    o.lechTM = (jpTrongO(r.cashReal) || jpTrongO(o.tm))
      ? '' : (num(r.cashReal) - num(o.tm));
    o.qua = (num(r.refundAmt) && gia) ? Math.floor(num(r.refundAmt) / gia) : 0;
    /*
     * ⚠️⚠️ ĐÃ BÁN + CÒN LẠI — TRƯỚC 26/08/2026 NHÁNH NÀY KHÔNG TÍNH HAI SỐ ĐÓ.
     *
     * Mọi nhánh khác (`STOCK` · `HANG` · `NGOAI`) đều đặt `o.ban`/`o.con`; riêng
     * `MONEY` — máy tiền mẫu CHUNG, tức gần hết hệ thống — thì không. `jpTinhDong`
     * chỉ ghi ô khi giá trị `!== undefined`, nên hai cột đó **đứng im** ở số của lượt
     * lưu trước trong suốt lúc nhân viên gõ: chỉ số nhảy, tiền nhảy, mà ĐÃ BÁN vẫn 0.
     * Andy gặp thật ở VINWONDER 26/08. Dòng TỔNG cũng lấy `con` qua `jpXemTruoc`
     * (`{ k: 'con', xt: true }`) nên tổng CÒN LẠI ra 0 luôn.
     *
     * ⚠️ Phải mirror ĐÚNG `jpCalcMoneyRow_`, không tự nghĩ công thức:
     *   · đồng hồ trứng CÓ số  ⇒ tin nó, và **KHÔNG trừ hoàn khách** (đồng hồ đếm quả
     *     ĐÃ NHẢ nên phần khách không lấy vốn đã không nằm trong đó)
     *   · chưa có đồng hồ trứng ⇒ suy từ tiền, và **CÓ trừ** hoàn khách
     *   Trừ ở cả hai nhánh là xuất kho thiếu ⇒ 632 hụt giá vốn mà sổ VẪN CÂN.
     *   `Math.max(0, …)` cũng phải giữ: thiếu nó là số bán ÂM.
     */
    /*
     * ⚠️⚠️ SUY TỪ **TIỀN THẬT SỰ THU ĐƯỢC** — mirror `jpCalcMoneyRow_` (Andy 31/08/2026:
     * *"cộng thêm tiền ví dụ +100k phải trừ thêm 1 trứng mới đúng á e"*). Đồng hồ đếm
     * XUNG; máy nhả một quả mà không ăn được xung thì tiền có trong hộp còn `o.tien`
     * thì không — quả đó phải ra khỏi tồn.
     *
     * ⚠️ **CHỈ CỘNG PHẦN THỪA** (`> 0`), y hệt máy chủ. Hụt tiền nghĩa là đồng hồ ĐÃ
     * đếm xung ⇒ trứng ĐÃ nhả, tiền mất sau khi bán; trừ trứng ở đây là 632 hụt giá vốn
     * mà sổ vẫn CÂN.
     *
     * ⚠️ `o.lechTM` là **chuỗi rỗng** khi chưa đếm (không phải 0) — `num()` đưa về 0 nên
     * dòng chưa đếm ra y hệt trước. Đừng "dọn" thành so thẳng `o.lechTM > 0`: `'' > 0`
     * là false nên may mà đúng, nhưng đó là trùng hợp chứ không phải chủ ý.
     */
    var thuaTien = num(o.lechTM) > 0 ? num(o.lechTM) : 0;
    var banTien = gia > 0 ? Math.floor((o.tien + thuaTien) / gia) : 0;
    var coDhTrung = !jpTrongO(r.hAfter);
    o.ban = coDhTrung ? jpDoiDongHo(r.hBefore, r.hAfter)
                      : Math.max(0, banTien - o.qua);
    /* Còn lại = Ban đầu + Bổ sung − Đã bán − Trả về kho (y hệt `row.hLeft` ở máy chủ) */
    o.con = num(r.hOpen) + num(r.addQty1) + num(r.addQty2) - o.ban - num(r.returnQty);
  }

  /* Lệch giữa số ĐẾM THỰC TẾ và số tính ra — ô trống là CHƯA đếm, không phải đếm 0 */
  o.coDem = !jpTrongO(r.stockActual);
  o.lech = o.coDem ? (num(r.stockActual) - num(o.con)) : '';
  return o;
}

/**
 * Cập nhật TẠI CHỖ các ô tự tính của một dòng.
 *
 * ⚠️ Vá từng ô theo id chứ KHÔNG dựng lại cả bảng: dựng lại là con trỏ nhảy ra khỏi
 * ô đang gõ, gõ số hai chữ số không nổi. Đó cũng là lý do bản cũ không tính lại gì
 * cả — nhưng bỏ hẳn thì số không bao giờ hiện.
 */
function jpTinhDong(ri, khongVeTong) {
  var r = APP.rows[ri];
  if (!r) return;
  var o = jpXemTruoc(r);
  var dat = function (hau, chu) {
    var el = document.getElementById(hau + ri);
    if (el) el.innerHTML = chu;
  };
  dat('gia', o.gia ? money(o.gia) : '—');
  if (o.xuTong !== undefined) dat('xuTong', String(o.xuTong));
  if (o.ban   !== undefined) dat('ban', '<b>' + o.ban + '</b>');
  if (o.con   !== undefined) dat('con', '<b>' + o.con + '</b>');
  if (o.tien  !== undefined) dat('tien', '<b>' + money(o.tien) + '</b>');
  if (o.tm    !== undefined) dat('tm', money(o.tm));
  if (o.qua   !== undefined) dat('qua', String(o.qua));
  if (o.actual !== undefined) {
    dat('act', String(o.actual));
    if (o.collection !== undefined) dat('coll', String(o.collection));
  }
  /* Dòng COIN: hai đồng hồ + hai ô tiền, cộng ô tổng thu dùng chung cả hai dòng */
  if (o.cActual !== undefined) {
    dat('cAct', String(o.cActual));
    dat('tienXu', '<b>' + money(o.tienXu) + '</b>');
    dat('tienMn', '<b>' + money(o.tienMoney) + '</b>');
    dat('thu', '<b>' + money(o.thu) + '</b>');
  }
  dat('lech', o.coDem
    ? '<b style="color:' + (o.lech === 0 ? 'inherit' : o.lech > 0 ? '#047857' : '#b91c1c') +
      '">' + (o.lech > 0 ? '+' : '') + o.lech + '</b>'
    : '<span class="sub">—</span>');

  /* Lệch TIỀN MẶT của bảng tiền mẫu TÁCH — chuỗi do `jpChuLechTM` dựng, cùng hàm với
     lúc vẽ bảng. Phải tô/bỏ tô cả ô: gõ cho khớp lại mà ô còn đỏ thì nhân viên tưởng
     vẫn còn lệch. */
  if (o.lechTM !== undefined) {
    var oLtm = document.getElementById('ltm' + ri);
    if (oLtm) {
      oLtm.innerHTML = jpChuLechTM(o.lechTM);
      oLtm.classList.toggle('lech', num(o.lechTM) !== 0);
    }
  }

  /* Khối Tổng kết đổi theo — sửa một ô đồng hồ là TỔNG NỘP đổi, để nó đứng im ở số
     cũ còn tệ hơn để trống: nhân viên đọc tưởng đã tính rồi.
     `khongVeTong` chỉ dùng khi quét CẢ bảng (`jpVeLaiSoTuTinh`) — n dòng mà mỗi
     dòng vẽ lại cả khối tổng là n lượt vẽ thừa. */
  if (khongVeTong) return;
  paintTotals(jpTongXemTruoc());
  jpCapNhatTong();          // dòng TỔNG phải đổi cùng nhịp với ô vừa gõ
}

/**
 * VẼ LẠI BẢNG XONG thì mọi ô TỰ TÍNH phải trở về số ĐANG GÕ.
 *
 * ⚠️ `renderZones` in thẳng `r.cActual` · `r.amount` · `r.soldQty`… — toàn trường
 * MÁY CHỦ ghi lúc lưu lần trước. Nên nhân viên gõ thêm 100 xu (ô "Thành tiền" nhảy
 * lên 8.700.000 nhờ `jpTinhDong`) rồi bấm "+ Thêm ô / máy" là cả bảng vẽ lại và ô
 * đó **tụt về 3.700.000** — số của lượt lưu trước. Số họ vừa gõ vẫn còn trong ô
 * nhập, chỉ mấy ô TỰ TÍNH nói dối.
 *
 * Lỗi này CÓ TỪ TRƯỚC, nhưng trước đây không có gì để đối chiếu nên không ai thấy.
 * Dòng TỔNG (07/08/2026) lấy số qua `jpXemTruoc` nên nó ĐÚNG — thành ra trên cùng
 * một màn có hai con số cãi nhau: thân bảng 3.700.000, dòng tổng 8.700.000. Đó
 * đúng cái bẫy "hai số cùng tên trên một màn" đã mắc ở màn đối soát.
 *
 * Cũng dọn luôn thứ tự `paintTotals`/`renderZones` (bẫy cũ: bảng tổng nằm trong
 * `zoneWrap` nên vẽ lại là ô số về 0đ) — nay vẽ xong là tính lại ngay tại đây.
 */
function jpVeLaiSoTuTinh() {
  APP.rows.forEach(function (r, ri) { jpTinhDong(ri, true); });
  paintTotals(jpTongXemTruoc());
  jpCapNhatTong();
}

/*──────── Thao tác ────────*/
function jpAddZone() {
  APP.zones.push({ id: '', name: 'Khu vực ' + (APP.zones.length + 1), clusterId: '', note: '' });
  jpDirty(); renderZones();
}
function jpDelZone(zi) {
  if (!confirm('Xoá khu vực này và tất cả dòng bên trong?')) return;
  /* Dòng STOCK (bảng hàng tồn máy xu) mang zoneKey = 0 nhưng KHÔNG thuộc khu vực
     nào — trước đây xoá khu vực đầu là mất sạch bảng tồn kho vừa nhập. */
  APP.rows = APP.rows.filter(function (r) {
    return r.rowKind === 'STOCK' || r.zoneKey !== zi;
  });
  APP.rows.forEach(function (r) {
    if (r.rowKind !== 'STOCK' && r.zoneKey > zi) r.zoneKey--;
  });
  APP.zones.splice(zi, 1);
  if (!APP.zones.length) APP.zones = [{ id: '', name: 'Khu vực 1', clusterId: '', note: '' }];
  jpDirty(); renderZones();
}
function jpZoneName(zi, v) { APP.zones[zi].name = v; jpDirty(); }

/**
 * Ô CHỌN GIÁ 1 XUNG của **TỪNG DÒNG** — **danh sách ĐÓNG**, y như `jpGiaXung_` ở máy chủ.
 *
 * ⚠️ Ở DÒNG chứ không ở khu: Andy chốt 29/08/2026 (sửa lại lời chốt trước đó) rằng hai
 * loại máy **XEN LẪN nhau** trong cùng một khu. Đặt ở khu là cả khu bị tính sai một nửa.
 *
 * ⚠️ Không cho gõ số tự do: gõ thiếu một số 0 là dòng đó về 1/10, mà sổ vẫn cân nên
 * không phép kiểm nào bắt được.
 * ⚠️ Chữ phải nói ra CẢ HAI cách gọi ("chia 2" là chữ Andy và nhân viên dùng), không chỉ
 * in con số — nhân viên đứng ở điểm bán không nhớ 5.000 ứng với loại máy nào.
 * ⚠️ Chọn MỘT LẦN rồi máy chủ gieo sang kỳ sau, nên không phải chọn lại mỗi kỳ.
 */
function xungSelect(v, ri) {
  var cur = (Number(v) === 10000) ? 10000 : 5000;
  return '<td class="w150"><select style="width:100%" ' +
    'onchange="jpRowXung(' + ri + ',this.value)">' +
    '<option value="5000"' + (cur === 5000 ? ' selected' : '') + '>÷2 · 5.000đ</option>' +
    '<option value="10000"' + (cur === 10000 ? ' selected' : '') + '>KHÔNG ÷2 · 10.000đ</option>' +
    '</select></td>';
}

function jpRowXung(ri, v) {
  APP.rows[ri].giaXung = Number(v) === 10000 ? 10000 : 5000;

     viên chọn xong nhìn bảng không thấy gì nhúc nhích và tưởng nó hỏng. */
  jpVeLaiSoTuTinh();
}

/**
 * Tên khu vực này có phải tên **MÁY TỰ ĐẶT** hay không.
 *
 * ⚠️ Đúng HAI trường hợp: **trống**, hoặc **đúng khuôn `jpAddZone` sinh ra**
 * (`Khu vực <số>`). Mọi thứ khác là chữ nhân viên gõ ⇒ KHÔNG được đụng tới.
 *
 * ⚠️ Neo `^…$` và `\d+` — khớp CHÍNH XÁC. Nới thành `indexOf('Khu vực')` là ăn luôn
 * `Khu vực 1 - tầng 2`, tức xoá chữ nhân viên đã gõ. Đó đúng là điều Andy chốt KHÔNG
 * được làm (08/09/2026: *"không ghi đè"*).
 */
function jpTenKhuTuDat(ten) {
  var t = jpStr0(ten);
  return t === '' || /^Khu vực \d+$/.test(t);
}

/**
 * Chọn cụm cho một khu vực — và **tự điền tên khu theo tên cụm**.
 *
 * Andy 08/09/2026. Trước bản này nhân viên gõ tay tên khu **mỗi kỳ**, nên cùng một
 * chỗ ra bốn cách viết: đo trên sheet thật ở SBPQ có `GATE 2` · `Gate2` · `Khu vực 1`
 * · `Khu vực 2`. Kế toán nhìn báo cáo hai kỳ liền không biết có phải cùng một khu.
 *
 * ⚠️⚠️ **KHÔNG GHI ĐÈ** tên nhân viên đã gõ — chỉ điền khi tên còn là tên máy tự đặt
 * (xem `jpTenKhuTuDat`). Ghi đè là xoá chữ người ta vừa gõ ngay trước mắt họ, và tên
 * khu là thứ nhân viên biết rõ hơn danh mục: cụm đặt tên theo máy Pay Box, khu thì có
 * thể là `GATE 2 - cửa trong`.
 *
 * ⚠️ Bỏ chọn cụm (`v` rỗng) thì **KHÔNG đổi tên** — không ai muốn xoá cụm là mất luôn
 * tên khu vừa được điền.
 *
 * ⚠️ Vẫn `renderZones()` như cũ: chọn cụm có QR là **dải ảnh Pay Box mới hiện ra**
 * (`hasQRCluster`), không vẽ lại thì nhân viên không thấy chỗ gắn ảnh — mà đó chính
 * là lỗ hổng `W17` vừa vá ở máy chủ.
 */
function jpZoneCluster(zi, v) {
  var z = APP.zones[zi];
  if (!z) return;
  z.clusterId = v;
  var c = (APP.boot.clusters || []).filter(function (x) {
    return String(x.id) === String(v);
  })[0];
  if (c && jpTenKhuTuDat(z.name)) z.name = jpStr0(c.name);
  jpDirty(); renderZones();
}
