/** Giữ tên cũ cho các handler đang gọi, nhưng nay tính lại CẢ DÒNG: đổi mã hàng là
    đổi giá, mà đổi giá là đổi thành tiền và số quả hoàn — không chỉ mỗi ô giá. */
function jpUpdateGia(ri) { jpTinhDong(ri); }
function jpPickMachine(ri, machineId) {
  var m = (APP.boot.machines || []).filter(function (x) { return String(x.id) === String(machineId); })[0];
  APP.rows[ri].machineId = machineId;
  APP.rows[ri].machineCode = m ? m.code : '';
  if (m && m.itemCode && !APP.rows[ri].itemCode) APP.rows[ri].itemCode = m.itemCode;
  jpDirty();

  if (!machineId || !APP.report.id) { renderZones(); return; }
  srv('jpGetOpening', APP.token, APP.report.id, machineId).then(function (o) {
    if (o.found) {
      APP.rows[ri].mBefore = o.mBefore;
      APP.rows[ri].cBefore = o.cBefore;
      APP.rows[ri].hBefore = o.hBefore;
      APP.rows[ri].hOpen = o.hOpen;
      APP.rows[ri].stockOpen = o.stockOpen;
      /*⚠️⚠️ KHOÁ ô theo `chot`, KHÔNG theo `found` — hai chuyện khác nhau:
         `found` = có số để điền · `chot` = số của kỳ ĐÃ DUYỆT nên đừng cho sửa.
         Lấy số của kỳ chưa duyệt rồi khoá luôn là ép nhân viên giữ một con số kế
         toán còn có thể trả về bắt sửa. */
      APP.rows[ri].carried = (o.chot === true);
      toast(o.chot ? 'Đã lấy số cuối kỳ trước (đã duyệt)'
                   : 'Đã lấy số cuối kỳ trước — kỳ đó CHƯA duyệt, sửa được nếu sai');
    } else {
      APP.rows[ri].carried = false;
    }
    renderZones();
  }).catch(function () { renderZones(); });
}
/**
 * Ô Mã Misa của bảng HÀNG (mẫu tách). Nhân viên chỉ gõ TÊN HÀNG + MÃ MISA, nên
 * `itemCode` — thứ KHO tra theo — phải suy ra từ Misa.
 *
 * ⚠️ Trong danh mục thật `code` và `misa` **cùng là** `100JP023` (xem
 * `jpNapDanhMucHangJP`), nên gán `itemCode = itemMisa` là đúng và kho khớp lớp tồn.
 * Bỏ bước này là dòng hàng không có `itemCode` ⇒ `jpXuatKhoBaoCao_` không tìm được
 * lớp tồn ⇒ cắm cờ `thieuLop` và giá vốn rơi về giá mua gần nhất.
 */
function jpPickItemMisa(ri, misa) {
  APP.rows[ri].itemMisa = misa;
  if (!APP.rows[ri].itemCode) APP.rows[ri].itemCode = misa;
  jpPickItemCode(ri, APP.rows[ri].itemCode);
}

function jpPickItemCode(ri, itemCode) {
  APP.rows[ri].itemCode = itemCode;
  jpDirty();

  var tok = (APP.rows[ri]._pickTok = (APP.rows[ri]._pickTok || 0) + 1);
  if (!itemCode || !APP.report.id) return;
  srv('jpGetOpening', APP.token, APP.report.id, '', itemCode).then(function (o) {
    if (APP.rows[ri]._pickTok !== tok || APP.rows[ri].itemCode !== itemCode) return;
    if (o.found) {
      APP.rows[ri].mBefore = o.mBefore;
      APP.rows[ri].cBefore = o.cBefore;
      APP.rows[ri].hBefore = o.hBefore;
      APP.rows[ri].hOpen = o.hOpen;
      APP.rows[ri].stockOpen = o.stockOpen;
      APP.rows[ri].itemMisa = o.itemMisa || APP.rows[ri].itemMisa;
      /* Xem chú thích ở `jpLayDauKy` — khoá theo `chot`, không theo `found`. */
      APP.rows[ri].carried = (o.chot === true);
      toast('Đã lấy số cuối kỳ trước');
      renderZones();
    } else {
      APP.rows[ri].carried = false;
    }
  }).catch(function () {});
}

/**
 * Mỗi lần nhân viên gõ. GHI NGAY lên máy rồi mới hẹn lưu lên máy chủ.
 *
 * ⚠️ Thứ tự đó quan trọng: ghi máy là đồng bộ và không cần mạng, nên nó xong TRƯỚC
 * khi có bất cứ chuyện gì xảy ra. Hẹn giờ thì có thể không bao giờ chạy tới.
 */
function jpDirty() {
  APP.dirty = true;
  jpLuuNhapMay();
  jpHenTuLuu();
  /* ⚠️ Checklist phải vẽ lại NGAY LÚC GÕ, không chờ lượt lưu. Chỉ vẽ sau khi lưu là
     nhân viên điền xong vẫn thấy "còn thiếu" cho tới 25 giây sau — họ sẽ tưởng mình
     điền sai chỗ rồi đi sửa lung tung. Bộ đo `nhap.js` bắt được lỗi này.
     Rẻ: nó chỉ đọc `APP.rows` và ghi innerHTML một khối nhỏ. */
  paintCheckList();
}

/*──────── Lưu · nộp ────────*/
function collectPayload() {
  return {
    reportId: APP.report.id,
    head: {
      adjMachine: num($('inAdj').value),
      adjMachineNote: $('inAdjNote').value,
      refundCustomer: num($('inRefund').value),
      refundNote: $('inRefundNote').value,
      remark: $('inRemark').value
    },
    zones: APP.zones.map(function (z) {
      return { id: z.id, name: z.name, clusterId: z.clusterId, note: z.note || '' };
    }),
    rows: APP.rows.map(function (r) {
      return {
        id: r.id, zoneKey: r.zoneKey || 0, rowKind: r.rowKind, giaXung: r.giaXung,
        machineId: r.machineId, machineCode: r.machineCode, itemCode: r.itemCode,
        /* ⚠️ `itemMisa` PHẢI gửi lên. Trước bản này client bỏ nó, nên ô "Mã Misa"
           nhân viên gõ tay bị mất trắng: máy chủ rơi về `itemMap[itemCode].misa`,
           mà mã chưa có trong danh mục thì mã Misa **trống vĩnh viễn** — đúng chỗ
           kế toán cần để khớp sổ MISA. Lỗi có sẵn ở mẫu chung, lộ ra khi mẫu tách
           cho nhân viên tự điền mã Misa (Andy chốt 04/08/2026). */
        itemMisa: r.itemMisa, itemName: r.itemName,
        hOpen: r.hOpen, hBefore: r.hBefore, hAfter: r.hAfter,
        stockOut: r.stockOut, topupNote: r.topupNote,
        giaXu: r.giaXu, xuDays: r.xuDays || [], xuLa: r.xuLa,
        mBefore: r.mBefore, mAfter: r.mAfter, cBefore: r.cBefore, cAfter: r.cAfter,
        /* ⚠️ `amount` và `cashReal` PHẢI gửi lên — ở bảng tiền mẫu TÁCH chúng là ô
           NHÂN VIÊN GÕ (Andy chốt 12/08/2026), không phải số máy chủ tính. Bỏ sót là
           gõ xong mất trắng, y hệt lỗi `itemMisa` cũ. Mọi mẫu khác thì `jpCalcRow_`
           ghi đè `amount` nên gửi lên vô hại. */
        cash: r.cash, bank: r.bank, amount: r.amount, cashReal: r.cashReal,
        stockOpen: r.stockOpen, addQty1: r.addQty1, addQty2: r.addQty2,
        stockActual: r.stockActual, defectQty: r.defectQty, returnQty: r.returnQty,
        refundAmt: r.refundAmt, refundRowNote: r.refundRowNote,
        note: r.note
      };
    })
  };
}

/*════════════════ NHÁP TỰ LƯU ════════════════
 * Andy chốt 04/08/2026: *"tất cả có lưu báo cáo nháp đi em để khi có vấn[đề] thoát
 * ra vào lại làm tiếp"*.
 *
 * Trước bản này nháp **CHỈ lưu khi bấm tay**. Nhân viên gõ 20 phút rồi hết pin, mất
 * mạng, hay lỡ đóng tab là **mất trắng** — `beforeunload` chỉ hỏi "còn thay đổi chưa
 * lưu", hỏi xong vẫn không lưu gì. Ở mall thì cả ba chuyện đó đều thường.
 *
 * HAI TẦNG, và tầng dưới là tầng CHẮC:
 *
 *  ① **Nháp trên MÁY (localStorage) — ghi NGAY mỗi lần gõ.** Đồng bộ, không cần
 *     mạng, sống qua cả sập app và tắt máy. Đây là cái cứu được số đã gõ.
 *  ② **Tự lưu lên MÁY CHỦ** sau khi ngừng gõ `JP_TU_LUU_MS`, và khi rời trang.
 *     Cần mạng, nên KHÔNG được là tầng duy nhất.
 *
 * ⚠️ **Chỉ mời phục hồi khi CHẮC CHẮN máy chủ chưa nhận.** Nháp trên máy mang cờ
 * `chuaLuu`; lưu lên máy chủ thành công thì xoá nháp. Nên lúc mở lại mà còn nháp
 * `chuaLuu` là **biết chắc** nó chưa lên máy chủ — không phải đoán bằng cách so dấu
 * thời gian hai bên (so kiểu đó là có lúc đè mất số mới của máy chủ).
 *
 * ⚠️ Tự lưu **KHÔNG bật màn chờ** (`busy`): nó nháy giữa lúc đang gõ và chặn mất ô
 * nhập. Chỉ bấm tay mới bật.
 *
 * ⚠️ Không tự lưu khi `!APP.canEdit` (báo cáo đã nộp / đã duyệt) và khi không có gì
 * đổi — `jpSaveReport` có `jpDiffParts_` nên lưu lại y nguyên thì không huỷ chữ ký,
 * nhưng vẫn tốn lượt gọi Sheets vô ích.
 */
var JP_TU_LUU_MS = 25000;          // ngừng gõ bao lâu thì tự lưu lên máy chủ
var JP_NHAP_HEN = null;            // hẹn giờ tự lưu đang chờ
var JP_LUU_LUC = '';               // lần lưu máy chủ gần nhất, để in ra cho NV thấy
var JP_NHAP_LOI = '';              // lỗi lần tự lưu vừa rồi (mất mạng…)

function jpKhoaNhap(id) { return 'nhap_' + String(id || ''); }

/** Ghi nháp lên MÁY. Gọi ở mọi lần gõ — phải nhẹ và không bao giờ throw. */
function jpLuuNhapMay() {
  if (!APP.canEdit || !APP.report || !APP.report.id) return;
  LS.set(jpKhoaNhap(APP.report.id), {
    reportId: APP.report.id, luc: Date.now(), chuaLuu: true,
    /* Chỉ giữ payload — KHÔNG giữ token, không giữ PIN */
    payload: collectPayload()
  });
}

function jpXoaNhapMay() {
  if (APP.report && APP.report.id) LS.del(jpKhoaNhap(APP.report.id));
}

/** Nháp trên máy của báo cáo này, và CHẮC CHẮN chưa lên máy chủ. */
function jpNhapMayConDo(reportId) {
  var d = LS.get(jpKhoaNhap(reportId));
  return (d && d.chuaLuu && d.payload && String(d.reportId) === String(reportId)) ? d : null;
}

/** Hẹn tự lưu lên máy chủ. Mỗi lần gõ là hẹn lại — chỉ lưu khi đã ngừng gõ. */
function jpHenTuLuu() {
  if (JP_NHAP_HEN) clearTimeout(JP_NHAP_HEN);
  JP_NHAP_HEN = setTimeout(function () {
    JP_NHAP_HEN = null;
    if (APP.dirty && APP.canEdit && !APP.saving) jpSaveDraft(false, true);
  }, JP_TU_LUU_MS);
  jpTrangThaiNhap();
}

/** Dòng trạng thái — nhân viên phải THẤY số đã an toàn hay chưa, không phải đoán. */
function jpTrangThaiNhap() {
  var e = $('nhapState');
  if (!e) return;
  if (!APP.canEdit) {
    e.textContent = 'Báo cáo đã nộp — không sửa được nữa.';
    e.className = 'nhapState';
    return;
  }
  if (JP_NHAP_LOI) {
    e.textContent = '⚠ Chưa lưu được lên hệ thống (' + JP_NHAP_LOI + '). ' +
      'Số đã gõ vẫn được giữ TRÊN MÁY NÀY — mở lại báo cáo là làm tiếp được. ' +
      'Có mạng thì bấm "Lưu nháp".';
    e.className = 'nhapState loi';
    return;
  }
  if (APP.saving) { e.textContent = 'Đang lưu nháp…'; e.className = 'nhapState'; return; }
  if (APP.dirty) {
    e.textContent = '● Có thay đổi chưa lưu — tự lưu sau khi bạn ngừng gõ ' +
      Math.round(JP_TU_LUU_MS / 1000) + ' giây. Số đã gõ giữ trên máy này ngay lập tức.';
    e.className = 'nhapState cho';
    return;
  }
  e.textContent = JP_LUU_LUC
    ? '✓ Đã lưu nháp lúc ' + JP_LUU_LUC + ' — thoát ra vào lại vẫn còn.'
    : '✓ Chưa có gì thay đổi.';
  e.className = 'nhapState ok';
}

/**
 * Rời trang thì lưu ngay, không đợi hẹn giờ.
 *
 * ⚠️ `visibilitychange` là chỗ DUY NHẤT còn kịp gọi máy chủ trên điện thoại —
 * `beforeunload` thường bị bỏ qua khi người dùng chuyển app. Vẫn không chắc kịp,
 * nên nháp trên MÁY (ghi đồng bộ) mới là cái cứu được số.
 */
function jpDatCanhTuLuu() {
  if (window.__jpDaDatCanh) return;
  window.__jpDaDatCanh = true;
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'hidden') return;
    jpLuuNhapMay();                                   // chắc chắn: ghi máy trước
    if (APP.dirty && APP.canEdit && !APP.saving) jpSaveDraft(false, true);
  });
  /* Đổi mạng / có mạng lại thì thử lưu nốt */
  window.addEventListener('online', function () {
    if (APP.dirty && APP.canEdit && !APP.saving) jpSaveDraft(false, true);
  });
}

/**
 * Mời phục hồi nháp trên máy. Gọi sau `bindReport`.
 * KHÔNG tự đè: nhân viên phải biết là số của họ ở đâu ra.
 */
function jpMoiPhucHoiNhap() {
  if (!APP.canEdit || !APP.report) return;
  var d = jpNhapMayConDo(APP.report.id);
  if (!d) return;
  var phut = Math.max(1, Math.round((Date.now() - d.luc) / 60000));
  if (!confirm('Lần trước bạn có ' + (d.payload.rows || []).length +
      ' dòng chưa lưu được lên hệ thống (khoảng ' + phut + ' phút trước).\n\n' +
      'Lấy lại số đó để làm tiếp?\n\n' +
      'Bấm Huỷ nếu muốn dùng số đang có trên hệ thống — nháp cũ sẽ bị xoá.')) {
    jpXoaNhapMay();
    return;
  }
  jpDatLaiTuNhap(d.payload);
  toast('Đã lấy lại nháp — bấm "Lưu nháp" để đưa lên hệ thống');
}

/** Đổ payload đã lưu trở lại vào bảng đang mở. */
function jpDatLaiTuNhap(p) {
  APP.zones = (p.zones || []).map(function (z) {
    return { id: z.id, name: z.name, clusterId: z.clusterId, note: z.note || '' };
  });
  if (!APP.zones.length) APP.zones = [{ id: '', name: 'Khu vực 1', clusterId: '', note: '' }];
  APP.rows = (p.rows || []).map(function (r) {
    return Object.assign({}, r, { warns: [] });
  });
  var h = p.head || {};
  $('inAdj').value = h.adjMachine || 0;
  $('inAdjNote').value = h.adjMachineNote || '';
  $('inRefund').value = h.refundCustomer || 0;
  $('inRefundNote').value = h.refundNote || '';
  $('inRemark').value = h.remark || '';
  APP.dirty = true;
  renderZones();
  jpTrangThaiNhap();
}

/**
 * @param showToast  bấm tay thì hiện "Đã lưu"
 * @param nhe        TỰ LƯU: không bật màn chờ, lỗi thì không quấy nhân viên
 */
function jpSaveDraft(showToast, nhe) {
  if (!APP.canEdit || APP.saving) return Promise.resolve();
  APP.saving = true;
  if (!nhe) busy(true, 'Đang lưu…');
  jpTrangThaiNhap();

  return srv('jpSaveReport', APP.token, collectPayload()).then(function (res) {
    if (!nhe) busy(false);
    APP.saving = false; APP.dirty = false;
    /* Máy chủ đã nhận rồi thì nháp trên máy hết việc — xoá để lần mở sau không
       mời phục hồi một bản CŨ HƠN số đang có trên hệ thống. */
    jpXoaNhapMay();
    JP_NHAP_LOI = '';
    JP_LUU_LUC = new Date().toTimeString().slice(0, 5);

    APP.rows.forEach(function (r, i) {
      var s = (res.rows || [])[i];
      if (!s) return;
      r.id = s.id; r.rowKind = s.rowKind;
      r.mActual = s.mActual; r.cActual = s.cActual;
      r.collection = s.collection; r.amount = s.amount; r.soldQty = s.soldQty;
      r.hLeft = s.hLeft; r.xuTong = s.xuTong;
      r.stockLeftCalc = s.stockLeftCalc; r.warns = s.warns || [];
    });

    APP.headWarns = res.headWarns || [];
    /* ⚠️ `renderZones()` PHẢI chạy TRƯỚC `paintTotals`. Bảng tổng của mẫu tách nằm
       trong `zoneWrap`, nên vẽ lại là ô số về "0đ" — gọi `paintTotals` trước thì số
       vừa in bị chính `renderZones` xoá đi, và bảng tổng đứng im ở 0 cho tới lần lưu
       sau. Mấy ô `sRev`/`sTotal` nằm ngoài `zoneWrap` nên trước đây không lộ ra. */
    renderZones();
    paintTotals(res.totals);
    paintWarnings();
    paintCheckList();
  paintCheckList();
    refreshPhotoProgress();

    jpTrangThaiNhap();

    if (res.resetSign && res.resetSign.length) {
      toast('Đã huỷ chữ ký phần ' +
        res.resetSign.map(function (p) { return p === 'REV' ? 'doanh thu' : 'kho'; }).join(', '));
    } else if (showToast) toast('Đã lưu');

    return res;
  }).catch(function (e) {
    if (!nhe) busy(false);
    APP.saving = false;
    /* GIỮ `dirty` và GIỮ nháp trên máy: máy chủ chưa nhận thì số vẫn phải còn đường
       về. Đây là chỗ quan trọng nhất của cả cơ chế — nuốt lỗi rồi xoá nháp là mất số. */
    jpLuuNhapMay();
    JP_NHAP_LOI = e.message;
    jpTrangThaiNhap();
    /* Tự lưu thì KHÔNG bắn toast: nhân viên đang gõ, và dòng trạng thái đã nói rõ.
       Bấm tay thì phải nói ra. */
    if (!nhe) toast(e.message);
    if (nhe) return null;
    throw e;
  });
}

/**
 * TỔNG KẾT tính ngay trên máy — bản sao ĐÚNG TỪNG PHÉP của `jpCalcReport_`.
 *
 * Andy 06/08/2026: *"phần tính toán e nó lâu hiện lên quá"* / *"chậm"*. Vá xong số
 * từng dòng (`jpTinhDong`) mà để khối Tổng kết đứng im thì vẫn hụt đúng nửa việc —
 * mà `TIỀN MẶT THỰC NỘP` / `TỔNG NỘP` mới là số nhân viên đem đi nộp thật.
 *
 * ⚠️ MÁY CHỦ VẪN LÀ CHỐT CUỐI. Hàm này chỉ để NHÌN: nó KHÔNG ghi vào `APP.report`,
 * không gửi số nào lên. Nguyên tắc #1 của POSH v3 — mọi con số tiền do máy chủ tính.
 *
 * Bốn cái bẫy chép lại nguyên từ `jpCalcReport_`, đừng "dọn":
 *   ① dòng `HANG` KHÔNG sinh tiền — nó là đường thứ hai để đem so (`revHang`)
 *   ② dòng `STOCK` / `NGOAI` không sinh tiền
 *   ③ hoàn khách là TỔNG HAI NGUỒN: `refundAmt` từng dòng + `refundCustomer` ở header
 *   ④ `lechTienHang` chỉ gắn khi THẬT SỰ có dòng `HANG`, và phải TRỪ hoàn khách
 */
function jpTongXemTruoc() {
  /* ⚠️ `Lệch máy` và `Hoàn khách` KHÔNG nằm trong `APP.report` lúc đang gõ — chúng ở
     thẳng trong ô nhập, `collectPayload` cũng đọc từ đó. Đọc `APP.report` là lấy số
     đã nạp lúc mở báo cáo ⇒ gõ lệch máy vào mà TỔNG NỘP không nhúc nhích. */
  var oSo = function (id, cu) {
    var e = $(id);
    return e ? num(e.value) : num(cu);
  };
  var h = {
    adjMachine: oSo('inAdj', (APP.report || {}).adjMachine),
    refundCustomer: oSo('inRefund', (APP.report || {}).refundCustomer)
  };
  var revMeter = 0, revBank = 0, revHang = 0, coHang = false, hoanDong = 0;
  var lechTM = 0, coMay = false, coThucThu = false, thucThu = 0;

  APP.rows.forEach(function (r, ri) {
    var k = r.rowKind || 'MONEY';
    var o = jpXemTruoc(r);
    hoanDong += Math.abs(num(r.refundAmt));
    if (k === 'HANG') { coHang = true; revHang += num(o.ban) * num(o.gia); return; }
    if (k === 'STOCK' || k === 'NGOAI') return;
    /* ⚠️ Tính lệch cho CẢ `MONEY` (mẫu CHUNG) từ 30/08/2026 — cột "Thực thu" theo mã.
       `coThucThu` là chốt bảo vệ báo cáo ĐỜI CŨ: chưa đếm ô nào thì `adjMachine` vẫn là
       ô GÕ, ghi đè là mất số nhân viên đã gõ. */
    if (k === 'MAY' || k === 'MONEY') {
      if (k === 'MAY' && o.goTay) coMay = true;
      if (!jpTrongO(r.cashReal)) { coThucThu = true; thucThu += num(r.cashReal); }
      lechTM += num(o.lechTM);
    }
    revMeter += num(o.tien);
    revBank  += num(r.bank);
  });

  /* Bảng tiền mẫu TÁCH: `adjMachine` KHÔNG đọc từ ô header nữa mà SUY RA từ Σ lệch
     từng dòng — đúng `jpCalcReport_`. Nhờ vậy `cashActual` gom đúng về
     `Σ tiền mặt THỰC TẾ − hoàn khách`, tức "tiền thực thu mới chính là tiền thu được".
     ⚠️ Chỉ khi CÓ dòng MAY. Mẫu chung không có dòng nào, đặt 0 là xoá số lệch máy
     nhân viên vừa gõ ở header. */
  if (coMay || coThucThu) h.adjMachine = lechTM;

  var refund = Math.abs(num(h.refundCustomer)) + Math.abs(hoanDong);
  var revCashMeter = revMeter - revBank;
  var cashActual   = revCashMeter + num(h.adjMachine) - refund;
  var revMeterRong = revMeter - refund;

  return {
    revMeter: revMeter, revBank: revBank, revCashMeter: revCashMeter,
    refundRows: hoanDong, refundTotal: refund,
    adjMachine: num(h.adjMachine), adjTuDong: coMay || coThucThu,
    /* ⚠️ `coThucThu` đi kèm để màn hình phân biệt "đếm được 0đ" với "CHƯA đếm" — hai
       thứ khác nhau, và in 0đ cho trường hợp thứ hai là nói sai. */
    thucThu: thucThu, coThucThu: coThucThu,
    cashActual: cashActual, totalSubmit: cashActual + revBank,
    revHang: coHang ? revHang : 0, revMeterRong: revMeterRong,
    lechTienHang: coHang ? (revMeterRong - revHang) : 0, coBangTong: coHang
  };
}

/** Vẽ lại riêng khối Tổng kết — cho hai ô `Lệch máy` / `Hoàn khách` ở header. */
function jpTongLai() { paintTotals(jpTongXemTruoc()); }

function paintTotals(t) {
  if (!t) return;
  /*
   * Mẫu TÁCH: ô "Lệch máy" ở header là số SUY RA (Σ lệch tiền mặt từng dòng), nên
   * phải khoá lại và in số đã suy vào chính ô đó.
   *
   * ⚠️ Không in vào là trên một màn có hai con số "lệch": ô header giữ số cũ nhân
   * viên từng gõ, còn TỔNG PHẢI NỘP tính theo số suy ra. Đúng bẫy "hai số cùng tên
   * trên một màn" đã mắc ở màn đối soát.
   * ⚠️ Và phải khoá thật (`readonly`), không chỉ in: gõ thêm vào ô đó là **đếm hai
   * lần** đúng phần lệch — máy chủ cũng ghi đè nên số gõ mất luôn, im lặng.
   */
  var oAdj = $('inAdj');
  if (oAdj && t.adjTuDong) {
    oAdj.readOnly = true;
    oAdj.title = 'Tự cộng từ cột Lệch của bảng tiền — không gõ tay';
    if (num(oAdj.value) !== num(t.adjMachine)) oAdj.value = t.adjMachine;
    var nhac = $('adjTuDong');
    if (nhac) nhac.classList.remove('hidden');
  }
  $('sRev').textContent = money(t.revMeter) + 'đ';
  $('sBank').textContent = money(t.revBank) + 'đ';
  $('sCashMeter').textContent = money(t.revCashMeter) + 'đ';
  /* ⚠️ CHƯA ĐẾM ô nào thì in "— chưa đếm", KHÔNG in "0đ". In 0đ là nói rằng đã đếm và
     đếm được 0 — nhân viên đọc xong tưởng mình đang nợ cả kỳ tiền. Cùng luật "ô trống là
     CHƯA NHẬP, không phải số 0" đã chốt ở `jpNumOrBlank_`. */
  $('sThucThu').textContent = t.coThucThu
    ? money(t.thucThu) + 'đ' : '— chưa đếm';
  $('sCash').textContent = money(t.cashActual) + 'đ';
  $('sTotal').textContent = money(t.totalSubmit) + 'đ';
  paintBangTong(t);
}

function paintWarnings() {
  var all = [];
  /* Cảnh báo của HEAD (lệch bảng tổng, thiếu lý do lệch máy / hoàn khách) phải hiện
     ở ĐÂY. Trước đây chỉ gom cảnh báo từng dòng, nên "bảng tổng lệch" chỉ thấy được
     nếu nhân viên tự trừ hai số ở bảng tổng — mà đó chính là số cần đập vào mắt. */
  (APP.headWarns || []).forEach(function (w) {
    all.push({ where: 'CẢ BÁO CÁO', w: w });
  });
  APP.rows.forEach(function (r) {
    (r.warns || []).forEach(function (w) {
      /* Dòng hàng không có `machineCode` — dùng mã hàng, không thì 54 mã đều hiện
         "Ô chưa đặt tên" và không biết cảnh báo thuộc mã nào */
      all.push({ where: r.machineCode || r.itemCode || 'Ô chưa đặt tên', w: w });
    });
  });

  var box = $('warnBox');
  if (!all.length) { box.classList.add('hidden'); return; }
  box.classList.remove('hidden');
  $('warnNum').textContent = all.length;
  $('warnList').innerHTML = all.map(function (x) {
    return '<div class="warnItem"><b>' + esc(x.where) + '</b> — ' + esc(x.w.msg) +
           (x.w.detail ? '<br><span class="sub">' + esc(x.w.detail) + '</span>' : '') + '</div>';
  }).join('');
}

/**
 * CHECKLIST TRƯỚC KHI NỘP (Andy chốt 05/08/2026: *"thêm checklist"*).
 *
 * Vì sao cần: trước bản này nhân viên bấm Nộp rồi máy chủ mới throw "còn ô chỉ số sau
 * trống" — tức phải bấm mới biết mình chưa xong, rồi cuộn đi tìm. Nay liệt kê sẵn.
 *
 * ⚠️ Phải dùng **ĐÚNG cùng một luật với `jpThieuChiSo_` ở máy chủ**. Client nới tay hơn
 * là nhân viên thấy "đủ hết" rồi bấm Nộp và bị chặn — mất hết niềm tin vào checklist.
 * Client siết hơn là chặn oan. Nên mỗi lần sửa `jpThieuChiSo_` thì sửa cả hàm này;
 * `test/browser/nopbc.js` khoá hai bên bằng cùng một fixture.
 *
 * ⚠️ **Checklist CHẶN, cảnh báo KHÔNG chặn** — hai thứ khác nhau, đừng gộp một khối.
 * Ảnh thiếu thì chỉ nhắc, không chặn (mạng ở mall hay hỏng — quy ước cũ của Andy).
 */
/* Bản client của `jpDongTrong_` (`00_Config`) — hai bản PHẢI cùng một chốt, phép 13 của
   `test/soat-tinh.py` so thân hai hàm. Client nới tay hơn là nhân viên thấy "đủ hết" rồi
   bấm Nộp và bị máy chủ chặn; client siết hơn là chặn oan. */
function jpDongTrong(r) {
  if (!r) return true;
  var co = function (v) { return String(v == null ? '' : v).trim() !== ''; };
  /* Co DANH TINH — hoac mot ghi chu go tay — thi khong phai dong trong.
     ⚠️ KHONG do `xuDaysJson`: may chu ghi chuoi `'[]'` vao do cho MOI dong. */
  if (co(r.machineId) || co(r.machineCode) ||
      co(r.itemCode)  || co(r.itemMisa)   || co(r.itemName) ||
      co(r.topupNote) || co(r.note)       || co(r.refundRowNote)) return false;
  /* ⚠️⚠️ DO BANG `> 0`, TUYET DOI KHONG DUNG phep o-trong — day la cho ban 26/08 sai
     va no chi chua duoc DUNG MAU TACH. `jpCalcMoneyRow_` ghi thang
     `row.amount = mAct * JP_RATE_MONEY_PULSE` (mot con SO, ra 0 voi dong chua ai go),
     chi nhanh go tay cua mau TACH moi di qua `jpNumOrBlank_` nen moi giu duoc o trong.
     ⇒ Voi mau CHUNG — tuc gan het he thong — cu LUU mot lan la `amount` thanh `0`,
     phep o-trong tra false, dong ma hoa thanh "dong co du lieu" va chan nop mai mai.
     Do dung la thu da xay ra: do tren sheet that 28/08/2026, 16/20 bao cao dang nhap
     do bi chan. Doi chung: dong COIN cua VICOM 3/2 co `mBefore 84855` `mAfter 85710`
     la so THAT, phai tiep tuc bi chan — bo qua no la mat doanh thu xu ca ky. */
  var o = ['mBefore', 'mAfter', 'cBefore', 'cAfter', 'amount', 'cash', 'bank',
           'cashReal', 'hOpen', 'hBefore', 'hAfter', 'soldQty', 'stockOut',
           'addQty1', 'addQty2', 'stockOpen', 'stockActual', 'defectQty',
           'returnQty', 'refundAmt', 'giaXu', 'xuTong'];
  for (var i = 0; i < o.length; i++) { if (num(r[o[i]]) > 0) return false; }
  return true;
}

function jpCheckTruocNop() {
  var thieu = [], nhac = [], trongBoQua = 0;

  APP.rows.forEach(function (r) {
    var k = r.rowKind || 'MONEY';
    if (k === 'STOCK' || k === 'NGOAI') return;
    /* ⚠️ PHẢI cùng luật với `jpDongTrong_` ở máy chủ (`00_Config`): dòng thêm ra rồi để
       trống thì KHÔNG chặn nộp. Chỉ đo DANH TÍNH, không đo ô tiền — ô tiền trống là CHƯA
       NHẬP. `test/soat-tinh.py` phép 13 so hai bản này. */
    if (jpDongTrong(r)) { trongBoQua++; return; }
    var ten = r.machineCode || r.itemName || r.itemMisa || r.itemCode || ('dòng ' + r.seq);

    if (k === 'HANG') {
      if (jpTrongO(r.soldQty)) thieu.push(ten + ' — chưa khai <b>số đã bán</b>');
      return;
    }
    /* Bảng tiền mẫu TÁCH không còn đồng hồ ⇒ chặn theo ô tiền. PHẢI cùng luật với
       `jpThieuChiSo_` ở máy chủ: client nới tay hơn là nhân viên thấy "đủ hết" rồi
       bấm và bị chặn — mất hết niềm tin vào checklist. Ô QR trống là 0, hợp lệ. */
    if (k === 'MAY' && jpMayGoTay(r)) {
      if (jpTrongO(r.amount))   thieu.push(ten + ' — chưa nhập <b>thành tiền</b>');
      if (jpTrongO(r.cash))     thieu.push(ten + ' — chưa nhập <b>tiền mặt app</b>');
      if (jpTrongO(r.cashReal)) thieu.push(ten + ' — chưa đếm <b>tiền mặt thực tế</b>');
      return;
    }
    if (jpTrongO(r.mAfter)) {
      thieu.push(ten + ' — chưa nhập <b>chỉ số sau</b>' + (k === 'COIN' ? ' (MONEY)' : ''));
    }
    if (k === 'COIN' && jpTrongO(r.cAfter)) {
      thieu.push(ten + ' — chưa nhập <b>chỉ số sau</b> (COIN)');
    }
  });

  if (!APP.rows.length) thieu.push('Chưa có dòng nào — bấm <b>Thêm ô / máy</b>');
  /* Dòng trống KHÔNG chặn, nhưng phải NÓI RA — im lặng bỏ qua là nhân viên tưởng mình đã
     khai dòng đó rồi. Nhắc, không chặn: cùng luật với ảnh thiếu. */
  if (trongBoQua) {
    nhac.push('Có <b>' + trongBoQua + ' dòng chưa gõ gì</b> — nộp vẫn được, dòng đó bị bỏ ' +
              'qua. Muốn gọn thì xoá đi.');
  }

  /*
   * LÝ DO cho lệch máy / hoàn khách — `jpSubmitReport` **chặn cứng** hai chỗ này, mà
   * checklist trước đây không nói gì cả: nhân viên đọc "✓ Đủ điều kiện nộp" rồi bấm
   * và bị chặn — đúng cái làm mất niềm tin vào checklist.
   *
   * ⚠️ Thành chuyện thường gặp từ 12/08/2026: ở mẫu TÁCH `adjMachine` **suy ra** từ
   * cột Lệch, nên chỉ cần một dòng đếm lệch là ô lý do trở thành bắt buộc. Phải đọc
   * số ĐÃ SUY (`jpTongXemTruoc`), đừng đọc ô `#inAdj` — ô đó chỉ là chỗ in ra.
   */
  var t = jpTongXemTruoc();
  var oNote = $('inAdjNote');
  /* ⚠️ Bản client của `jpQRVuotTien_` — hai bản phải cùng chốt, không thì nhân viên thấy
     "Đủ điều kiện nộp" rồi bấm và ăn lỗi từ máy chủ. Chốt `>` chứ không `>=`: QR BẰNG
     Thành tiền là hợp lệ (cả ca khách quét mã hết, tiền mặt bằng 0). */
  var qrTong = 0, ttTong = 0, coGt = false;
  APP.rows.forEach(function (r) {
    if ((r.rowKind || '') !== 'MAY' || !jpMayGoTay(r)) return;
    coGt = true;
    var qr = num(r.bank), tt = num(r.amount);
    qrTong += qr; ttTong += tt;
    if (qr > tt) {
      thieu.push((r.itemCode || r.itemMisa || ('dòng ' + r.seq)) +
        ' — <b>QR ' + money(qr) + 'đ lớn hơn Thành tiền ' + money(tt) + 'đ</b>. ' +
        'App báo "Thành tiền" đã gồm cả tiền mặt lẫn QR nên QR không thể lớn hơn');
    }
  });
  if (coGt && qrTong > ttTong) {
    thieu.push('Cả báo cáo: <b>tổng QR ' + money(qrTong) + 'đ lớn hơn tổng Thành tiền ' +
      money(ttTong) + 'đ</b> — để nguyên thì tiền phải nộp tính ra ÂM');
  }

  if (num(t.adjMachine) !== 0 && !String((oNote || {}).value || '').trim()) {
    thieu.push(t.adjTuDong
      ? 'Có <b>lệch tiền mặt ' + money(t.adjMachine) + 'đ</b> — phải ghi <b>Lý do lệch máy</b>'
      : 'Có lệch máy — phải ghi <b>Lý do lệch máy</b>');
  }
  var oRf = $('inRefundNote'), oRfSo = $('inRefund');
  if (num((oRfSo || {}).value) !== 0 && !String((oRf || {}).value || '').trim()) {
    thieu.push('Có hoàn khách — phải ghi <b>Lý do hoàn khách</b>');
  }

  /* Ảnh: NHẮC, không chặn — mạng ở mall hay hỏng (quy ước Andy chốt từ đầu) */
  var an = String(($('photoProgress') || {}).textContent || '');
  var mThieu = an.match(/thiếu\s+(\d+)/);
  if (mThieu) nhac.push('Còn thiếu <b>' + mThieu[1] + '</b> chỗ ảnh — vẫn nộp được');

  return { thieu: thieu, nhac: nhac };
}

function jpTrongO(v) { return v === '' || v === null || v === undefined; }

function paintCheckList() {
  var box = $('chkBox');
  if (!box) return;
  var c = jpCheckTruocNop();
  var nut = $('btnSubmit');

  var h = '';
  if (!c.thieu.length) {
    h = '<div class="chkOk">✓ Đủ điều kiện nộp' +
        (c.nhac.length ? ' — còn ' + c.nhac.length + ' chỗ nên xem' : '') + '</div>';
  } else {
    h = '<div class="chkBad">Còn <b>' + c.thieu.length + '</b> chỗ PHẢI điền mới nộp được:</div>';
  }
  h += c.thieu.map(function (t) { return '<div class="chkItem bad">✗ ' + t + '</div>'; }).join('');
  h += c.nhac.map(function (t) { return '<div class="chkItem warn">• ' + t + '</div>'; }).join('');

  $('chkList').innerHTML = h;
  $('chkNum').textContent = c.thieu.length ? c.thieu.length : '✓';
  box.className = 'card ' + (c.thieu.length ? 'chkCardBad' : 'chkCardOk');

  /* Nút Nộp mờ đi kèm LÝ DO. ⚠️ Không dùng `disabled`: bấm vào nút disabled thì không
     có sự kiện nào nên nhân viên không biết vì sao bấm không được. Để bấm được và
     `jpSubmit` nói ra lý do. */
  if (nut) {
    nut.classList.toggle('chuaDu', !!c.thieu.length);
    nut.title = c.thieu.length ? 'Còn ' + c.thieu.length + ' chỗ phải điền' : '';
  }
}

function jpSubmit() {
  if (!APP.canEdit) return;

  /* Chặn ở client cho nhanh, nhưng máy chủ VẪN chặn lần nữa (`jpThieuChiSo_`) —
     web ở ANYONE_ANONYMOUS nên client không bao giờ là chốt. */
  var c = jpCheckTruocNop();
  if (c.thieu.length) {
    toast('Chưa nộp được — còn ' + c.thieu.length + ' chỗ phải điền, xem khối "Trước khi nộp"');
    var box = $('chkBox');
    if (box && box.scrollIntoView) box.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }
  jpSaveDraft(false).then(function () {
    return srv('jpPhotoProgress', APP.token, APP.report.id);
  }).then(function (p) {
    var msg = 'Nộp báo cáo?';
    if (p.missing) msg = 'Còn thiếu ' + p.missing + ' chỗ ảnh.\nVẫn nộp?';
    if (!confirm(msg)) return null;
    busy(true, 'Đang nộp…');
    return srv('jpSubmitReport', APP.token, APP.report.id);
  }).then(function (r) {
    busy(false);
    if (!r) return;
    toast(r.msg);
    APP.dirty = false;
    jpXoaNhapMay();               // nop roi thi nhap tren may het viec
    show('scHome');
    loadMyReports();
  }).catch(function (e) { busy(false); toast(e.message); });
}
</script>
