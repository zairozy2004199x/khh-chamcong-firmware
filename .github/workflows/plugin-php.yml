# Chạy bộ thử của ba plugin WordPress mỗi lần push.
#
# VÌ SAO CÓ FILE NÀY
#   Trang Cài đặt của plugin chấm công đã lên hosting với một dòng `VHCC_Auth::VAI_TRO_VAO` —
#   hằng không tồn tại, PHP coi là lỗi nghiêm trọng, trang đứt ngay tại đó và mất luôn nút
#   "Lưu cài đặt" nằm phía dưới. Bộ thử tại chỗ đã có sẵn nhưng KHÔNG AI CHẠY trước khi đóng
#   gói, mà workflow firmware thì chỉ nổ khi sửa .ino nên không đụng tới.
#
#   Giờ mỗi lần push là chạy: soát tham chiếu tĩnh → cú pháp → bốn bộ thử.
name: Kiểm plugin WordPress

on:
  push:
    paths:
      - 'wordpress/**'
      - 'tools/test/**'
      - '.github/workflows/plugin-php.yml'
  pull_request:
    paths:
      - 'wordpress/**'
      - 'tools/test/**'
  workflow_dispatch:

jobs:
  kiem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, mbstring
          coverage: none

      - name: Cú pháp PHP mọi tệp plugin
        run: |
          set -eo pipefail
          # xargs trả 123 nếu có lượt nào hỏng, `set -e` bắt được. pipefail để mã thoát của
          # xargs không bị `grep` phía sau che mất.
          find wordpress -name '*.php' -print0 | xargs -0 -n1 php -l | grep -v 'No syntax errors' || true
          find wordpress -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Soát tham chiếu tĩnh (hằng/hàm không tồn tại = lỗi nghiêm trọng lúc vẽ trang)
        run: php tools/test/kiem-tham-chieu.php

      - name: Bộ thử chấm công
        run: php tools/test/test-cham-cong.php

      # Bài này đã có sẵn từ lâu nhưng KHÔNG AI CHẠY — đúng cái bẫy mà file workflow này sinh ra
      # để bịt (xem phần đầu). Nó canh cửa đăng nhập thứ hai của trạm và, từ 08/09/2026, canh cả
      # sổ đo tốc độ. Một bài kiểm không nằm trong CI thì chỉ là một tệp văn bản.
      - name: Bộ thử trạm chấm công
        run: php tools/test/kiem-tram.php

      - name: Bộ thử nhà ma (bán vé theo khung giờ)
        run: php tools/test/kiem-nha-ma.php

      # Plugin Vận Hành dựng lại app Firebase cũ, và bài này canh đúng hai chỗ bản cũ làm sai:
      # quyền hỏi máy chủ (bản cũ đọc localStorage), và tiền do máy chủ cộng (bản cũ tin con số
      # máy khách gửi lên). Hai chốt ấy mà tuột thì không có triệu chứng nào nhìn thấy được.
      - name: Bộ thử vận hành cơ sở
        run: php tools/test/kiem-van-hanh.php

      # `jpUploadPhoto` nhận base64 từ điện thoại rồi GHI THÀNH TỆP trong thư mục uploads —
      # thư mục web phục vụ công khai. Sai một lần ở đây là mất máy chủ, không phải mất một con
      # số. Bài này canh: soi ruột tệp chứ không tin nhãn `data:image/...`, tên tệp ngẫu nhiên,
      # và mọi đường đều qua cửa quyền kể cả đường chỉ có mỗi photoId.
      - name: Bộ thử ảnh JP Capsule
        run: php tools/test/kiem-jp-anh.php

      # Sổ kho đẻ ra con số 632 — thứ đi thẳng vào MISA và vào báo cáo đã ký. Sai ở đây không
      # hiện ra thành màn lỗi, nó hiện ra thành một con số hơi khác, ba tháng sau. Bài này canh
      # FIFO theo NGÀY, hai vế của lượt chuyển kho, chốt "không huỷ phiếu nhập đã bị ăn", và
      # phép đối chiếu lớp tồn với chứng từ (hai đường độc lập, lệch thì phải BÁO).
      - name: Bộ thử kho hai tầng JP Capsule
        run: php tools/test/kiem-jp-kho.php

      # BẢN ĐẾM của cả cuộc chuyển JP: đọc thẳng 15 tệp giao diện, bóc ra mọi tên hàm mà giao
      # diện thật sự gọi, rồi đòi "đã chuyển + chưa chuyển = đúng danh sách ấy". Không có bài
      # này thì `jpKhoBangKeNhap`/`jpKhoBangKeXuat` còn nằm ngoài cả hai bảng, và cổng trả
      # "Lệnh không hợp lệ" cho một màn có thật.
      - name: Bộ thử cổng JP Capsule (đối chiếu với giao diện)
        run: php tools/test/kiem-jp-cong.php

      # Sổ 632 và công nợ NCC là thứ đem đi đối chiếu với MISA. Chỗ sai không phải phép cộng mà
      # là: lọc hụt (`=== '632'` không khớp dòng `6321` nên sổ ra RỖNG), gộp nhầm (bốn đường
      # nhập không sinh công nợ mà bị cộng vào 331), và IM LẶNG khi dữ liệu hở — báo cáo đã
      # hoàn tất mà không có dòng giá vốn nào thì lãi gộp bị thổi lên đúng bằng phần thiếu.
      - name: Bộ thử sổ kế toán JP Capsule
        run: php tools/test/kiem-jp-so.php

      - name: Bộ thử chi phí
        run: php tools/test/test-flows.php

      - name: Bộ thử hợp đồng
        run: php tools/test/test-hop-dong.php

      - name: Bộ thử ghế massage
        run: php tools/test/test-ghe.php

      - name: Bộ thử trang cổng
        run: php tools/test/test-trang-chu.php

      # `test-trang-chu.php` dựng một VHNB_Trang GIẢ bằng eval, nên đặt phép thử thanh điều hướng
      # vào đấy là canh chính cái giả ấy — mãi mãi xanh. Bài này nạp plugin nội bộ THẬT, nên nó
      # mới là bài canh hai mục vé nhà ma trong Cổng K&H. Ngoài CI thì chỉ là tệp văn bản.
      - name: Bộ thử cổng nội bộ (nạp plugin thật)
        run: php tools/test/kiem-noi-bo.php

      # Câu CREATE TABLE sai khe trắng thì dbDelta im lặng bỏ qua, bảng thiếu cột, và chỉ vỡ ra
      # khi có khách thật ghi vào. Bài này chạy thử mọi câu CREATE TABLE của mọi plugin.
      - name: Bộ thử sơ đồ bảng (dbDelta)
        run: php tools/test/kiem-so-do-bang.php

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 🔴 BẤM THẬT VÀO TRANG, không canh chuỗi trong mã.
      #    Ngày 23/08/2026 nút "Chốt ca" gọi vào một hàm khai lộn phạm vi: mã CÓ trong nguồn nên
      #    mọi phép thử canh chuỗi đều xanh, mà bấm thì không có gì xảy ra. Phép thử này nạp
      #    đoạn JS vào Node với một DOM giả rồi bấm đúng cái nút đó.
      - name: Bấm thử trang ghế (JS chạy thật)
        run: node tools/test/bam-thu-trang-ghe.js wordpress/vhcp-ghe/includes/class-vhg-trang.php

      # Cùng lý do với bài bấm thử trang ghế, nhưng chạy trong Chromium thật. Bài PHP canh máy
      # chủ; bài này canh việc TRANG có gửi đúng thứ lên không — nhất là chuyện nó KHÔNG được
      # tự tính tổng tiền rồi gửi lên, đúng chỗ bản Firebase cũ làm sai.
      # Không có Chromium thì bài tự bỏ qua (thoát 0) chứ không làm đỏ CI.
      - name: Bấm thử trang vận hành (Chromium)
        run: |
          npm install --no-save playwright >/dev/null 2>&1 || true
          node tools/test/bam-thu-van-hanh.js

      - name: Bộ thử Apps Script (ghi song song, nhóm chi phí)
        run: |
          set -e
          node tools/test/test-ghi-song-song.js
          node tools/test/test-nhom-chi-phi.js

      - name: Đóng gói thử — bản cài phải dựng được và sạch bí mật
        run: bash tools/build-plugin-zip.sh
