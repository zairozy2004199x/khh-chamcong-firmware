# Đưa web app "Báo cáo chi phí" (thư mục web_baocao_chiphi/) lên GitHub Pages.
#
# Bật 1 lần trong repo: Settings → Pages → Build and deployment → Source = "GitHub Actions".
# Sau đó mỗi lần push vào main có thay đổi trong web_baocao_chiphi/ là tự deploy.
# Địa chỉ: https://<chủ-repo>.github.io/khh-chamcong-firmware/           (kế toán)
#          https://<chủ-repo>.github.io/khh-chamcong-firmware/nhap.html  (nhân viên nhập chi phí)
#
# Trang web KHÔNG chứa bí mật: URL API và mã truy cập do người dùng nhập vào trình duyệt của mình.
name: Deploy web báo cáo chi phí (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'web_baocao_chiphi/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kiểm thử engine
        run: node web_baocao_chiphi/test/engine.test.js
      - name: Chuẩn bị thư mục deploy
        run: |
          mkdir -p _site
          cp -r web_baocao_chiphi/* _site/
          rm -rf _site/test _site/backend
          # README của thư mục web không cần lên trang; giữ hướng dẫn backend trong repo
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
