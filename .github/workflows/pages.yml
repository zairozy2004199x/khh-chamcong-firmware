# Đưa các web app kế toán lên GitHub Pages.
#
# Bật 1 lần trong repo: Settings → Pages → Build and deployment → Source = "GitHub Actions".
# Sau đó mỗi lần push vào main có thay đổi trong web_baocao_chiphi/ hoặc web_uynhiemchi/ là tự deploy.
# Địa chỉ: https://<chủ-repo>.github.io/khh-chamcong-firmware/               (báo cáo chi phí — kế toán)
#          https://<chủ-repo>.github.io/khh-chamcong-firmware/nhap.html      (nhân viên nhập chi phí)
#          https://<chủ-repo>.github.io/khh-chamcong-firmware/uy-nhiem-chi/  (ủy nhiệm chi & công nợ)
#
# Trang web KHÔNG chứa bí mật: URL API và mã truy cập do người dùng nhập vào trình duyệt của mình.
# Riêng trang ủy nhiệm chi không gọi máy chủ nào cả, file Excel chỉ được đọc trên máy người dùng.
name: Deploy web app kế toán (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'web_baocao_chiphi/**'
      - 'web_uynhiemchi/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kiểm thử engine báo cáo chi phí
        run: node web_baocao_chiphi/test/engine.test.js
      - name: Kiểm thử engine ủy nhiệm chi
        run: node web_uynhiemchi/test/engine.test.js
      - name: Chuẩn bị thư mục deploy
        run: |
          mkdir -p _site/uy-nhiem-chi
          cp -r web_baocao_chiphi/* _site/
          rm -rf _site/test _site/backend
          cp -r web_uynhiemchi/* _site/uy-nhiem-chi/
          rm -rf _site/uy-nhiem-chi/test
          # README của thư mục web không cần lên trang; giữ hướng dẫn backend trong repo
          rm -f _site/README.md _site/uy-nhiem-chi/README.md
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
