# Tự biên dịch firmware máy chấm công và phát hành file .bin để bấm cập nhật từ xa.
#
# Repo này CÔNG KHAI, và nó tự phát hành bản của CHÍNH NÓ bằng GITHUB_TOKEN có sẵn —
# KHÔNG cần Personal Access Token, KHÔNG cần đặt secret hay variable nào.
# Web app đọc  https://github.com/<chu>/<repo>/releases/download/latest/latest.json  (tag cố định).
#
# VÌ SAO CÓ FILE NÀY
#   - Trước đây sửa .ino xong phải mở Arduino IDE compile rồi mang file tới từng máy.
#   - Nay push là CI compile luôn: SAI CODE LÀ BIẾT NGAY, không phải chờ tới lúc nạp mới vỡ.
#   - File .bin build ở đây KHÔNG CHỨA BÍ MẬT (secrets.ci.h toàn placeholder) nên đặt được ở
#     chỗ tải công khai — điều kiện bắt buộc vì máy tải firmware KHÔNG kèm xác thực.
#
# ⚠️ Máy phải chạy bản 2026-07-30c (bản A) TRƯỚC ÍT NHẤT 1 LẦN. Bản đó chép bí mật vào bộ nhớ
#    trong (NVS); OTA không ghi đè NVS. Máy chưa qua bước đó mà nhận bản CI thì mất cấu hình.
name: Build firmware ESP32

on:
  push:
    branches: [main]
    paths:
      - 'esp32_hik_chamcong_full/**'
      - 'esp32_ota_updater/**'
      - 'esp32_ghe_massage/**'
      - 'esp32_posh_qr/**'
      - 'esp32_cau_ict/**'
      - 'esp32_nap_pic/**'
      - '.github/workflows/firmware.yml'
  workflow_dispatch:

env:
  SKETCH: esp32_hik_chamcong_full
  # Y NGUYÊN cấu hình anh Thắng build ở máy (đọc từ build/…/build.options.json của bản 28/07).
  # Lệch PartitionScheme là .bin có thể KHÔNG VỪA phân vùng đang chạy -> OTA không bao giờ xong.
  FQBN: esp32:esp32:esp32:CPUFreq=240,FlashFreq=80,FlashMode=qio,FlashSize=4M,PartitionScheme=default,DebugLevel=none,PSRAM=disabled,LoopCore=1,EventsCore=1
  CORE_VER: 3.3.10
  # PartitionScheme=default -> app0 = 0x140000. Quá cỡ này là KHÔNG nạp được.
  APP_MAX: 1310720

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Cai arduino-cli
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh -s 1.4.0
          echo "$PWD/bin" >> $GITHUB_PATH

      - name: Cache core + thu vien
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: acli-esp32-${{ env.CORE_VER }}-v3

      - name: Cai core ESP32 + thu vien
        run: |
          set -e
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls \
            https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@${CORE_VER}
          # Ghim phien ban thu vien: doi ban moi ma khong biet la mot kieu "tu nhien hong"
          arduino-cli lib install "ArduinoJson@7.2.0" "TFT_eSPI@2.5.43" "TJpg_Decoder@1.1.0"

      - name: Cau hinh man CYD cho TFT_eSPI
        run: |
          set -e
          LIB=$(find "$HOME/Arduino/libraries" -maxdepth 1 -type d -name 'TFT_eSPI*' | head -1)
          [ -n "$LIB" ] || { echo "KHONG thay thu vien TFT_eSPI"; exit 1; }
          # Ghi de User_Setup.h bang ban trong repo -> CI build GIONG may anh Thang.
          # Khong lam buoc nay thi .bin nap duoc nhung MAN HINH CHET (sai chan/driver).
          cp "$SKETCH/ci/User_Setup.h" "$LIB/User_Setup.h"
          echo "Da ap User_Setup.h cho $LIB"

      - name: Dat secrets.h PLACEHOLDER (co y - .bin phai sach bi mat)
        run: |
          set -e
          cp "$SKETCH/ci/secrets.ci.h" "$SKETCH/secrets.h"
          echo "secrets.h = placeholder; may lay bi mat tu NVS."

      - name: Compile
        run: |
          # ⚠️ pipefail BẮT BUỘC: "arduino-cli … | tee" tra ve ma cua TEE, nen compile hong ma
          #    buoc van XANH roi buoc sau bao "khong co .bin" — dung cai bay da ghi trong CLAUDE.md.
          set -eo pipefail
          # Log day hang nghin dong canh bao ArduinoJson -> dong loi that bi chim.
          # Hong thi in RIENG cac dong loi ra cuoi log cho de tim.
          if ! arduino-cli compile --fqbn "$FQBN" --warnings default \
                 --build-path "$PWD/fwbuild" "$SKETCH" 2>&1 | tee compile.log; then
            echo "===== CHI CAC DONG LOI ====="
            grep -nE 'error:|Error during build|exceeds|undefined reference|No such file' compile.log | head -40
            echo "===== HET ====="
            exit 1
          fi
          echo "--- File build sinh ra ---"
          ls -la fwbuild/ | head -20

      - name: Kiem .bin - sach bi mat va vua phan vung
        run: |
          set -e
          BIN="fwbuild/$SKETCH.ino.bin"
          [ -f "$BIN" ] || { echo "KHONG co file .bin"; exit 1; }
          SZ=$(stat -c%s "$BIN")
          PCT=$(( SZ * 100 / APP_MAX ))
          echo "Kich thuoc .bin: $SZ / $APP_MAX byte ($PCT%)"
          if [ "$SZ" -gt "$APP_MAX" ]; then
            echo "::error::.bin $SZ byte > phan vung app $APP_MAX byte. KHONG nap duoc."
            echo "::error::Doi PartitionScheme sang min_spiffs thi PHAI nap lai TAT CA may bang USB"
            echo "::error::(bang phan vung nam ngoai vung app, OTA khong doi duoc)."
            exit 1
          fi
          [ "$PCT" -ge 90 ] && echo "::warning::.bin da dung $PCT% phan vung app - sap het cho."
          # Chan lo bi mat: neu .bin lot bat ky dau vet nao thi DUNG, khong phat hanh.
          fail=0
          for pat in 'AKfycb' 'default-rtdb' 'khhcm-chamcong' 'firebaseio' 'databaseio'; do
            if grep -aqF "$pat" "$BIN"; then echo "::error::.bin CO chua '$pat' - khong duoc phat hanh cong khai"; fail=1; fi
          done
          [ "$fail" = "0" ] || exit 1
          echo "OK: .bin khong chua link/token nao."
          mkdir -p out
          VER="$(date -u +%Y-%m-%d)-${GITHUB_SHA::7}"
          cp "$BIN" "out/chamcong-$VER.bin"
          echo "VER=$VER" >> $GITHUB_ENV
          echo "SZ=$SZ"   >> $GITHUB_ENV

      - name: Luu file de tai tay (du phong)
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ env.VER }}
          path: out/*.bin

      # ⚠️ 01/08/2026 — .bin PHAI co link raw, KHONG dung link release.
      #    Do that: link release  125 ky tu -> HTTP 302 -> redirect dai 943 KY TU.
      #    Module 4G A7680C chet o khoang 532 ky tu (loi 706, da do khi lam whoami), nen may
      #    chay 4G KHONG BAO GIO tai duoc firmware qua link release. Cap nhat tu xa vo dung.
      #    raw.githubusercontent.com tra HTTP 200 THANG, khong redirect, link chi 100 ky tu.
      #    De history khong phinh (moi ban .bin ~1,2 MB), day len nhanh 'bin' bang commit MO COI
      #    roi force-push: nhanh do luon chi co DUNG 1 commit, khong tich luy.
      - name: Day .bin len nhanh 'bin' (de co link raw, khong redirect)
        env:
          PUB: ${{ github.repository }}
        run: |
          set -e
          BIN="out/chamcong-$VER.bin"
          [ -f "$BIN" ] || { echo "::error::Khong co $BIN"; exit 1; }
          mkdir -p /tmp/binbr && cp "$BIN" /tmp/binbr/chamcong-latest.bin
          printf 'ver=%s\ncommit=%s\nsize=%s\n' "$VER" "$GITHUB_SHA" "$SZ" > /tmp/binbr/thongtin.txt
          echo 'Nhanh nay CHI chua file .bin de may cham cong tai qua link raw (khong redirect).' > /tmp/binbr/README.md
          echo 'Nhanh bi force-push moi lan build, dung dat gi khac vao day.' >> /tmp/binbr/README.md
          cd /tmp/binbr
          git init -q
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b bin
          git add -A && git commit -q -m "bin $VER ($GITHUB_SHA)"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/$PUB.git" bin
          echo "Da day .bin len nhanh 'bin'."
          # Kiem THAT: link raw phai tra 200 va KHONG redirect. Khong dat thi bao do ngay,
          # dung de latest.json tro vao link chet roi cha ai biet.
          RAW="https://raw.githubusercontent.com/$PUB/bin/chamcong-latest.bin"
          echo "RAW=$RAW  (${#RAW} ky tu)"
          for i in 1 2 3 4 5 6; do
            sleep 5
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "$RAW" || echo 0)
            NRED=$(curl -s -o /dev/null -w '%{num_redirects}' "$RAW" || echo 9)
            echo "  thu $i: http=$CODE redirects=$NRED"
            [ "$CODE" = "200" ] && [ "$NRED" = "0" ] && break
          done
          [ "$CODE" = "200" ] || { echo "::error::Link raw khong tra 200 -> may 4G se khong tai duoc."; exit 1; }
          [ "$NRED" = "0" ]   || { echo "::error::Link raw CO redirect -> URL se dai qua gioi han AT."; exit 1; }
          [ "${#RAW}" -le 300 ] || { echo "::error::Link raw dai ${#RAW} ky tu, qua gioi han an toan cua module."; exit 1; }
          echo "RAW=$RAW" >> $GITHUB_ENV

      - name: Phat hanh ban moi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUB: ${{ github.repository }}
        run: |
          set -e
          BIN="out/chamcong-$VER.bin"
          # latest.json: web app doc file nay de tu dien san phien ban + link (khong can token).
          # Dung jq chu khong heredoc: dong ket thuc heredoc phai o cot 1, ma the la vo khoi "run: |" cua YAML.
          # url = link RAW (khong redirect). urlRelease giu lai de nguoi TAI TAY cho de.
          jq -n --arg ver "$VER" \
                --arg url "$RAW" \
                --arg urlRelease "https://github.com/$PUB/releases/download/$VER/chamcong-$VER.bin" \
                --argjson size "$SZ" --arg commit "$GITHUB_SHA" --arg repo "$PUB" \
                '{loai:"may-chinh", ver:$ver, url:$url, urlRelease:$urlRelease, size:$size, commit:$commit, repo:$repo}' > out/latest.json
          cat out/latest.json
          gh release create "$VER" "$BIN" "out/latest.json" \
            --repo "$PUB" --title "chamcong $VER" \
            --notes "Firmware may cham cong - build tu $PUB@${GITHUB_SHA::7}. KHONG chua bi mat (may lay tu NVS)." \
            || gh release upload "$VER" "$BIN" "out/latest.json" --repo "$PUB" --clobber
          # latest.json o tag co dinh 'latest' -> web app chi can 1 link khong doi
          gh release create latest "out/latest.json" --repo "$PUB" --title "latest" \
            --notes "Tro toi ban moi nhat. Web app doc file nay." \
            || gh release upload latest "out/latest.json" --repo "$PUB" --clobber
          echo "Da phat hanh $VER"

  # Máy trạm ("thợ nạp"): CHỈ kiểm biên dịch, không phát hành.
  # Sketch này trước 30/07/2026 CHƯA TỪNG được compile kiểm lần nào.
  updater:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Cai arduino-cli
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh -s 1.4.0
          echo "$PWD/bin" >> $GITHUB_PATH

      - name: Cache core + thu vien
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: acli-esp32-${{ env.CORE_VER }}-v3

      - name: Cai core ESP32 + thu vien
        run: |
          set -e
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls \
            https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@${CORE_VER}
          arduino-cli lib install "ArduinoJson@7.2.0" "TFT_eSPI@2.5.43" "TJpg_Decoder@1.1.0"

      - name: Cau hinh man CYD + secrets placeholder
        run: |
          set -e
          LIB=$(find "$HOME/Arduino/libraries" -maxdepth 1 -type d -name 'TFT_eSPI*' | head -1)
          [ -n "$LIB" ] || { echo "KHONG thay thu vien TFT_eSPI"; exit 1; }
          # Dung CHUNG User_Setup.h voi may cham cong -> 1 dinh nghia duy nhat cho ca 2 sketch
          cp esp32_hik_chamcong_full/ci/User_Setup.h "$LIB/User_Setup.h"
          cp esp32_ota_updater/ci/secrets.ci.h esp32_ota_updater/secrets.h

      - name: Compile may tram
        run: |
          # pipefail: "arduino-cli | tee" tra ve ma cua TEE -> compile hong ma buoc van xanh.
          set -eo pipefail
          if ! arduino-cli compile --fqbn "$FQBN" --warnings default \
                 --build-path "$PWD/upbuild" esp32_ota_updater 2>&1 | tee up.log; then
            echo "===== CHI CAC DONG LOI ====="
            grep -nE 'error:|Error during build|exceeds|undefined reference|No such file' up.log | head -40
            echo "===== HET ====="
            exit 1
          fi
          BIN="upbuild/esp32_ota_updater.ino.bin"
          [ -f "$BIN" ] || { echo "KHONG co file .bin"; ls -la upbuild/ | head; exit 1; }
          SZ=$(stat -c%s "$BIN")
          echo "May tram .bin: $SZ / $APP_MAX byte ($(( SZ * 100 / APP_MAX ))%)"
          [ "$SZ" -le "$APP_MAX" ] || { echo "::error::.bin may tram qua co phan vung app"; exit 1; }
          # Ban nay cung phai sach bi mat (may tram lay tu NVS)
          for pat in 'AKfycb' 'default-rtdb' 'khhcm-chamcong'; do
            if grep -aqF "$pat" "$BIN"; then echo "::error::.bin may tram CO chua '$pat'"; exit 1; fi
          done
          echo "OK: .bin may tram sach bi mat va vua phan vung."

      - name: Luu file may tram
        uses: actions/upload-artifact@v4
        with:
          name: thonap-${{ github.sha }}
          path: upbuild/esp32_ota_updater.ino.bin

      - name: Phat hanh ban may tram
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUB: ${{ github.repository }}
        run: |
          set -e
          # ⚠️ TAG RIENG 'latest-tram', TEN FILE RIENG 'thonap-*.bin', va latest-tram.json mang
          #    "loai":"may-tram". Ba thu nay de MAY TRAM khong bao gio nap nham firmware may
          #    cham cong vao chinh no — firmware tu choi neu loai khong khop.
          mkdir -p outtram
          VER="tram-$(date -u +%Y-%m-%d)-${GITHUB_SHA::7}"
          BIN="outtram/thonap-$VER.bin"
          cp upbuild/esp32_ota_updater.ino.bin "$BIN"
          SZ=$(stat -c%s "$BIN")
          jq -n --arg ver "$VER" \
                --arg url "https://github.com/$PUB/releases/download/$VER/thonap-$VER.bin" \
                --argjson size "$SZ" --arg commit "$GITHUB_SHA" --arg repo "$PUB" \
                '{loai:"may-tram", ver:$ver, url:$url, size:$size, commit:$commit, repo:$repo}' > outtram/latest-tram.json
          cat outtram/latest-tram.json
          gh release create "$VER" "$BIN" "outtram/latest-tram.json" \
            --repo "$PUB" --title "may tram $VER" \
            --notes "Firmware MAY TRAM (tho nap) - build tu $PUB@${GITHUB_SHA::7}. KHONG chua bi mat." \
            || gh release upload "$VER" "$BIN" "outtram/latest-tram.json" --repo "$PUB" --clobber
          gh release create latest-tram "outtram/latest-tram.json" --repo "$PUB" --title "latest-tram" \
            --notes "Tro toi ban may tram moi nhat. Chi MAY TRAM doc file nay." \
            || gh release upload latest-tram "outtram/latest-tram.json" --repo "$PUB" --clobber
          echo "Da phat hanh $VER" 

  # ==========================================================================
  #  BỘ QR GHẾ MASSAGE (esp32_ghe_massage) — build + PHÁT HÀNH.
  #    · app.bin    -> release tag 'latest-ghe' (loai:"ghe") cho CON THỢ NẠP tự tải + OTA.
  #    · merged.bin -> cùng release, cho TRANG NẠP USB (Web Serial) — Admin tải rồi upload.
  #  Ghế dùng Update.h (OTA 2 phân vùng app) -> PartitionScheme=default như máy chấm công.
  # ==========================================================================
  ghe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Cai arduino-cli
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh -s 1.4.0
          echo "$PWD/bin" >> $GITHUB_PATH

      - name: Cache core + thu vien
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: acli-esp32-${{ env.CORE_VER }}-v3

      - name: Cai core ESP32 + thu vien
        run: |
          set -e
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls \
            https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@${CORE_VER}
          # Ghe: TFT_eSPI (VLW smooth font) + cam ung XPT2046 + ArduinoJson. QR dung esp_qrcode san trong core.
          arduino-cli lib install "ArduinoJson@7.2.0" "TFT_eSPI@2.5.43" "XPT2046_Touchscreen@1.4.0"

      - name: Cau hinh man CYD cho TFT_eSPI (co SMOOTH_FONT)
        run: |
          set -e
          LIB=$(find "$HOME/Arduino/libraries" -maxdepth 1 -type d -name 'TFT_eSPI*' | head -1)
          [ -n "$LIB" ] || { echo "KHONG thay thu vien TFT_eSPI"; exit 1; }
          # ⚠️ User_Setup.h RIENG cua ghe: CO #define SMOOTH_FONT (font VLW vang/co dau).
          #    Thieu -> loi 'class TFT_eSPI has no member named loadFont'.
          cp esp32_ghe_massage/ci/User_Setup.h "$LIB/User_Setup.h"
          grep -q SMOOTH_FONT "$LIB/User_Setup.h" || { echo "::error::User_Setup.h thieu SMOOTH_FONT"; exit 1; }
          echo "Da ap User_Setup.h (SMOOTH_FONT) cho $LIB"

      - name: Dat secrets.h PLACEHOLDER (co y - .bin phai sach bi mat)
        run: cp esp32_ghe_massage/ci/secrets.ci.h esp32_ghe_massage/secrets.h

      - name: Compile
        run: |
          set -eo pipefail
          if ! arduino-cli compile --fqbn "$FQBN" --warnings default \
                 --build-path "$PWD/ghebuild" esp32_ghe_massage 2>&1 | tee ghe.log; then
            echo "===== CHI CAC DONG LOI ====="
            grep -nE 'error:|Error during build|exceeds|undefined reference|No such file' ghe.log | head -40
            echo "===== HET ====="
            exit 1
          fi
          echo "--- File build sinh ra ---"
          ls -la ghebuild/ | grep -E '\.bin' | head

      - name: Kiem .bin app - sach bi mat va vua phan vung
        run: |
          set -e
          BIN="ghebuild/esp32_ghe_massage.ino.bin"
          [ -f "$BIN" ] || { echo "::error::KHONG co file .bin app"; ls -la ghebuild/ | head; exit 1; }
          SZ=$(stat -c%s "$BIN")
          PCT=$(( SZ * 100 / APP_MAX ))
          echo "Ghe app .bin: $SZ / $APP_MAX byte ($PCT%)"
          if [ "$SZ" -gt "$APP_MAX" ]; then
            echo "::error::.bin ghe $SZ byte > phan vung app $APP_MAX byte -> OTA khong nap duoc."
            exit 1
          fi
          [ "$PCT" -ge 90 ] && echo "::warning::.bin ghe da dung $PCT% phan vung app."
          # Ghe dung placeholder, khong co bi mat that; van quet cho chac.
          for pat in 'AKfycb' 'default-rtdb' 'khhcm-chamcong' 'firebaseio' 'databaseio'; do
            if grep -aqF "$pat" "$BIN"; then echo "::error::.bin ghe CO chua '$pat'"; exit 1; fi
          done
          echo "OK: .bin ghe sach bi mat va vua phan vung."

      - name: Gop merged.bin (cho nap USB Web Serial)
        run: |
          set -e
          python3 -m pip install --quiet --disable-pip-version-check esptool
          BOOTAPP=$(find "$HOME/.arduino15/packages/esp32/hardware/esp32" -name boot_app0.bin | head -1)
          [ -n "$BOOTAPP" ] || { echo "::error::Khong thay boot_app0.bin"; exit 1; }
          # Offset 4MB, PartitionScheme=default: bootloader 0x1000, partitions 0x8000,
          # boot_app0 0xe000, app 0x10000. --flash_*=keep giu dung mode/freq cua bootloader.
          python3 -m esptool --chip esp32 merge_bin -o merged.bin \
            --flash_mode keep --flash_freq keep --flash_size 4MB \
            0x1000  ghebuild/esp32_ghe_massage.ino.bootloader.bin \
            0x8000  ghebuild/esp32_ghe_massage.ino.partitions.bin \
            0xe000  "$BOOTAPP" \
            0x10000 ghebuild/esp32_ghe_massage.ino.bin
          ls -la merged.bin

      - name: Luu file de tai tay
        uses: actions/upload-artifact@v4
        with:
          name: ghe-${{ github.sha }}
          path: |
            ghebuild/esp32_ghe_massage.ino.bin
            merged.bin

      - name: Phat hanh ban ghe (tag latest-ghe)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUB: ${{ github.repository }}
        run: |
          set -e
          mkdir -p outghe
          VER="ghe-$(date -u +%Y-%m-%d)-${GITHUB_SHA::7}"
          APP="outghe/ghe-app-$VER.bin"
          MRG="outghe/ghe-merged-$VER.bin"
          cp ghebuild/esp32_ghe_massage.ino.bin "$APP"
          cp merged.bin "$MRG"
          SZ=$(stat -c%s "$APP")
          # latest-ghe.json: THO NAP doc file nay (FW_URL_GHE mac dinh). url = APP .bin (Update.h
          # ghi phan vung app). loai:"ghe" de tho nap tu choi neu dan nham firmware khac.
          jq -n --arg ver "$VER" \
                --arg url "https://github.com/$PUB/releases/download/$VER/ghe-app-$VER.bin" \
                --arg urlMerged "https://github.com/$PUB/releases/download/$VER/ghe-merged-$VER.bin" \
                --argjson size "$SZ" --arg commit "$GITHUB_SHA" --arg repo "$PUB" \
                '{loai:"ghe", ver:$ver, url:$url, urlMerged:$urlMerged, size:$size, commit:$commit, repo:$repo}' > outghe/latest-ghe.json
          cat outghe/latest-ghe.json
          gh release create "$VER" "$APP" "$MRG" "outghe/latest-ghe.json" \
            --repo "$PUB" --title "ghe $VER" \
            --notes "Firmware BO QR GHE - build tu $PUB@${GITHUB_SHA::7}. KHONG chua bi mat (may lay tu web)." \
            || gh release upload "$VER" "$APP" "$MRG" "outghe/latest-ghe.json" --repo "$PUB" --clobber
          # Tag co dinh 'latest-ghe' CHI giu latest-ghe.json (tro toi .bin cua ban $VER o tren) ->
          # tho nap + web chi can 1 link khong doi, khong tich .bin cu.
          gh release create latest-ghe "outghe/latest-ghe.json" --repo "$PUB" --title "latest-ghe" \
            --notes "Tro toi ban GHE moi nhat. Tho nap doc latest-ghe.json; url = app.bin, urlMerged = merged.bin." \
            || gh release upload latest-ghe "outghe/latest-ghe.json" --repo "$PUB" --clobber
          echo "Da phat hanh $VER"

  # ==========================================================================
  #  Hộp POSH QR (mở ghế massage bằng mã QR) — kiểm nhanh, KHÔNG cần arduino-cli.
  #  Chạy trước và tách riêng để hỏng là biết trong ~30 giây, khỏi chờ 3 phút cài core.
  # ==========================================================================
  poshqr-kiem-nhanh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kiem ma nguon khong dinh mau CI quet
        run: bash esp32_hik_chamcong_full/ci/kiem-mau-cam.sh
      - name: Test doc/kiem ma QR (chay tren may, khong can chip)
        run: bash esp32_posh_qr/ci/kiem-ma-qr.sh
      - name: Test khung lenh UART sang bo ghe
        run: bash esp32_posh_qr/ci/kiem-ict.sh
      - name: Bien dich kiem bang thu vien ESP32 gia
        run: bash esp32_posh_qr/ci/kiem-bien-dich.sh
      - name: Test giai ma khung MDB 9 bit
        run: bash esp32_cau_ict/ci/kiem-mdb.sh
      - name: Bien dich kiem cau nghe len ICT
        run: bash esp32_cau_ict/ci/kiem-bien-dich.sh
      - name: Test doc file .hex cua dsPIC
        run: bash esp32_nap_pic/ci/kiem-hex.sh
      - name: Bien dich kiem tho nap dsPIC
        run: bash esp32_nap_pic/ci/kiem-bien-dich.sh

  # Hộp POSH QR: biên dịch THẬT bằng arduino-cli. Chỉ kiểm + lưu file, KHÔNG phát hành —
  # hộp không có cơ chế tự tải firmware, thợ tải .bin ở đây rồi nạp qua trang /update.
  poshqr:
    runs-on: ubuntu-latest
    needs: poshqr-kiem-nhanh
    steps:
      - uses: actions/checkout@v4

      - name: Cai arduino-cli
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh -s 1.4.0
          echo "$PWD/bin" >> $GITHUB_PATH

      - name: Cache core
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: acli-esp32-${{ env.CORE_VER }}-v3

      - name: Cai core ESP32
        run: |
          set -e
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls \
            https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@${CORE_VER}

      - name: Dat secrets.h PLACEHOLDER (co y - .bin phai sach bi mat)
        run: cp esp32_posh_qr/ci/secrets.ci.h esp32_posh_qr/secrets.h

      - name: Compile
        run: |
          # pipefail BAT BUOC: "arduino-cli | tee" tra ve ma cua TEE -> compile hong ma buoc van xanh.
          set -eo pipefail
          if ! arduino-cli compile --fqbn "$FQBN" --warnings default \
                 --build-path "$PWD/qrbuild" esp32_posh_qr 2>&1 | tee qr.log; then
            echo "===== CHI CAC DONG LOI ====="
            grep -nE 'error:|Error during build|exceeds|undefined reference|No such file' qr.log | head -40
            echo "===== HET ====="
            exit 1
          fi

      - name: Kiem .bin - sach bi mat va vua phan vung
        run: |
          set -e
          BIN="qrbuild/esp32_posh_qr.ino.bin"
          [ -f "$BIN" ] || { echo "::error::KHONG co file .bin"; ls -la qrbuild/ | head; exit 1; }
          SZ=$(stat -c%s "$BIN")
          echo "Hop POSH QR .bin: $SZ / $APP_MAX byte ($(( SZ * 100 / APP_MAX ))%)"
          [ "$SZ" -le "$APP_MAX" ] || { echo "::error::.bin qua co phan vung app"; exit 1; }
          # .bin nay duoc tai cong khai tu Actions -> khong duoc chua bi mat nao.
          for pat in 'AKfycb' 'default-rtdb' 'khhcm-chamcong' 'firebaseio' 'databaseio'; do
            if grep -aqF "$pat" "$BIN"; then echo "::error::.bin CO chua '$pat'"; exit 1; fi
          done
          echo "OK: .bin sach bi mat va vua phan vung."

      - name: Luu file de tai tay
        uses: actions/upload-artifact@v4
        with:
          name: poshqr-${{ github.sha }}
          path: qrbuild/esp32_posh_qr.ino.bin

  # Cầu nghe lén ICT L70 <-> ghế: firmware MẠCH TẠM để học giao thức. Chỉ kiểm
  # biên dịch, không phát hành — nó không bao giờ nằm trong máy chạy thật.
  cauict:
    runs-on: ubuntu-latest
    needs: poshqr-kiem-nhanh
    steps:
      - uses: actions/checkout@v4
      - name: Cai arduino-cli
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh -s 1.4.0
          echo "$PWD/bin" >> $GITHUB_PATH
      - name: Cache core
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: acli-esp32-${{ env.CORE_VER }}-v3
      - name: Cai core ESP32
        run: |
          set -e
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls \
            https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@${CORE_VER}
      - name: Compile
        run: |
          set -eo pipefail
          if ! arduino-cli compile --fqbn "$FQBN" --warnings default \
                 --build-path "$PWD/caubuild" esp32_cau_ict 2>&1 | tee cau.log; then
            echo "===== CHI CAC DONG LOI ====="
            grep -nE 'error:|Error during build|exceeds|undefined reference|No such file' cau.log | head -40
            echo "===== HET ====="
            exit 1
          fi
          BIN="caubuild/esp32_cau_ict.ino.bin"
          [ -f "$BIN" ] || { echo "::error::KHONG co file .bin"; exit 1; }
          SZ=$(stat -c%s "$BIN")
          echo "Cau nghe len .bin: $SZ / $APP_MAX byte"
          [ "$SZ" -le "$APP_MAX" ] || { echo "::error::.bin qua co phan vung app"; exit 1; }
      - name: Luu file de tai tay
        uses: actions/upload-artifact@v4
        with:
          name: cauict-${{ github.sha }}
          path: caubuild/esp32_cau_ict.ino.bin

  # Thợ nạp dsPIC: chỉ kiểm biên dịch, không phát hành.
  nappic:
    runs-on: ubuntu-latest
    needs: poshqr-kiem-nhanh
    steps:
      - uses: actions/checkout@v4
      - name: Cai arduino-cli
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh -s 1.4.0
          echo "$PWD/bin" >> $GITHUB_PATH
      - name: Cache core
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: acli-esp32-${{ env.CORE_VER }}-v3
      - name: Cai core ESP32
        run: |
          set -e
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls \
            https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@${CORE_VER}
      - name: Compile
        run: |
          set -eo pipefail
          if ! arduino-cli compile --fqbn "$FQBN" --warnings default \
                 --build-path "$PWD/picbuild" esp32_nap_pic 2>&1 | tee pic.log; then
            echo "===== CHI CAC DONG LOI ====="
            grep -nE 'error:|Error during build|exceeds|undefined reference|No such file' pic.log | head -40
            echo "===== HET ====="
            exit 1
          fi
          BIN="picbuild/esp32_nap_pic.ino.bin"
          [ -f "$BIN" ] || { echo "::error::KHONG co file .bin"; exit 1; }
          SZ=$(stat -c%s "$BIN")
          echo "Tho nap dsPIC .bin: $SZ / $APP_MAX byte"
          [ "$SZ" -le "$APP_MAX" ] || { echo "::error::.bin qua co phan vung app"; exit 1; }
      - name: Luu file de tai tay
        uses: actions/upload-artifact@v4
        with:
          name: nappic-${{ github.sha }}
          path: picbuild/esp32_nap_pic.ino.bin
